# HR+ERP 시스템 (Node/Express) Render.com 배포 설정
# 영속 디스크(disk)를 반드시 mount해야 재배포·재시작 시 hr-data*.json이 초기화되지 않는다.
services:
  - type: web
    name: hr-erp-system
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: hr-erp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/hr-data.json
      # PostgreSQL을 쓰려면 DATABASE_URL을 설정하면 되며(그 경우 DATA_FILE은 무시됨),
      # 미설정 시 위 DATA_FILE 경로의 JSON 파일 모드로 동작한다.
      - key: BUDGET_DATA_FILE
        value: /var/data/budget-data.json
        # budget.js(사업계획/예산)는 DATABASE_URL 설정 여부와 무관하게 항상 이 파일을
        # 쓴다(전용 DB 테이블이 없음) — DATA_FILE과 같은 영속 디스크(/var/data)를
        # 가리키도록 반드시 설정해야, 코드 재배포(컨테이너 재빌드)로 작성 중이던
        # 사업계획이 사라지는 사고가 재발하지 않는다.
      - key: SESSION_SECRET
        generateValue: true
        # 로그인 세션 토큰 서명용 고정 시크릿. 미설정 시 서버가 재시작될 때마다 임의
        # 값으로 대체되어 기존 로그인 세션이 전부 무효화된다(전 직원 재로그인 필요).
        # generateValue:true로 최초 배포 시 Render가 자동으로 랜덤값을 생성해 고정한다.
