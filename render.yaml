# HR+ERP 시스템 (Node/Express) Render.com 배포 설정
# 영속 디스크(disk)를 반드시 mount해야 재배포·재시작 시 hr-data*.json이 초기화되지 않는다.
services:
  - type: web
    name: hr-erp-system
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: hr-erp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/hr-data.json
      # PostgreSQL을 쓰려면 DATABASE_URL을 설정하면 되며(그 경우 DATA_FILE은 무시됨),
      # 미설정 시 위 DATA_FILE 경로의 JSON 파일 모드로 동작한다.
      - key: BUDGET_DATA_FILE
        value: /var/data/budget-data.json
        # budget.js(사업계획/예산)는 DATABASE_URL이 설정돼 있으면 이 값을 무시하고
        # PostgreSQL(budget_store 테이블, schema.sql 참고)에 저장한다 — 2026-08-03
        # 실사용자 확인 결과 Persistent Disk(위 disk 블록)가 유료 플랜 전용이라
        # /var/data 자체가 마운트 안 되는 배포가 있었고, 그 경우 이 값이 가리키는
        # 경로가 존재하지 않아 재배포마다 사업계획 데이터가 사라졌기 때문이다.
        # 이 값은 DATABASE_URL을 쓰지 않는 자체호스팅/오프라인 단일회사 JSON 파일
        # 모드에서만 실제로 쓰이며, 그 모드에서는 DATA_FILE과 마찬가지로 영속 디스크
        # 경로를 가리켜야 재배포 시 초기화되지 않는다.
      - key: SESSION_SECRET
        generateValue: true
        # 로그인 세션 토큰 서명용 고정 시크릿. 미설정 시 서버가 재시작될 때마다 임의
        # 값으로 대체되어 기존 로그인 세션이 전부 무효화된다(전 직원 재로그인 필요).
        # generateValue:true로 최초 배포 시 Render가 자동으로 랜덤값을 생성해 고정한다.
