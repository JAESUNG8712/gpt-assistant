<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>인사평가 통합 시스템 — 데모</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;background:#0f172a;color:#f1f5f9;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;padding:32px 20px;max-width:420px;width:100%}
.logo{width:72px;height:72px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;margin:0 auto 20px}
h1{font-size:22px;font-weight:800;margin-bottom:6px}
p{font-size:13px;color:#94a3b8;margin-bottom:28px;line-height:1.6}
.badge{display:inline-block;background:#f59e0b;color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:16px}
.btn-start{display:block;width:100%;background:#2563eb;color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:14px;transition:background .15s}
.btn-start:hover{background:#1d4ed8}
.note{background:#1e293b;border-radius:10px;padding:14px 16px;font-size:12px;color:#94a3b8;text-align:left;line-height:1.8}
.note li{margin-left:16px}
.note strong{color:#e2e8f0}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">HR</div>
  <div class="badge">🔍 DEMO MODE</div>
  <h1>인사평가 통합 시스템</h1>
  <p>서버 없이 브라우저에서 바로 체험합니다.<br>모든 데이터는 이 기기에만 저장됩니다.</p>
  <a class="btn-start" href="index.html?demo=1">데모 시작하기</a>
  <div class="note">
    <strong>데모 특징</strong>
    <ul>
      <li>샘플 직원·KPI 데이터 기본 제공</li>
      <li>변경 내용 브라우저 자동 저장</li>
      <li>로그아웃해도 데이터 유지</li>
      <li>「초기화」 버튼으로 기본값 복원</li>
    </ul>
  </div>
</div>
</body>
</html>
