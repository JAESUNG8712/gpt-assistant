<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>인사평가 통합 시스템 v18.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;font-size:14px;background:#f1f5f9;color:#1e293b}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:210px;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:12px}
#content{flex:1;overflow-y:auto;padding:20px}
/* Login */
#login-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.login-box{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
.login-logo{width:60px;height:60px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;margin:0 auto 16px}
.test-accs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.ta-btn{padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;text-align:left;background:#f8fafc;transition:all .15s}
.ta-btn:hover{border-color:#93c5fd;background:#eff6ff}
.ta-role{font-size:11px;font-weight:700;color:#2563eb}.ta-id{font-size:11px;color:#64748b}
/* Sidebar */
.sb-logo{padding:14px 14px 10px;border-bottom:1px solid #1e293b}
.sb-logo-box{display:flex;align-items:center;gap:8px}
.sb-icon{width:32px;height:32px;background:#2563eb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0}
.sb-title{font-size:12px;font-weight:600;color:#e2e8f0;line-height:1.3}
.sb-ver{font-size:10px;color:#475569}
.sb-stage{margin:8px 10px;padding:8px 10px;border-radius:8px;font-size:11px;font-weight:600}
.sb-stage.goal{background:#1e3a5f;color:#93c5fd}.sb-stage.perf{background:#14532d;color:#86efac}
.sb-nav{padding:6px 8px;flex:1}
.sb-sec{font-size:10px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 4px}
.sb-btn{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:#94a3b8;transition:background .15s,color .15s;border:none;background:none;width:100%;text-align:left}
.sb-btn:hover{background:#1e293b;color:#e2e8f0}.sb-btn.active{background:#2563eb;color:#fff}
.sb-btn .si{font-size:14px;width:16px;text-align:center}
.sb-footer{padding:10px 12px;border-top:1px solid #1e293b;font-size:11px;color:#475569}
/* Cards */
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #f1f5f9}
.card-head h3{font-size:13px;font-weight:700;color:#1e293b}
.card-body{padding:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat-box{background:#fff;border-radius:10px;padding:14px;border:1px solid #e2e8f0}
.stat-box .num{font-size:22px;font-weight:700;color:#1e293b;margin-top:6px}
.stat-box .lbl{font-size:11px;color:#64748b;margin-top:3px}
.stat-box .ico{font-size:18px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn-primary:hover:not(:disabled){background:#1d4ed8}
.btn-secondary{background:#fff;color:#374151;border-color:#d1d5db}.btn-secondary:hover:not(:disabled){background:#f9fafb}
.btn-success{background:#16a34a;color:#fff;border-color:#16a34a}.btn-success:hover:not(:disabled){background:#15803d}
.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}.btn-danger:hover:not(:disabled){background:#b91c1c}
.btn-ghost{background:none;color:#6b7280;border-color:transparent}.btn-ghost:hover:not(:disabled){background:#f3f4f6;color:#374151}
.btn-warning{background:#d97706;color:#fff;border-color:#d97706}.btn-warning:hover:not(:disabled){background:#b45309}
.btn-indigo{background:#4f46e5;color:#fff;border-color:#4f46e5}.btn-indigo:hover:not(:disabled){background:#4338ca}
.btn-teal{background:#0f766e;color:#fff;border-color:#0f766e}.btn-teal:hover:not(:disabled){background:#0d6b63}
.btn-sm{padding:5px 10px;font-size:11px}.btn-lg{padding:10px 20px;font-size:13px}
/* Forms */
.fg{margin-bottom:12px}
.fl{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:4px}
.fl .req{color:#ef4444;margin-left:2px}
.fc{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;color:#1e293b;outline:none;transition:border .15s,box-shadow .15s;background:#fff}
.fc:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fc:read-only,.fc:disabled{background:#f8fafc;color:#64748b}
textarea.fc{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0 14px}
.cs2{grid-column:span 2}.cs3{grid-column:span 3}.cs4{grid-column:span 4}
/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg-gray{background:#f1f5f9;color:#475569}.bg-blue{background:#eff6ff;color:#1d4ed8}
.bg-green{background:#f0fdf4;color:#15803d}.bg-red{background:#fef2f2;color:#b91c1c}
.bg-yellow{background:#fefce8;color:#a16207}.bg-purple{background:#faf5ff;color:#7c3aed}
.bg-indigo{background:#eef2ff;color:#4338ca}.bg-orange{background:#fff7ed;color:#c2410c}
.bg-teal{background:#f0fdfa;color:#0f766e}.bg-pink{background:#fdf2f8;color:#9d174d}
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:#f8fafc}
th{padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;border-bottom:1px solid #e2e8f0}
td{padding:9px 10px;font-size:12px;color:#374151;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#fafafa}
tr:last-child td{border-bottom:none}
/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);margin:20px auto}
.modal-sm{max-width:420px}.modal-md{max-width:700px}.modal-lg{max-width:980px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0}
.modal-head h2{font-size:14px;font-weight:700;color:#1e293b}
.modal-close{width:28px;height:28px;border-radius:50%;border:none;background:none;cursor:pointer;font-size:18px;color:#94a3b8;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#f1f5f9;color:#374151}
.modal-body{padding:20px;max-height:74vh;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px;background:#f8fafc;border-radius:0 0 16px 16px}
/* Toast */
.toast{position:fixed;top:14px;right:14px;z-index:9999;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:slideIn .25s ease}
.toast-success{background:#16a34a;color:#fff}.toast-error{background:#dc2626;color:#fff}.toast-info{background:#2563eb;color:#fff}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Alerts */
.alert{padding:10px 14px;border-radius:8px;font-size:12px;border-left:4px solid;margin-bottom:12px}
.alert-success{background:#f0fdf4;border-color:#16a34a;color:#166534}
.alert-error{background:#fef2f2;border-color:#dc2626;color:#991b1b}
.alert-info{background:#eff6ff;border-color:#2563eb;color:#1e40af}
.alert-warning{background:#fefce8;border-color:#d97706;color:#92400e}
/* Layout helpers */
.flex{display:flex}.items-c{align-items:center}.jc-b{justify-content:space-between}.flex-1{flex:1}
.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}.wrap{flex-wrap:wrap}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.fz13{font-size:13px}.fz12{font-size:12px}.fz11{font-size:11px}.tc{text-align:center}.fw7{font-weight:700}.fw6{font-weight:600}
.text-gray{color:#64748b}.text-blue{color:#2563eb}.text-green{color:#16a34a}.text-red{color:#dc2626}.text-purple{color:#7c3aed}
.p-empty{padding:32px;text-align:center;color:#94a3b8;font-size:13px}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.wt-bar{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid}
.wt-ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0}.wt-ng{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.info-note{background:#eff6ff;padding:10px 14px;border-radius:8px;font-size:11px;color:#1e40af;border:1px solid #bfdbfe}
.warn-note{background:#fefce8;padding:10px 14px;border-radius:8px;font-size:11px;color:#a16207;border:1px solid #fde68a}
.success-note{background:#f0fdf4;padding:10px 14px;border-radius:8px;font-size:11px;color:#166534;border:1px solid #bbf7d0}
.sec-title{font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid #e2e8f0;padding:4px;border-radius:10px;margin-bottom:14px}
.tab-btn{flex:1;padding:7px 10px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;color:#64748b;transition:all .15s}
.tab-btn.active{background:#2563eb;color:#fff}.tab-btn:hover:not(.active){background:#f1f5f9}
.stage-banner{padding:12px 16px;border-radius:10px;display:flex;align-items:center;gap:12px;margin-bottom:14px;border:1.5px solid}
.stage-banner.goal{background:#eff6ff;border-color:#bfdbfe}.stage-banner.perf{background:#f0fdf4;border-color:#bbf7d0}
/* KPI cards */
.kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;overflow:hidden}
.kpi-card-head{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;border-bottom:1px solid #f8fafc;gap:10px}
.kpi-card-body{padding:12px 14px}
.kf-label{font-size:10px;color:#94a3b8;margin-bottom:2px}.kf-val{font-size:12px;color:#374151}
/* Approval cards */
.emp-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:14px;overflow:hidden}
.emp-card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;gap:10px;flex-wrap:wrap}
.emp-card-body{padding:0}
/* Profile */
.profile-header{background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:14px;padding:24px;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:20px}
.profile-avatar{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex-shrink:0}
.profile-info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pf{padding:10px;background:#f8fafc;border-radius:8px}
.pf-label{font-size:10px;color:#94a3b8;margin-bottom:3px}.pf-val{font-size:13px;font-weight:700;color:#1e293b}
/* KPI History */
.kpi-yr-card{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:12px;overflow:hidden}
.kpi-yr-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;cursor:pointer}
.kpi-yr-body{padding:0}
.score-badge-large{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;font-size:20px;font-weight:800}
.grade-S{background:#fef9c3;color:#a16207}.grade-A{background:#dcfce7;color:#166534}
.grade-B{background:#dbeafe;color:#1d4ed8}.grade-C{background:#fce7f3;color:#9d174d}.grade-D{background:#f1f5f9;color:#475569}
/* Rank calc box */
.rank-calc-box{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:14px;margin-top:8px}
.rank-calc-result{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rank-calc-item{text-align:center;background:#fff;border-radius:8px;padding:10px 16px;border:1px solid #e2e8f0;flex:1;min-width:100px}
.rank-calc-item .rci-num{font-size:18px;font-weight:800;color:#2563eb}
.rank-calc-item .rci-lbl{font-size:10px;color:#64748b;margin-top:2px}
/* Misc */
.divider{height:1px;background:#f1f5f9;margin:14px 0}
.org-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:20px;font-size:12px;margin:3px}
.org-tag button{border:none;background:none;color:#94a3b8;cursor:pointer;font-size:14px;line-height:1;padding:0}
.org-tag button:hover{color:#ef4444}
.career-item{padding:10px 12px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:8px}
input[type=file]{display:none}

.snapshot-item{padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
.snapshot-item.auto{border-left:3px solid #2563eb}.snapshot-item.manual{border-left:3px solid #16a34a}
.snapshot-item.pre-import{border-left:3px solid #d97706}
.import-preview-row{padding:6px 10px;border-bottom:1px solid #f1f5f9;font-size:11px;display:flex;gap:8px;align-items:flex-start}
.import-preview-row.new{background:#f0fdf4}.import-preview-row.update{background:#eff6ff}.import-preview-row.skip{background:#fefce8}.import-preview-row.err{background:#fef2f2}

.file-upload-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px dashed #93c5fd;border-radius:8px;cursor:pointer;color:#2563eb;font-size:12px;font-weight:600;background:#eff6ff;transition:all .15s}
.file-upload-btn:hover{background:#dbeafe}

.comp-tab-row{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.comp-q-row{padding:10px 12px;border-bottom:1px solid #f1f5f9;display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center}
.comp-q-row:nth-child(even){background:#fafafa}
.comp-score-btns{display:flex;gap:4px;justify-content:flex-end}
.comp-score-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid #e2e8f0;background:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.comp-score-btn.sel-1{background:#fef2f2;border-color:#dc2626;color:#dc2626}
.comp-score-btn.sel-2{background:#fff7ed;border-color:#f97316;color:#f97316}
.comp-score-btn.sel-3{background:#fefce8;border-color:#eab308;color:#a16207}
.comp-score-btn.sel-4{background:#f0fdf4;border-color:#16a34a;color:#16a34a}
.comp-score-btn.sel-5{background:#eff6ff;border-color:#2563eb;color:#2563eb}
.comp-score-btn:hover{transform:scale(1.15)}
.comp-cat-head{padding:10px 12px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;font-size:12px;font-weight:700;color:#374151}
.cfg-badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:#fff7ed;color:#c2570c;border:1px solid #fed7aa;}
.eval-status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
.dot-done{background:#16a34a}.dot-pending{background:#f59e0b}.dot-none{background:#e2e8f0}
.grade-badge-large{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;font-size:18px;font-weight:800;flex-shrink:0}

.readonly-section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:14px}
.readonly-section .rs-title{font-size:12px;font-weight:700;color:#475569;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ============================================================
   RESPONSIVE DESIGN — Mobile / Tablet
   ============================================================ */

/* ── Viewport meta (added in <head> if not present) ── */

/* ── Mobile navigation toggle ── */
#mobile-menu-btn{display:none;width:38px;height:38px;border:none;background:none;
  cursor:pointer;color:#1e293b;font-size:20px;align-items:center;justify-content:center;
  border-radius:8px;transition:background .15s}
#mobile-menu-btn:hover{background:#f1f5f9}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:399}

/* ── Topbar ── */
#page-title{font-size:13px;font-weight:700;color:#1e293b;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Tablet (≤900px) ── */
@media(max-width:900px){
  #sidebar{position:fixed;top:0;left:-220px;height:100%;z-index:400;
    transition:left .25s ease;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  #sidebar.open{left:0}
  #sidebar-overlay.open{display:block}
  #mobile-menu-btn{display:flex}
  #main{width:100%}
  #content{padding:12px}
  .stat-grid{grid-template-columns:1fr 1fr;gap:8px}
  .g3{grid-template-columns:1fr 1fr}
  .g4{grid-template-columns:1fr 1fr}
  .profile-info-grid{grid-template-columns:repeat(2,1fr)}
  .modal-lg{max-width:95vw}
  .modal-md{max-width:95vw}
}

/* ── Mobile (≤600px) ── */
@media(max-width:600px){
  html,body{font-size:13px}
  #content{padding:8px}
  #topbar{padding:8px 12px;gap:8px}

  /* Sidebar */
  #sidebar{left:-220px}

  /* Cards */
  .card-head{padding:10px 12px;flex-wrap:wrap;gap:6px}
  .card-body{padding:12px}
  .stat-grid{grid-template-columns:1fr 1fr;gap:6px}
  .stat-box{padding:10px}
  .stat-box .num{font-size:18px}

  /* Grids → single column on mobile */
  .g2,.g3,.g4{grid-template-columns:1fr}
  .cs2,.cs3,.cs4{grid-column:span 1}

  /* Filter bar → wrap tightly */
  .filter-bar{gap:5px}
  .filter-bar .fc{font-size:11px;padding:6px 8px}
  .filter-bar select.fc{max-width:130px}

  /* Buttons */
  .btn{padding:6px 10px;font-size:11px}
  .btn-sm{padding:4px 7px;font-size:10px}
  .btn-lg{padding:9px 16px;font-size:12px}

  /* Tables */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:600px}
  th,td{padding:6px 8px;font-size:11px}
  th{font-size:10px}

  /* Modal */
  .modal-ov{padding:0;align-items:flex-end}
  .modal,.modal-sm,.modal-md,.modal-lg{
    max-width:100vw;width:100%;margin:0;
    border-radius:16px 16px 0 0;
    max-height:90vh}
  .modal-body{max-height:65vh;padding:14px}
  .modal-foot{padding:10px 14px;flex-wrap:wrap;gap:6px}
  .modal-foot .btn{flex:1;min-width:0;justify-content:center}

  /* Forms */
  .fg{margin-bottom:10px}
  .fc{padding:7px 9px;font-size:12px}

  /* Tabs → scrollable */
  .tabs{overflow-x:auto;gap:3px;padding:3px}

// Get latest promotion/rank_change date for employee
function getEmpRankDate(emp){
  if(emp.rankDate) return emp.rankDate; // explicitly stored
  const promos=(emp.hrHistory||[]).filter(h=>h.type==="promotion"||h.type==="rank_change");
  if(!promos.length) return emp.hire||""; // fallback to hire date
  return promos.sort((a,b)=>b.date.localeCompare(a.date))[0].date;
}

// ==================== PROMOTION SETTINGS ====================
let promotionSettings = {
  // ── 조건 1: 직급별 최소 체류 연수 ──────────────────────
  minYearsByRank: {
    "사원": 1, "주임": 3, "과장": 3, "차장": 3, "부장": 4,
    "이사": 0, "상무보": 0, "위원": 0
  },
  // ── 조건 2: 최근 N년간 우수 등급 취득 기준 ─────────────
  // S=최우수, A=우수, E=Excellent(우수 별칭) 중 2회 이상 (기본)
  eligibleGrades: ["S", "A", "E"],
  gradeCountRequired: 2,   // 몇 회 이상
  gradeYearRange: 3,       // 최근 몇 년 기준
  // ── 조건 3: 법정의무교육 이수 ───────────────────────────
  legalEduRequired: true,
  legalEduField: "legalEduCompleted",
  // ── 추가 옵션 ───────────────────────────────────────────
  evalYear: 2026,
  // 사업부장·관리자 등 특정 직급은 심사 제외 여부
  excludeRanks: ["이사","상무보","위원"],
  // 커스텀 조건 (추가 요건)
  // {id, name, type:"manual"|"hrHistory", fieldKey, description, required:true/false}
  customConditions: [
    {id:"cc1", name:"추가 교육 이수", type:"hrHistory", fieldKey:"edu_extra",
     description:"사내 직무교육 또는 외부 교육 이수 여부", required:false},

  ],
};

// 법정의무교육 이수 여부 확인
function checkLegalEdu(emp){
  if(!promotionSettings.legalEduRequired) return {ok:true,msg:"(요건 미적용)"};
  // customFields에서 확인
  const v = emp.customFields?.[promotionSettings.legalEduField];
  if(v===true||v==="Y"||v==="완료"||v==="이수") return {ok:true,msg:"이수 완료"};
  // hrHistory에서 교육 이수 이력 확인
  const eduHist=(emp.hrHistory||[]).filter(h=>h.type==="edu_legal"||h.desc?.includes("법정의무교육"));
  if(eduHist.length>0) return {ok:true,msg:"이수 완료 ("+eduHist[eduHist.length-1].date+")"};
  return {ok:false,msg:"미이수"};
}

// 승진 자격 요건 전체 계산
function calcPromotion(emp, evalYear){
  const yr = evalYear||promotionSettings.evalYear||new Date().getFullYear();
  const result = {empId:emp.id, name:emp.name, dept:emp.dept, team:emp.team,
    rank:emp.rank, rankYear:emp.rankYear||0, eligible:false,
    cond1:{ok:false,label:"직급 체류 연수",detail:""},
    cond2:{ok:false,label:"등급 요건",detail:""},
    cond3:{ok:false,label:"법정의무교육",detail:""},
    summary:"",
    nextRank:"",
  };

  // ── 조건 1: 체류 연수 ──────────────────────────────────
  const minYears = promotionSettings.minYearsByRank[emp.rank] ?? 999;
  const rankYr = emp.rankYear || 0;
  result.cond1.ok = rankYr >= minYears;
  result.cond1.detail = `현재 ${rankYr}년 / 최소 ${minYears}년`;
  if(minYears===0||minYears===999){result.cond1.ok=minYears===0;result.cond1.detail=minYears===0?"제한 없음":"해당 직급 승진 기준 미설정";}

  // ── 조건 2: 최근 N년간 우수 등급 ──────────────────────
  const gr = emp.gradeResults||{};
  const eligGrades = new Set(promotionSettings.eligibleGrades.map(g=>g.toUpperCase()));
  const years = promotionSettings.gradeYearRange||3;
  const required = promotionSettings.gradeCountRequired||2;
  let hitCount=0, hitYears=[];
  for(let y=yr-1; y>=yr-years; y--){
    const g=(gr[String(y)]?.grade||"").toUpperCase();
    if(eligGrades.has(g)){hitCount++;hitYears.push(y+"("+g+")");}
  }
  result.cond2.ok = hitCount >= required;
  result.cond2.detail = `최근 ${years}년 중 ${hitCount}회 해당 (${hitYears.join(", ")||"없음"}) / 필요 ${required}회`;

  // ── 조건 3: 법정의무교육 ───────────────────────────────
  const edu = checkLegalEdu(emp);
  result.cond3.ok = edu.ok;
  result.cond3.detail = edu.msg;

  // ── 종합 ──────────────────────────────────────────────
  result.eligible = result.cond1.ok && result.cond2.ok && result.cond3.ok;
  const ranks = orgDB.ranks||[];
  const curIdx = ranks.indexOf(emp.rank);
  result.nextRank = curIdx>=0 && curIdx<ranks.length-1 ? ranks[curIdx+1] : "(최고 직급)";

  // ── 커스텀 추가 조건 ─────────────────────────────────
  result.customConds = (promotionSettings.customConditions||[]).map(cond=>{
    if(!cond.required) return{...cond, ok:true, detail:"선택 요건"};
    let ok=false, detail="미확인";
    if(cond.type==="hrHistory"){
      const found=(emp.hrHistory||[]).some(h=>h.type===cond.fieldKey||h.desc?.includes(cond.name));
      ok=found; detail=found?"이수/완료":"미이수";
    } else if(cond.type==="manual"){
      const v=emp.customFields?.[cond.fieldKey];
      ok=v===true||v==="Y"||v==="완료"||v==="yes";
      detail=ok?"확인됨":"미확인";
    }
    return{...cond, ok, detail};
  });
  const requiredCustom = result.customConds.filter(c=>c.required);
  const customOk = requiredCustom.every(c=>c.ok);
  result.eligible = result.cond1.ok && result.cond2.ok && result.cond3.ok && customOk;

  const basePass = [result.cond1,result.cond2,result.cond3].filter(c=>c.ok).length;
  const totalConds = 3 + requiredCustom.length;
  const totalPass = basePass + requiredCustom.filter(c=>c.ok).length;
  const missing = totalConds - totalPass;
  if(result.eligible) result.summary="승진 적격 ✅";
  else if(missing===1) result.summary="조건 1개 미충족";
  else if(missing===2) result.summary="조건 2개 미충족";
  else result.summary="조건 "+missing+"개 미충족";

  return result;
}

// Weight config by role/rank
function getCompWeights(emp){
  if(!emp)return{value:30,biz:50,leader:20};
  const r=emp.rank||"";
  if(emp.role==="leader")return{value:30,biz:30,leader:40};
  // 주임 이하
  const lowerRanks=["사원","주임"];
  if(lowerRanks.includes(r))return{value:40,biz:60,leader:0};
  // 책임 이상 (과장, 차장 등)
  return{value:30,biz:50,leader:20};
}

function isInPeriod(start,end){
  const today=new Date().toISOString().slice(0,10);
  if(start&&today<start)return false;

  return true;
}

// Helper: evaluatable employees (active, non-admin, given year has KPI submitted)
function getEvalTargets(year,type="kpi"){
  if(type==="kpi")return employees.filter(e=>e.active&&e.role!=="admin"&&kpiEntries.some(k=>k.userId===e.id&&k.year===year&&k.goalSub));
  if(type==="comp")return employees.filter(e=>e.active&&e.role!=="admin"&&(e.role==="member"||e.role==="leader"));
  if(type==="leadership")return employees.filter(e=>e.active&&e.role==="director");
  return employees.filter(e=>e.active&&e.role!=="admin");
}
function calcTargetCount(ratios,pool,type,dept,year){
  const year2=year||settings.evalYear;
  let emps=getEvalTargets(year2,type==="comp"?"comp":"kpi").filter(e=>e.role===pool);
  if(dept)emps=emps.filter(e=>e.dept===dept);
  const total=emps.length;
  return ratios.map(r=>({...r,targetCount:Math.max(0,Math.round(r.pct/100*total)),total}));
}

  if(!compGradeSettings[dept])compGradeSettings[dept]={member:JSON.parse(JSON.stringify(companyWideRatios.comp.member)),leader:JSON.parse(JSON.stringify(companyWideRatios.comp.leader))};
  return compGradeSettings[dept];
}

// ==================== RANK AUTO-CALC ====================
function getEduType(edu){
  if(!edu)return"학사이상";
  if(edu.includes("고등학교"))return"고졸";
  if(edu.includes("전문대"))return"전문학사";
  return"학사이상";
}
function calcAutoRank(totalCareer,edu){
  const eduType=getEduType(edu);
  const rules=orgDB.rankRules;
  // 사원 단계: 학력별로 다름
  const sawnRule=rules.find(r=>r.rank==="사원"&&r.eduType===eduType)||rules.find(r=>r.rank==="사원"&&r.eduType==="학사이상");
  const sawnYears=sawnRule?sawnRule.years:1;
  const afterRules=rules.filter(r=>r.rank!=="사원");
  let rem=totalCareer;
  if(rem<=0)return{rank:"사원",rankYear:0,label:sawnRule?.label||"사원",nextRank:afterRules[0]?.rank,yearsToNext:sawnYears};
  if(rem<=sawnYears)return{rank:"사원",rankYear:Math.round(rem*10)/10,label:sawnRule?.label||"사원",nextRank:afterRules[0]?.rank,yearsToNext:Math.round((sawnYears-rem)*10)/10};
  rem-=sawnYears;
  for(let i=0;i<afterRules.length;i++){
    const rule=afterRules[i];
    if(!rule.years)return{rank:rule.rank,rankYear:Math.round(rem*10)/10,label:rule.label,nextRank:null,yearsToNext:null};
    if(rem<=rule.years)return{rank:rule.rank,rankYear:Math.round(rem*10)/10,label:rule.label,nextRank:afterRules[i+1]?.rank,yearsToNext:Math.round((rule.years-rem)*10)/10};
    rem-=rule.years;
  }
  const last=afterRules[afterRules.length-1];
  return{rank:last.rank,rankYear:Math.round(rem*10)/10,label:last.label,nextRank:null,yearsToNext:null};
}
function applyAutoRank(){
  const career=Number($("#hr-career")?.value)||0;
  const edu=$("#hr-edu")?.value||"대학교 졸업";
  if(!career){showToast("총 경력 연수를 먼저 입력하세요.","error");return;}
  const result=calcAutoRank(career,edu);
  if($("#hr-rank"))$("#hr-rank").value=result.rank;
  if($("#hr-rankyear"))$("#hr-rankyear").value=Math.max(1,Math.round(result.rankYear));
  const box=$("#rank-calc-result");

    box.innerHTML=`<div class="rank-calc-box">
      <div style="font-size:11px;font-weight:700;color:#166534;margin-bottom:10px">⚡ 경력 ${career}년 / ${getEduType(edu)} 기준 자동 산정 결과</div>

  }
}

// ── Auto-detect: if served from http server, use same origin ──
(function detectServerOrigin(){
  try {
    const proto = location.protocol;
    if(proto === "http:" || proto === "https:"){
      // Served from HTTP server — same origin is the data server
      const origin = location.origin;
      serverConfig.url = origin;
      serverConfig.enabled = true;
      console.log("[Server] Auto-detected:", origin);
    } else {
      // Opened as file:// — try last saved server URL from localStorage
      try {
        const saved = localStorage.getItem("hr_kpi_server_url");
        if(saved){ serverConfig.url=saved; serverConfig.enabled=true; console.log("[Server] Restored from localStorage:", saved); }
      } catch(e){}
    }
  } catch(e){}
})();

// ── Server API helpers ──
async function serverRequest(method, endpoint, body=null, timeout=8000){
  const base = serverConfig.url.replace(/\/+$/, "");
  const controller = new AbortController();
  const tid = setTimeout(()=>controller.abort(), timeout);
  const opts = {
    method,
    signal: controller.signal,
    headers: {
      "Content-Type": "application/json",
      "X-Client-ID": encodeURIComponent(currentUser?.name||"unknown")
    }
  };
  if(body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(base + endpoint, opts);
    clearTimeout(tid);
    return await res.json();
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

async function checkServerConnection(){
  if(!serverConfig.url) return false;
  try {
    const r = await serverRequest("GET", "/status");
    if(r.ok){
      serverConfig.status = "connected";
      serverConfig.statusMsg = `연결됨 · 마지막 저장: ${r.meta ? new Date(r.meta.lastSaved).toLocaleString("ko-KR") : "없음"}`;
      updateServerStatusUI();
      return true;
    }
  } catch(e) {
    serverConfig.status = "error";
    serverConfig.statusMsg = "서버 연결 실패: " + e.message;
    updateServerStatusUI();
  }
  return false;
}

// Debounced auto-save: waits 2s after last change, then saves once
function autoSaveDebounced(){
  if(!serverConfig.enabled || !serverConfig.url) return;
  if(_serverDebounceTimer) clearTimeout(_serverDebounceTimer);
  _serverDebounceTimer = setTimeout(()=>{
    _serverDebounceTimer = null;
    _doSave(true);
  }, 2000); // wait 2s after last change
}

async function saveToServer(silent=false){
  if(!serverConfig.enabled || !serverConfig.url) return;
  if(_serverSaving){
    // Already saving — queue one more
    _serverSavePending = true;
    return;
  }
  await _doSave(silent);
}

async function _doSave(silent=false){
  if(!serverConfig.enabled || !serverConfig.url) return;
  if(_serverSaving){_serverSavePending=true;return;}
  _serverSaving = true;
  // Only show "saving" indicator for explicit (non-silent) saves
  if(!silent){serverConfig.status="saving";updateServerStatusUI();}
  try {
    const state = getFullState();
    const r = await serverRequest("POST", "/save", state, 15000);
    if(r.ok){
      _serverFailCount = 0;
      serverConfig.status = "connected";
      serverConfig.retryCount = 0;
      serverConfig.lastSaved = new Date().toISOString();
      // Update local version to match server
      if(r.version) _serverVersion = r.version;
      const m = r.meta;
      if(r.conflict && r.mergedData){
        // Server did a smart merge - apply merged state locally
        console.log("[Server] Conflict auto-merged, applying merged state...");
        const merged = r.mergedData?.data || r.mergedData;
        applyState({data: merged}, true); // apply without undo snapshot
        serverConfig.statusMsg = `⚡병합완료 ${new Date().toLocaleTimeString("ko-KR")} · ${m?.empCount||0}명/${m?.kpiCount||0}건`;
        showToast("다른 사용자의 변경사항이 자동으로 병합되었습니다.","info");
        renderSidebar(); renderPage();
      } else {
        serverConfig.statusMsg = `저장완료 ${new Date().toLocaleTimeString("ko-KR")} · ${m?.empCount||0}명/${m?.kpiCount||0}건`;
        if(!silent) showToast("서버에 저장되었습니다.","success");
      }
    } else {
      throw new Error(r.message||"저장 실패");
    }
  } catch(e) {
    _serverFailCount++;
    console.warn(`[Server] Save failed (${_serverFailCount}):`, e.message);
    if(_serverFailCount >= 3){
      // Only mark error after 3 consecutive failures
      serverConfig.status = "error";
      serverConfig.statusMsg = "연결 불안정 · 재연결 중...";
      if(!silent) showToast("서버 연결이 불안정합니다. 자동 재연결합니다.","error");
      scheduleReconnect();
    } else {
      // 1~2 failures: stay "connected", retry silently
      serverConfig.statusMsg = `저장 재시도 중 (${_serverFailCount}/3)...`;
      setTimeout(()=>_doSave(silent), 3000);
    }
  } finally {
    _serverSaving = false;
    updateServerStatusUI();
    // Process queued save
    if(_serverSavePending){
      _serverSavePending = false;
      setTimeout(()=>_doSave(true), 500);
    }
  }
}

async function loadFromServer(){
  if(!serverConfig.url) return;
  try {
    const r = await serverRequest("GET", "/data");
    if(r.ok && r.data){
      saveAutoSnapshot("pre_import"); // 현재 상태 스냅샷
      applyState(r.data);
      serverConfig.lastLoaded = new Date().toISOString();
      serverConfig.statusMsg = `불러오기 완료 ${new Date().toLocaleTimeString("ko-KR")}`;
      showToast("서버에서 데이터를 불러왔습니다.","success");
      renderSidebar(); renderPage();
    } else {
      showToast(r.message||"서버에 저장된 데이터가 없습니다.","info");

function startServerAutoSave(){
  if(_serverAutoSaveTimer) clearInterval(_serverAutoSaveTimer);
  if(!serverConfig.enabled || !serverConfig.autoSave || !serverConfig.url) return;
  const ms = (serverConfig.intervalMin||3) * 60 * 1000;
  _serverAutoSaveTimer = setInterval(()=>{
    if(serverConfig.enabled && serverConfig.url && !_serverSaving) _doSave(true);
  }, ms);
  console.log(`[Server] Auto-save: every ${serverConfig.intervalMin} min`);
  startHeartbeat();
}

function stopServerAutoSave(){
  if(_serverAutoSaveTimer){ clearInterval(_serverAutoSaveTimer); _serverAutoSaveTimer=null; }
  stopHeartbeat();
}

// ── Heartbeat: ping every 30s, auto-reconnect if lost ──
function startHeartbeat(){
  if(_serverHeartbeatTimer) clearInterval(_serverHeartbeatTimer);
  _serverHeartbeatTimer = setInterval(async ()=>{
    if(!serverConfig.enabled || !serverConfig.url) return;
    if(_serverSaving) return; // skip ping while saving
    try {
      const r = await serverRequest("GET", "/status", null, 4000);
      if(r.ok){
        if(serverConfig.status === "error"){
          console.log("[Server] Reconnected via heartbeat");
          serverConfig.status = "connected";
          serverConfig.retryCount = 0;
          _serverFailCount = 0;
          serverConfig.statusMsg = "재연결됨 " + new Date().toLocaleTimeString("ko-KR");
          updateServerStatusUI();
          if(_serverSavePending){ _serverSavePending=false; setTimeout(()=>_doSave(true),1000); }
        }
        // Check if another user saved (server version advanced)
        const svr = r.version || r.meta?.version;
        if(svr && _serverVersion >= 0 && svr > _serverVersion && !_serverSaving){
          console.log(`[Server] New version detected: ${_serverVersion} → ${svr}. Pulling updates...`);
          _serverVersion = svr;
          // Pull and merge latest data silently
          serverRequest("GET","/data",null,8000).then(dr=>{
            if(dr.ok && dr.data){
              const newData = dr.data?.data || dr.data;
              // Only merge employees and KPI (preserve local UI state)
              if(newData.employees){employees=newData.employees;if(currentUser){const upd=employees.find(e=>e.id===currentUser.id);if(upd)currentUser=upd;}}
              if(newData.kpiEntries) kpiEntries=newData.kpiEntries;
              if(newData.compSessions) compSessions=newData.compSessions;
              if(newData.compResponses) compResponses=newData.compResponses;
              if(newData.settings) Object.assign(settings, newData.settings);
              if(newData.orgDB){if(newData.orgDB.depts)orgDB.depts=newData.orgDB.depts;if(newData.orgDB.teams)orgDB.teams=newData.orgDB.teams;}
              if(newData.gradeSettings) Object.assign(gradeSettings,newData.gradeSettings);
              serverConfig.statusMsg=`동기화됨 ${new Date().toLocaleTimeString("ko-KR")} (v${svr})`;
              updateServerStatusUI();
              renderPage(); // refresh current page
              console.log("[Server] Data synced from server.");
            }
          }).catch(()=>{});
        }
        // Keep statusMsg fresh
        const ls = serverConfig.lastSaved;
        if(ls && serverConfig.status==="connected" && !serverConfig.statusMsg.includes("동기화")){
          const ago = Math.floor((Date.now()-new Date(ls).getTime())/60000);
          if(ago>0) serverConfig.statusMsg = `연결됨 · ${ago}분 전 저장`;
          updateServerStatusUI();
        }
      }
    } catch(e){
      if(serverConfig.status === "connected" && _serverFailCount >= 2){
        serverConfig.status = "error";
        serverConfig.statusMsg = "연결 끊김 · 재연결 중...";
        updateServerStatusUI();
        console.warn("[Server] Heartbeat lost:", e.message);
        scheduleReconnect();
      }
    }
  }, 30000); // ping every 30s
}

function stopHeartbeat(){
  if(_serverHeartbeatTimer){ clearInterval(_serverHeartbeatTimer); _serverHeartbeatTimer=null; }
}

function scheduleReconnect(){
  if(_serverRetryTimer) return; // already scheduled
  const delay = Math.min(30000, 5000 * serverConfig.retryCount); // 5s, 10s, ..., 30s max
  console.log(`[Server] Reconnect in ${delay/1000}s`);
  _serverRetryTimer = setTimeout(async ()=>{
    _serverRetryTimer = null;
    const ok = await checkServerConnection();
    if(ok){
      console.log("[Server] Reconnected successfully");
      saveToServer(true);
    }
  }, delay || 5000);
}

// ==================== COMP EVAL ASSIGNMENT ====================
function getCompEvaluators(targetId,year){
  const target=getEmp(targetId);if(!target)return[];
  const cfg=getEvalConfig(targetId);
  // If fixed evaluator list is set, use it directly
  if(cfg.fixedEvaluatorIds&&cfg.fixedEvaluatorIds.length>0){
    return cfg.fixedEvaluatorIds.map(id=>getEmp(id)).filter(e=>e&&e.active&&e.id!==targetId);
  }
  const role=target.role;
  let evaluators=[];
  if(role==="director"){
    let others=employees.filter(e=>e.active&&e.role==="director"&&e.id!==targetId);
    let leaders=employees.filter(e=>e.active&&e.role==="leader"&&e.dept===target.dept);
    if(cfg.directorMax!=null)others=others.slice(0,cfg.directorMax);
    if(cfg.leaderMax!=null)leaders=leaders.slice(0,cfg.leaderMax);
    evaluators=[...others,...leaders];
  }else if(role==="leader"){
    const director=employees.filter(e=>e.active&&e.role==="director"&&e.dept===target.dept);
    let sameLeaders=employees.filter(e=>e.active&&e.role==="leader"&&e.dept===target.dept&&e.id!==targetId);
    let members=employees.filter(e=>e.active&&e.role==="member"&&e.dept===target.dept&&e.team===target.team);
    const leaderMax=cfg.leaderMax!=null?cfg.leaderMax:4;
    const memberMax=cfg.memberMax!=null?cfg.memberMax:members.length;
    if(sameLeaders.length>leaderMax)sameLeaders=sameLeaders.slice(0,leaderMax);
    if(members.length>memberMax)members=members.slice(0,memberMax);
    const dirMax=cfg.directorMax!=null?cfg.directorMax:director.length;
    evaluators=[...director.slice(0,dirMax),...sameLeaders,...members];
  }else if(role==="member"){
    const leader=employees.filter(e=>e.active&&e.role==="leader"&&e.dept===target.dept&&e.team===target.team);
    let peers=employees.filter(e=>e.active&&e.role==="member"&&e.dept===target.dept&&e.team===target.team&&e.id!==targetId);
    const peerMax=cfg.memberMax!=null?cfg.memberMax:9;
    if(peers.length>peerMax)peers=peers.slice(0,peerMax);
    evaluators=[...leader,...peers];
  }
  return evaluators.filter(e=>e.id!==targetId);
}
function getCompType(target){
  if(!target)return"comp";
  return target.role==="director"?"leadership":"comp";
}
function createCompSession(targetId,year){
  if(!year)year=settings.evalYear;
  const existing=compSessions.find(s=>s.targetId===targetId&&s.year===year);
  if(existing)return existing;
  const target=getEmp(targetId);if(!target)return null;
  const type=getCompType(target);
  const evaluators=getCompEvaluators(targetId,year);
  const session={id:genId(),year,targetId,type,evaluatorIds:evaluators.map(e=>e.id),status:"open",createdAt:ts()};
  compSessions.push(session);
  return session;
}
function getMyCompSessions(evaluatorId,year){
  return compSessions.filter(s=>s.year===year&&s.status==="open"&&s.evaluatorIds.includes(evaluatorId)&&!compResponses.find(r=>r.sessionId===s.id&&r.evaluatorId===evaluatorId));
}
function getCompResponse(sessionId,evaluatorId){
  return compResponses.find(r=>r.sessionId===sessionId&&r.evaluatorId===evaluatorId);
}
function calcCompScore(sessionId){
  const session=compSessions.find(s=>s.id===sessionId);if(!session)return null;
  const responses=compResponses.filter(r=>r.sessionId===sessionId&&r.submittedAt);
  if(!responses.length)return null;
  const target=getEmp(session.targetId);
  const items=session.type==="leadership"?LS_FORM_ITEMS:COMP_FORM_ITEMS;
  const avgAnswers={};
  items.forEach(item=>{
    const scores=responses.map(r=>r.answers?.[item.id]).filter(s=>s!=null&&s>0);
    avgAnswers[item.id]=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  });
  if(session.type==="leadership"){
    const total=Object.values(avgAnswers).reduce((a,b)=>a+b,0);
    return Math.round(total/items.length*20);
  }
  const w=getCompWeights(target);
  let valueScore=0,bizScore=0,leaderScore=0,valueCnt=0,bizCnt=0,leaderCnt=0;
  COMP_FORM_ITEMS.forEach(item=>{
    const s=avgAnswers[item.id]||0;
    if(item.cat==="가치역량"){valueScore+=s;valueCnt++;}
    else if(item.cat==="업무역량"){bizScore+=s;bizCnt++;}
    else if(item.cat&&item.cat.includes("리더십")){leaderScore+=s;leaderCnt++;}
  });
  const vAvg=valueCnt?valueScore/valueCnt:0;
  const bAvg=bizCnt?bizScore/bizCnt:0;
  const lAvg=leaderCnt?leaderScore/leaderCnt:0;
  const weighted=(vAvg*(w.value||0)+bAvg*(w.biz||0)+lAvg*(w.leader||0))/100*20;
  return Math.round(weighted*5);
}


function calcEmpFinalScore(empId,year){
  const kpis=kpiEntries.filter(k=>k.userId===empId&&k.year===year&&k.finalStatus==="approved");
  if(!kpis.length)return null;
  return kpis.reduce((t,k)=>{const sc=k.finalScore!=null?k.finalScore:(k.secondScore!=null?k.secondScore:null);return t+(sc!=null?sc*(k.weight/100):0);},0);
}
function tryCalcDeptGrades(dept,year){
  const deptEmps=employees.filter(e=>e.active&&e.dept===dept&&(e.role==="member"||e.role==="leader"));
  if(!deptEmps.length)return;
  const allDone=deptEmps.every(emp=>{
    const kpis=kpiEntries.filter(k=>k.userId===emp.id&&k.year===year&&k.goalSub);
    return kpis.length>0&&kpis.every(k=>k.finalStatus==="approved");
  });
  if(!allDone){showToast("아직 모든 직원의 평가가 완료되지 않았습니다. 전체 완료 후 자동 산정됩니다.","info");return;}
  const gs=getGradeSettings(dept);
  assignPoolGrades(deptEmps.filter(e=>e.role==="member"),gs.member,dept,year,"member");
  assignPoolGrades(deptEmps.filter(e=>e.role==="leader"),gs.leader,dept,year,"leader");
  showToast(dept+" 등급 산정이 완료되었습니다.","success");
}
function assignPoolGrades(pool,ratios,dept,year,poolName){
  if(!pool.length)return;
  const scored=pool.map(e=>({emp:e,score:calcEmpFinalScore(e.id,year)||0})).sort((a,b)=>b.score-a.score);
  const total=scored.length;
  let results=[];let idx=0;
  for(let ri=0;ri<ratios.length;ri++){
    const ratio=ratios[ri];
    let count=ri===ratios.length-1?(total-idx):Math.max(0,Math.round(ratio.pct/100*total));
    // Detect tie at boundary
    if(count>0&&idx+count<total){
      const lastInScore=scored[idx+count-1].score;
      const firstOutScore=scored[idx+count].score;
      if(Math.abs(lastInScore-firstOutScore)<0.001){
        const existing=tieNotifications.find(t=>t.dept===dept&&t.year===year&&t.pool===poolName&&Math.abs(t.tieScore-lastInScore)<0.001);
        if(!existing){
          const candidates=scored.filter(s=>Math.abs(s.score-lastInScore)<0.001).map(s=>({empId:s.emp.id,score:s.score}));
          tieNotifications.push({id:genId(),dept,year,pool:poolName,tieScore:lastInScore,candidates,resolved:false,grade1:ratios[ri>0?ri-1:0].grade,grade2:ratio.grade});
        }
      }
    }
    for(let i=idx;i<Math.min(idx+count,total);i++){results.push({empId:scored[i].emp.id,score:scored[i].score,grade:ratio.grade,rank:i+1});}
    idx=Math.min(idx+count,total);
  }
  results.forEach(r=>{
    employees=employees.map(e=>{
      if(e.id!==r.empId)return e;
      const gr={...(e.gradeResults||{})};
      gr[year]={grade:r.grade,score:r.score,rank:r.rank,pool:poolName,computedAt:ts()};
      return{...e,gradeResults:gr};
    });
  });
}

      });

    const yrs=[...new Set(kpiEntries.filter(k=>k.userId===e.id&&k.finalConfirmed).map(k=>k.year))].sort((a,b)=>b-a);

  }
  const csv=bom+rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,"'")}"`).join(",")).join("\n");

function dlCSV(fn,headers,rows){
  const bom="\uFEFF",csv=bom+[headers.join(","),...rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,"'")}"`).join(","))].join("\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  const a=document.createElement("a");a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url);
}

function savePastGrade(empId){
  const yr=Number(document.getElementById("pg-year")?.value);
  const grade=document.getElementById("pg-grade")?.value;
  const score=document.getElementById("pg-score")?.value;
  const note=document.getElementById("pg-note")?.value.trim()||"";
  if(!yr||!grade){showToast("연도와 등급을 선택하세요.","error");return;}
  employees=employees.map(e=>{
    if(e.id!==empId)return e;
    const gr={...(e.gradeResults||{})};
    gr[yr]={grade,score:score?Number(score):null,manual:true,note,computedAt:ts()};
    return{...e,gradeResults:gr};
  });
  if(empId===currentUser.id){const updated=employees.find(e=>e.id===empId);if(updated)currentUser=updated;}
  showToast(`${yr}년 ${grade}등급이 저장되었습니다.`,"success");
  openPastGradeModal(empId);
}
function deletePastGrade(empId,yr){
  employees=employees.map(e=>{
    if(e.id!==empId)return e;
    const gr={...(e.gradeResults||{})};
    delete gr[yr];
    return{...e,gradeResults:gr};
  });
  showToast(`${yr}년 등급이 삭제되었습니다.`,"info");
  openPastGradeModal(empId);
}

let _compScores={}; // {sessionId: {qId: score}}
function setCompScore(sessionId,qId,score){
  if(!_compScores[sessionId])_compScores[sessionId]={};
  _compScores[sessionId][qId]=score;
  for(let n=1;n<=5;n++){const btn=document.getElementById(`csb-${sessionId}-${qId}-${n}`);if(btn)btn.className="comp-score-btn"+(n===score?` sel-${n}`:"");}
}
function submitCompResponse(sessionId){
  const session=compSessions.find(s=>s.id===sessionId);if(!session)return;
  const isLs=session.type==="leadership";
  if(isLs&&!isLeadershipEvalOpen()&&settings.leadershipEvalStart){showToast("리더십 평가 기간이 아닙니다.","error");return;}
  if(!isLs&&!isCompEvalOpen()&&settings.compEvalStart){showToast("역량 평가 기간이 아닙니다.","error");return;}
  const items=session.type==="leadership"?LS_FORM_ITEMS:COMP_FORM_ITEMS;
  const scores=_compScores[sessionId]||{};
  const missing=items.filter(i=>!scores[i.id]);
  if(missing.length){showToast(`${missing.length}개 항목이 미입력되었습니다.`,"error");return;}
  const strengths=document.getElementById(`comp-strengths-${sessionId}`)?.value.trim();
  if(!strengths){showToast("강점을 반드시 입력하세요.","error");return;}
  let collab=null;
  if(session.type==="comp"){
    const radios=document.querySelectorAll(`input[name="collab-${sessionId}"]`);
    const checked=[...radios].find(r=>r.checked);
    if(!checked){showToast("협업 의향을 선택하세요.","error");return;}
    collab=Number(checked.value)===1;
  }
  const improvements=document.getElementById(`comp-improve-${sessionId}`)?.value.trim()||"";
  const response={id:genId(),sessionId,targetId:session.targetId,evaluatorId:currentUser.id,year:session.year,type:session.type,answers:{...scores},collab,strengths,improvements,submittedAt:ts()};
  compResponses.push(response);
  delete _compScores[sessionId];
  showToast("평가가 제출되었습니다.","success");logAction("comp_submitted","역량평가 제출",`session:${sessionId}`,session.type);autoSaveToServerIfEnabled();
  compSelSessionId=0;renderCompEval();
}

function toggleAllEvaluators(chk){document.querySelectorAll(".eval-chk").forEach(c=>c.checked=chk.checked);}
function applyRecommendedEvaluators(targetId,year){
  const suggested=getCompEvaluators(targetId,year).map(e=>e.id);
  document.querySelectorAll(".eval-chk").forEach(chk=>{chk.checked=suggested.includes(Number(chk.value));});
}
function saveEvaluators(targetId,year){
  const checked=[...document.querySelectorAll(".eval-chk:checked")].map(c=>Number(c.value));
  if(!checked.length){showToast("평가자를 최소 1명 이상 선택하세요.","error");return;}
  const existing=compSessions.find(s=>s.targetId===targetId&&s.year===year);
  if(existing){compSessions=compSessions.map(s=>s.id===existing.id?{...s,evaluatorIds:checked}:s);}
  else{compSessions.push({id:genId(),year,targetId,type:getCompType(getEmp(targetId)),evaluatorIds:checked,status:"open",createdAt:new Date().toISOString()});}
  closeModal();showToast(`평가자 ${checked.length}명이 저장되었습니다.`,"success");renderCompEval();
}
function dlCompFullResult(year){
  calcCompGradesForAll(year);
  const targets=employees.filter(e=>e.active&&e.role!=="admin");
  const rows=[];
  rows.push([`${year}년 역량/리더십 다면평가 전체 결과`]);rows.push([""]);
  rows.push(["이름","사번","직위","부서","팀","평가유형","전체평가자수","제출수","진행률","항목별평균점수","역량종합점수","역량등급","수정여부"]);
  targets.forEach(e=>{
    const s=compSessions.find(ss=>ss.targetId===e.id&&ss.year===year);
    const rCnt=s?compResponses.filter(r=>r.sessionId===s.id&&r.submittedAt).length:0;
    const total=s?s.evaluatorIds.length:0;
    const cg=getCompGradeResult(e.id,year);
    const items=s?.type==="leadership"?LS_FORM_ITEMS:COMP_FORM_ITEMS;
    const resps=s?compResponses.filter(r=>r.sessionId===s.id&&r.submittedAt):[];
    const itemAvgs=items.map(item=>{const scores=resps.map(r=>r.answers?.[item.id]).filter(s=>s!=null&&s>0);return scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;});
    const avgStr=itemAvgs.map((a,i)=>`${items[i].title||items[i].id}:${a.toFixed(1)}`).join("|");
    rows.push([e.name,e.empNo,ROLES[e.role],e.dept,e.team,s?.type==="leadership"?"리더십":"역량",total,rCnt,total?Math.round(rCnt/total*100)+"%":"0%",avgStr,cg?.score!=null?cg.score+"점":"-",cg?.grade||"-",cg?.adjustedBy?"수정됨":"자동산정"]);
  });
  dlCSV(`역량평가전체결과_${year}년.csv`,[],rows);
  showToast("전체 결과 다운로드 완료","success");
}

  if(type==="comp")targets=targets.filter(e=>e.role!=="director");
  else if(type==="leadership")targets=targets.filter(e=>e.role==="director");
  // Find max evaluator count
  let maxEval=1;
  targets.forEach(e=>{
    const s=compSessions.find(ss=>ss.targetId===e.id&&ss.year===year);
    const cnt=s?s.evaluatorIds.length:getCompEvaluators(e.id,year).length;
    if(cnt>maxEval)maxEval=cnt;
  });
  const header=["피평가자사번","피평가자이름","직위","소속팀","평가유형"];
  for(let i=1;i<=maxEval;i++)header.push(`평가자사번${i}`,`평가자이름${i}`,`제출여부${i}`);
  const rows=[header];
  targets.forEach(e=>{
    const s=compSessions.find(ss=>ss.targetId===e.id&&ss.year===year);
    const evalIds=s?s.evaluatorIds:getCompEvaluators(e.id,year).map(ev=>ev.id);
    const evalEmps=evalIds.map(id=>getEmp(id)).filter(Boolean);
    const row=[e.empNo,e.name,ROLES[e.role],e.team,s?.type||getCompType(e)];
    for(let i=0;i<maxEval;i++){
      const ev=evalEmps[i];
      const submitted=s?compResponses.some(r=>r.sessionId===s.id&&r.evaluatorId===ev?.id&&r.submittedAt):"";
      row.push(ev?.empNo||"",ev?.name||"",ev?(submitted?"제출완료":"미제출"):"");
    }
    rows.push(row);
  });
  dlCSV(`평가자목록_${year}년${type?"_"+type:""}.csv`,[],rows);
  showToast("평가자 목록이 다운로드되었습니다.","success");
}
function handleEvaluatorUpload(input,year){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const raw=ev.target.result.replace(/^\uFEFF/,"");
      const lines=raw.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){showToast("데이터가 없습니다.","error");return;}
      let updated=0,failed=[];
      lines.slice(1).forEach((line,li)=>{
        const cols=line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
        const targetEmpNo=cols[0];if(!targetEmpNo)return;
        const target=employees.find(e=>e.empNo===targetEmpNo);
        if(!target){failed.push(`줄${li+2}: 사번 "${targetEmpNo}" 없음`);return;}
        const evalIds=[];
        for(let i=3;i<cols.length;i+=2){
          const empNo=cols[i];if(!empNo)continue;
          const ev=employees.find(e=>e.empNo===empNo);
          if(ev)evalIds.push(ev.id);else failed.push(`줄${li+2}: 평가자 사번 "${empNo}" 없음`);
        }
        if(!evalIds.length){failed.push(`줄${li+2}: 유효한 평가자 없음`);return;}
        const existing=compSessions.find(s=>s.targetId===target.id&&s.year===year);
        if(existing){compSessions=compSessions.map(s=>s.id===existing.id?{...s,evaluatorIds:evalIds}:s);}
        else{compSessions.push({id:genId(),year,targetId:target.id,type:getCompType(target),evaluatorIds:evalIds,status:"open",createdAt:new Date().toISOString()});}
        updated++;
      });
      showToast(`${updated}명 평가자 업데이트${failed.length?" (오류 "+failed.length+"건)":""}`,updated>0?"success":"error");
      if(failed.length)console.warn(failed);
      renderCompEval();
    }catch(err){showToast("파일 오류: "+err.message,"error");}
  };
  reader.readAsText(file,"UTF-8");input.value="";
}

function createAllCompSessions(year){
  let cnt=0;
  employees.filter(e=>e.active&&e.role!=="admin").forEach(e=>{
    if(!compSessions.find(s=>s.targetId===e.id&&s.year===year)){createCompSession(e.id,year);cnt++;}
  });
  showToast(`${cnt}개 세션이 생성되었습니다.`,"success");renderCompEval();
}

function toggleEvalConfigMode(fixed){
  const defEl=document.getElementById("eval-cfg-default");
  const fixEl=document.getElementById("eval-cfg-fixed");
  const defBtn=document.getElementById("mode-default-btn");
  const fixBtn=document.getElementById("mode-fixed-btn");
  if(defEl)defEl.style.display=fixed?"none":"";
  if(fixEl)fixEl.style.display=!fixed?"none":"";
  if(defBtn)defBtn.classList.toggle("active",!fixed);
  if(fixBtn)fixBtn.classList.toggle("active",fixed);
}

function saveEvalConfig(targetId, year){
  const defEl=document.getElementById("eval-cfg-default");
  const isFixed=defEl&&defEl.style.display==="none";
  const note=document.getElementById("cfg-note")?.value.trim()||"";
  if(isFixed){
    const checked=[...document.querySelectorAll(".eval-fix-chk:checked")].map(c=>Number(c.value));
    if(!checked.length){showToast("평가자를 최소 1명 이상 선택하세요.","error");return;}
    setEvalConfig(targetId,{fixedEvaluatorIds:checked,directorMax:null,leaderMax:null,memberMax:null,note});
    showToast(`고정 평가자 ${checked.length}명으로 설정되었습니다.`,"success");
  }else{
    const dirVal=document.getElementById("cfg-dir")?.value;
    const ldrVal=document.getElementById("cfg-ldr")?.value;
    const memVal=document.getElementById("cfg-mem")?.value;
    setEvalConfig(targetId,{
      fixedEvaluatorIds:null,
      directorMax:dirVal!==undefined&&dirVal!==""?Number(dirVal):null,
      leaderMax:ldrVal!==undefined&&ldrVal!==""?Number(ldrVal):null,
      memberMax:memVal!==undefined&&memVal!==""?Number(memVal):null,
      note
    });
    showToast("평가자 기준이 저장되었습니다. 세션 생성 시 반영됩니다.","success");
  }
  closeModal();
  renderCompEval();
}

function applyBulkEvalConfig(year, type){
  const isLs=type==="leadership";
  const targets=employees.filter(e=>e.active&&(isLs?e.role==="director":(e.role==="leader"||e.role==="member")));
  let applied=0;
  targets.forEach(e=>{
    const existing=evaluatorConfig[e.id];
    if(existing&&existing.fixedEvaluatorIds)return; // skip fixed-configured ones
    if(isLs){
      const dirVal=document.getElementById("bulk-dir")?.value;
      const ldrVal=document.getElementById("bulk-ldr")?.value;
      setEvalConfig(e.id,{directorMax:dirVal?Number(dirVal):null,leaderMax:ldrVal?Number(ldrVal):null,fixedEvaluatorIds:null});
    }else if(e.role==="leader"){
      const dirVal=document.getElementById("bulk-ldr-dir")?.value;
      const ldrVal=document.getElementById("bulk-ldr-ldr")?.value;
      const memVal=document.getElementById("bulk-ldr-mem")?.value;
      setEvalConfig(e.id,{directorMax:dirVal?Number(dirVal):null,leaderMax:ldrVal?Number(ldrVal):null,memberMax:memVal?Number(memVal):null,fixedEvaluatorIds:null});
    }else{
      const memVal=document.getElementById("bulk-mem-mem")?.value;
      setEvalConfig(e.id,{memberMax:memVal?Number(memVal):null,fixedEvaluatorIds:null});
    }
    applied++;
  });
  closeModal();
  showToast(`${applied}명에 일괄 설정이 적용되었습니다.`,"success");
  renderCompEval();
}

// Dev plans: [{id, empId, year, type:"plan"|"achieve",
//   status:"draft"|"submitted"|"leader_approved"|"director_approved",
//   leaderComment, directorComment, leaderApprovedAt, directorApprovedAt,
//   editRequests:[{id,requestedBy,reason,status:"pending"|"approved"|"rejected",adminNote}],
//   data:{...form fields...}, createdAt, updatedAt}]
let talentDevPlans = [];

// Check if talent dev period is open
function isTalentPlanOpen(){
  const cs=coreTalentSettings;
  if(cs.planStage!=="open") return false;
  const now=new Date().toISOString().slice(0,10);
  if(cs.planStart&&now<cs.planStart) return false;
  if(cs.planEnd&&now>cs.planEnd) return false;
  return true;
}
function isTalentAchieveOpen(){
  const cs=coreTalentSettings;
  if(cs.achieveStage!=="open") return false;
  const now=new Date().toISOString().slice(0,10);
  if(cs.achieveStart&&now<cs.achieveStart) return false;
  if(cs.achieveEnd&&now>cs.achieveEnd) return false;
  return true;
}
// Has approved edit request for this plan
function hasEditApproval(planId){
  const plan=talentDevPlans.find(p=>p.id===planId);
  if(!plan) return false;
  return (plan.editRequests||[]).some(r=>r.status==="approved");
}
function canEditPlan(plan){
  if(!plan) return false;
  if(currentUser.role==="admin") return true;
  const isOwner=plan.empId===currentUser.id;
  if(!isOwner) return false;
  if(plan.type==="plan") return isTalentPlanOpen()||hasEditApproval(plan.id);
  if(plan.type==="achieve") return isTalentAchieveOpen()||hasEditApproval(plan.id);
  return false;
}

// coreTalentPool: [{empId, year, track, status:"candidate"|"selected"|"out",
//   recommendedBy, reviewScore, reviewComment, selectedAt,
//   outReason, outAt, outBy, manualCompScore}]
let coreTalentPool = [];

// Compute kpi grade rank for an employee
function getKpiGradeRank(emp, yr) {
  return (emp.gradeResults||{})[String(yr)]?.grade || null;
}
// Compute comp grade rank for an employee
function getCompGradeRank(emp, yr) {
  return (emp.compGradeResults||{})[String(yr)]?.grade ||
    compGradeResults[emp.id]?.[String(yr)]?.grade || null;
}

// Fill missing years with average of available grades
function fillMissingGrades(grades, yearRange, eligibleGrades, evalYear) {
  // grades: [{yr, grade}]
  const gradeToNum = {S:5, E:5, A:4, B:3, C:2, D:1};
  const numToGrade = (n) => n>=4.5?"S":n>=3.5?"A":n>=2.5?"B":n>=1.5?"C":"D";
  const available = grades.filter(g=>g.grade!=null);
  const filled = [];
  for(let i=0; i<yearRange; i++) {
    const yr = evalYear - 1 - i;
    const found = grades.find(g=>g.yr===yr);
    if(found && found.grade) {
      filled.push({yr, grade: found.grade});
    } else if(available.length > 0) {
      // Use average of available
      const avg = available.reduce((s,g)=>s+(gradeToNum[g.grade]||3),0)/available.length;
      filled.push({yr, grade: numToGrade(avg), estimated: true});
    }
  }
  return filled;
}

// Check if employee qualifies based on grade history
function checkGradeQualify(filled, eligibleGrades, countRequired) {
  const elSet = new Set(eligibleGrades.map(g=>g.toUpperCase()));
  const hits = filled.filter(g=>elSet.has((g.grade||"").toUpperCase()));
  return {ok: hits.length >= countRequired, hits, count: hits.length};
}

// 9-block position: returns {kpiTier, compTier, blockName, isTopBlock}
function calc9Block(kpiGrade, compGrade) {
  const tierMap = {S:1, E:1, A:1, B:2, C:3, D:3};
  const kpiTier = tierMap[kpiGrade] || 3;
  const compTier = tierMap[compGrade] || 3;
  const topBlocks = coreTalentSettings.topBlocks;
  const isTop = topBlocks.some(b=>{
    const bt = tierMap[b.kpiRank]||1;
    const bc = tierMap[b.compRank]||1;
    return kpiTier===bt && compTier===bc;
  });
  const blockNames = [[" 최우수","성과우수/역량보통","성과우수/역량부족"],
    ["역량우수/성과보통","일반","성과부족/역량보통"],
    ["역량우수/성과부족","역량보통/성과부족","재검토"]];
  return {kpiTier, compTier, blockName: blockNames[kpiTier-1][compTier-1], isTopBlock: isTop};
}

// Full core talent calculation for one employee
function calcCoreTalent(emp, evalYear) {
  const yr = evalYear || coreTalentSettings.evalYear;
  const cs = coreTalentSettings;

  // Build KPI grade history (fill missing)
  const kpiRaw = Array.from({length:cs.kpiYearRange},(_,i)=>({yr:yr-1-i, grade:getKpiGradeRank(emp,yr-1-i)}));
  const kpiFilled = fillMissingGrades(kpiRaw, cs.kpiYearRange, cs.kpiEligibleGrades, yr);
  const kpiCheck = checkGradeQualify(kpiFilled, cs.kpiEligibleGrades, cs.kpiCountRequired);

  // Build Comp grade history (fill missing; use manualCompScore if no comp data at all)
  const poolEntry = coreTalentPool.find(p=>p.empId===emp.id);
  const compRaw = Array.from({length:cs.compYearRange},(_,i)=>({yr:yr-1-i, grade:getCompGradeRank(emp,yr-1-i)}));
  const hasAnyComp = compRaw.some(g=>g.grade!=null);
  let compFilled;
  if(!hasAnyComp && poolEntry?.manualCompScore!=null) {
    // Use manual score → convert to grade
    const s = poolEntry.manualCompScore;
    const g = s>=90?"S":s>=80?"A":s>=70?"B":s>=60?"C":"D";
    compFilled = Array.from({length:cs.compYearRange},(_,i)=>({yr:yr-1-i, grade:g, manual:true}));
  } else {
    compFilled = fillMissingGrades(compRaw, cs.compYearRange, cs.compEligibleGrades, yr);
  }
  const compCheck = checkGradeQualify(compFilled, cs.compEligibleGrades, cs.compCountRequired);

  // Latest grade for 9-block
  const latestKpi = kpiFilled.find(g=>g.grade)?.grade || "C";
  const latestComp = compFilled.find(g=>g.grade)?.grade || "C";
  const block9 = calc9Block(latestKpi, latestComp);

  // Is in pool?
  const inPool = coreTalentPool.find(p=>p.empId===emp.id&&p.year===yr);
  const isSelected = inPool?.status==="selected";
  const isOut = inPool?.status==="out";

  return {
    empId: emp.id, name: emp.name, dept: emp.dept, team: emp.team, rank: emp.rank,
    kpiHistory: kpiFilled, kpiCheck, compHistory: compFilled, compCheck,
    latestKpi, latestComp, block9,
    basicOk: kpiCheck.ok && compCheck.ok,
    isCandidate: block9.isTopBlock && kpiCheck.ok && compCheck.ok,
    inPool: !!inPool, isSelected, isOut,
    poolEntry: inPool || null,
    hasAnyComp,
  };
}

// ── XLSX upload handler using SheetJS ────────────────────────────
function handleXlsxUpload(file){
  // Use FileReader + manual sheet parse if SheetJS not available
  // Try to load SheetJS dynamically
  if(typeof XLSX === "undefined"){
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>_doXlsxParse(file);
    s.onerror=()=>showToast("Excel 파서 로드 실패. .csv 파일을 사용해주세요.","error");
    document.head.appendChild(s);
  } else {
    _doXlsxParse(file);
  }
}

function _doXlsxParse(file){
  const reader=new FileReader();

    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const result={emp:[],career:[],edu:[],grade:[],salary:[],hr:[],errors:[]};

      // Sheet name matching (flexible)
      const getSheet=(keys)=>{
        for(const k of keys){
          const name=wb.SheetNames.find(n=>n.toLowerCase().includes(k.toLowerCase()));
          if(name) return XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:""});
        }
        return [];
      };

      const empRows=getSheet(["인사정보","1.","emp"]);
      empRows.forEach(r=>{
        if(!r["이름*"]&&!r["이름"]&&!r["name"]) return;
        result.emp.push({

          pw:r["초기비밀번호*"]||r["초기비밀번호"]||r["pw"]||"Change@1234",

// ── Upload handler ─────────────────────────────────────────────
function handleComprehensiveUpload(input){
  const file=input.files[0];if(!file)return;
  const isXlsx=file.name.toLowerCase().endsWith('.xlsx')||file.name.toLowerCase().endsWith('.xls');
  if(isXlsx){handleXlsxUpload(file);input.value="";return;}
  // CSV fallback below
  const _origFile=file;
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const text=ev.target.result;
      const lines=text.split(/\r?\n/);
      const result=parseComprehensiveCSV(lines);
      showBulkImportPreview(result);
    }catch(err){
      showToast("파일 파싱 오류: "+err.message,"error");
    }
  };
  reader.readAsText(file,"UTF-8");
  input.value="";
}

function parseCSVLine(line){
  const result=[];let cur="";let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'&&!inQ){inQ=true;}
    else if(c==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;}
    else if(c==='"'&&inQ){inQ=false;}
    else if(c===','&&!inQ){result.push(cur.trim());cur="";}
    else{cur+=c;}
  }
  result.push(cur.trim());
  return result;
}

function parseComprehensiveCSV(lines){
  const result={emp:[],career:[],edu:[],grade:[],salary:[],hr:[],errors:[]};
  lines.forEach((line,li)=>{
    if(!line.trim()||line.startsWith("#")) return;
    const cols=parseCSVLine(line);
    if(!cols[0]||cols[0]==="시트") return;
    const sheet=cols[0].toUpperCase();
    try{
      if(sheet==="EMP"){
        if(cols.length>=10&&cols[3])
          result.emp.push({loginId:cols[1],pw:cols[2],name:cols[3],empNo:cols[4],role:cols[5]||"member",
            dept:cols[6],team:cols[7],birth:cols[8],gender:cols[9],hire:cols[10],jobGroup:cols[11]||"관리직",
            rank:cols[12],rankYear:Number(cols[13])||1,salary:Number(cols[14])||0,edu:cols[15]||"대학교 졸업",
            eduSchool:cols[16],totalCareer:Number(cols[17])||0,position:cols[18]||"",email:cols[19]||"",phone:cols[20]||"",address:cols[21]||""});
      }else if(sheet==="CAREER"){
        if(cols[1]&&cols[2])
          result.career.push({empNo:cols[1],company:cols[2],role:cols[3]||"",startDate:cols[4]||"",endDate:cols[5]||"",note:cols[6]||""});
      }else if(sheet==="EDU"){
        if(cols[1]&&cols[3])
          result.edu.push({empNo:cols[1],type:cols[2]||"edu_general",name:cols[3],institution:cols[4]||"",date:cols[5]||"",startDate:cols[6]||"",endDate:cols[7]||"",note:cols[8]||""});
      }else if(sheet==="GRADE"){
        if(cols[1]&&cols[2])
          result.grade.push({empNo:cols[1],year:Number(cols[2]),kpiGrade:cols[3]||"",compGrade:cols[4]||"",kpiScore:Number(cols[5])||null,compScore:Number(cols[6])||null,note:cols[7]||""});
      }else if(sheet==="SALARY"){
        if(cols[1]&&cols[2])
          result.salary.push({empNo:cols[1],date:cols[2],before:Number(cols[3])||0,after:Number(cols[4])||0,reason:cols[5]||"",note:cols[6]||""});
      }else if(sheet==="HR"){
        if(cols[1]&&cols[2])
          result.hr.push({empNo:cols[1],type:cols[2],date:cols[3]||"",before:cols[4]||"",after:cols[5]||"",note:cols[6]||""});
      }
    }catch(e){result.errors.push(`행 ${li+1}: ${e.message}`);}
  });
  return result;
}

function executeBulkImport(data){
  // Use stored data (JSON.stringify in button attr has escaping issues for large data)
  const t=window._pendingBulkImport;
  if(!t){showToast("업로드 데이터를 찾을 수 없습니다.","error");return;}
  saveAutoSnapshot("pre_bulk_import");
  let stats={emp_new:0,emp_upd:0,grade:0,edu:0,career:0,salary:0,hr:0,skip:0};

  // ── 1. Employee (신규/업데이트) ──
  t.emp.forEach(row=>{
    const existing=employees.find(e=>e.empNo===row.empNo||(row.loginId&&e.loginId===row.loginId));
    if(existing){
      // Update
      employees=employees.map(e=>{
        if(e.id!==existing.id)return e;
        return{...e,
          dept:row.dept||e.dept, team:row.team||e.team, rank:row.rank||e.rank,
          rankYear:row.rankYear||e.rankYear, salary:row.salary||e.salary,
          edu:row.edu||e.edu, eduSchool:row.eduSchool||e.eduSchool,
          totalCareer:row.totalCareer||e.totalCareer, position:row.position||e.position,
          email:row.email||e.email, phone:row.phone||e.phone, address:row.address||e.address,
        };
      });
      stats.emp_upd++;
    } else {
      // New
      if(!row.name||!row.empNo){stats.skip++;return;}
      const career=row.totalCareer||0;
      const rankCalc=calcAutoRank(career,row.edu||"대학교 졸업");
      employees.push({id:genId(),
        loginId:row.loginId||(row.empNo.replace(/[^a-z0-9]/gi,"").toLowerCase()),
        pw:row.pw||"Change@1234",
        name:row.name, empNo:row.empNo, role:row.role||"member",
        dept:row.dept||"", team:row.team||"", birth:row.birth||"", gender:row.gender||"남",
        hire:row.hire||"", jobGroup:row.jobGroup||"관리직",
        rank:row.rank||rankCalc.rank, rankYear:row.rankYear||1,
        salary:row.salary||0, edu:row.edu||"대학교 졸업", eduSchool:row.eduSchool||"",
        totalCareer:career, position:row.position||"", email:row.email||"",
        phone:row.phone||"", address:row.address||"",
        active:true, retireDate:"", retireReason:"",
        customFields:{}, careers:[], hrHistory:[], gradeResults:{}
      });
      stats.emp_new++;
    }
  });

  // ── 2. Grade (평가 결과 - 과거 포함) ──
  t.grade.forEach(row=>{
    const emp=employees.find(e=>e.empNo===row.empNo);
    if(!emp){stats.skip++;return;}
    // KPI grade
    if(row.kpiGrade){
      if(!emp.gradeResults)emp.gradeResults={};
      const yr=String(row.year);
      if(!emp.gradeResults[yr]||!emp.gradeResults[yr].manualOverride){
        employees=employees.map(e=>{
          if(e.id!==emp.id)return e;
          const gr={...(e.gradeResults||{})};
          gr[yr]={grade:row.kpiGrade,score:row.kpiScore||null,source:"bulk_import",note:row.note||"",importedAt:new Date().toISOString()};
          return{...e,gradeResults:gr};
        });
      }
    }
    // Comp grade
    if(row.compGrade){
      if(!compGradeResults[emp.id])compGradeResults[emp.id]={};
      if(!compGradeResults[emp.id][row.year]?.adjustedBy){
        compGradeResults[emp.id][row.year]={grade:row.compGrade,score:row.compScore||null,source:"bulk_import",note:row.note||""};
      }
    }
    stats.grade++;
  });

  // ── 3. Education ──
  t.edu.forEach(row=>{
    const emp=employees.find(e=>e.empNo===row.empNo);
    if(!emp){stats.skip++;return;}
    // Check for duplicates by name+date
    const hist=Array.isArray(emp.hrHistory)?emp.hrHistory:[];
    const dup=hist.some(h=>h.type===row.type&&h.date===row.date&&h.desc===row.name);
    if(dup)return;
    const entry={id:genId(),type:row.type||"edu_general",date:row.date||"",
      desc:row.name,institution:row.institution||"",
      startDate:row.startDate||row.date,endDate:row.endDate||row.date,
      before:"",after:"이수완료",note:row.note||""};
    if(row.type==="edu_legal"){
      employees=employees.map(e=>{
        if(e.id!==emp.id)return e;
        return{...e,hrHistory:[...(Array.isArray(e.hrHistory)?e.hrHistory:[]),entry],
          customFields:{...(e.customFields||{}),[promotionSettings.legalEduField]:true}};
      });
    } else {
      employees=employees.map(e=>{
        if(e.id!==emp.id)return e;
        return{...e,hrHistory:[...(Array.isArray(e.hrHistory)?e.hrHistory:[]),entry]};
      });
    }
    stats.edu++;
  });

  // ── 4. Career ──
  t.career.forEach(row=>{
    const emp=employees.find(e=>e.empNo===row.empNo);
    if(!emp){stats.skip++;return;}
    const hist=Array.isArray(emp.hrHistory)?emp.hrHistory:[];
    const dup=hist.some(h=>h.type==="career"&&h.desc===row.company);
    if(dup)return;
    employees=employees.map(e=>{
      if(e.id!==emp.id)return e;
      const h=[...(Array.isArray(e.hrHistory)?e.hrHistory:[])];
      h.push({id:genId(),type:"career",date:row.startDate||"",desc:row.company,
        before:row.role||"",after:row.endDate||"",note:row.note||""});
      // Also store in careers array if present
      const careers=[...(Array.isArray(e.careers)?e.careers:[])];
      careers.push({id:genId(),company:row.company,role:row.role,startDate:row.startDate,endDate:row.endDate,note:row.note});
      return{...e,hrHistory:h,careers};
    });
    stats.career++;
  });

  // ── 5. Salary ──
  t.salary.forEach(row=>{
    const emp=employees.find(e=>e.empNo===row.empNo);
    if(!emp){stats.skip++;return;}
    const hist=Array.isArray(emp.hrHistory)?emp.hrHistory:[];
    const dup=hist.some(h=>h.type==="salary"&&h.date===row.date);
    if(dup)return;
    employees=employees.map(e=>{
      if(e.id!==emp.id)return e;
      const h=[...(Array.isArray(e.hrHistory)?e.hrHistory:[])];
      h.push({id:genId(),type:"salary",date:row.date,desc:"연봉 변동",
        before:String(row.before),after:String(row.after),note:row.reason||row.note||""});
      return{...e,hrHistory:h,salary:row.after||e.salary};
    });
    stats.salary++;
  });

  // ── 6. HR Changes ──
  t.hr.forEach(row=>{
    const emp=employees.find(e=>e.empNo===row.empNo);
    if(!emp){stats.skip++;return;}
    const hist=Array.isArray(emp.hrHistory)?emp.hrHistory:[];
    const dup=hist.some(h=>h.type===row.type&&h.date===row.date&&h.desc===row.note);
    if(dup)return;
    employees=employees.map(e=>{
      if(e.id!==emp.id)return e;
      const h=[...(Array.isArray(e.hrHistory)?e.hrHistory:[])];
      h.push({id:genId(),type:row.type,date:row.date,desc:HR_TYPES[row.type]||row.type,
        before:row.before||"",after:row.after||"",note:row.note||""});
      // If promotion, update rank
      if(row.type==="promotion"&&row.after){
        return{...e,hrHistory:h,rank:row.after,rankYear:1,rankDate:row.date};
      }
      return{...e,hrHistory:h};
    });
    stats.hr++;
  });

  closeModal();
  const msg=`업로드 완료: 신규 ${stats.emp_new}명, 업데이트 ${stats.emp_upd}명, 평가 ${stats.grade}건, 교육 ${stats.edu}건, 경력 ${stats.career}건, 연봉 ${stats.salary}건, 인사변동 ${stats.hr}건 (스킵: ${stats.skip}건)`;
  showToast(msg,"success");
  logAction("bulk_import","통합 데이터 업로드","all",msg);
  autoSaveToServerIfEnabled();
  renderDataManagementPage();
}

// ==================== BACKUP & RESTORE ====================
const CURRENT_SCHEMA_VERSION="8.0";

function getFullState(action=""){
  return{_version:_serverVersion,_action:action,
    schemaVersion:CURRENT_SCHEMA_VERSION,
    exportedAt:new Date().toISOString(),
    exportedBy:currentUser?.name||"unknown",
    data:{
      employees:JSON.parse(JSON.stringify(employees)),
      kpiEntries:JSON.parse(JSON.stringify(kpiEntries)),
      changeRequests:JSON.parse(JSON.stringify(changeRequests)),
      settings:JSON.parse(JSON.stringify(settings)),
      orgDB:JSON.parse(JSON.stringify(orgDB)),
      gradeSettings:JSON.parse(JSON.stringify(gradeSettings)),
      promotionSettings:JSON.parse(JSON.stringify(promotionSettings)),
      coreTalentPool:JSON.parse(JSON.stringify(coreTalentPool)),
      talentDevPlans:JSON.parse(JSON.stringify(talentDevPlans)),
      coreTalentSettings:JSON.parse(JSON.stringify(coreTalentSettings)),
      compGradeResults:JSON.parse(JSON.stringify(compGradeResults)),
      gradeAdjustHistory:JSON.parse(JSON.stringify(gradeAdjustHistory)),
      evaluatorConfig:JSON.parse(JSON.stringify(evaluatorConfig)),
      tieNotifications:JSON.parse(JSON.stringify(tieNotifications)),
      _idCounter:_id
    }
  };
}

function exportBackup(){
  const state=getFullState();
  const json=JSON.stringify(state,null,2);
  const bom="\uFEFF";
  const url=URL.createObjectURL(new Blob([bom+json],{type:"application/json;charset=utf-8;"}));
  const a=document.createElement("a");a.href=url;
  a.download=`HR_KPI_백업_${new Date().toISOString().slice(0,19).replace(/:/g,"-")}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast("백업 파일이 다운로드되었습니다.","success");
  saveAutoSnapshot("manual_export");
}

// ===== Snapshots (localStorage) =====
function saveAutoSnapshot(type="auto"){
  try{
    const snaps=getSnapshots();
    const newSnap={
      id:"snap_"+Date.now(),
      type, // auto | manual_export | pre_import
      createdAt:new Date().toISOString(),
      label:type==="pre_import"?"복원 직전 자동저장":type==="manual_export"?"수동 백업":("자동저장 "+new Date().toLocaleString("ko-KR")),
      state:getFullState()
    };
    snaps.unshift(newSnap);
    // keep max 10
    const trimmed=snaps.slice(0,MAX_SNAPSHOTS);
    localStorage.setItem(SNAPSHOT_KEY,JSON.stringify(trimmed));
  }catch(e){console.warn("스냅샷 저장 실패:",e);}
}

function getSnapshots(){
  try{return JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||"[]");}catch{return[];}
}

function applyState(state,skipUndo=false){
  if(!skipUndo)_lastRestoreUndo=getFullState();
  const d=state.data||state;
  if(d.employees&&Array.isArray(d.employees))employees=d.employees;
  if(d.kpiEntries&&Array.isArray(d.kpiEntries))kpiEntries=d.kpiEntries;
  if(d.changeRequests&&Array.isArray(d.changeRequests))changeRequests=d.changeRequests;
  if(d.settings&&typeof d.settings==="object")settings={...settings,...d.settings};
  if(d.orgDB&&typeof d.orgDB==="object")orgDB={...orgDB,...d.orgDB};
  if(d.gradeSettings&&typeof d.gradeSettings==="object")gradeSettings={...gradeSettings,...d.gradeSettings};
  if(d.tieNotifications&&Array.isArray(d.tieNotifications))tieNotifications=d.tieNotifications;
  if(d._idCounter&&typeof d._idCounter==="number")_id=d._idCounter;
  // sync currentUser
  if(currentUser){const updated=employees.find(e=>e.id===currentUser.id);if(updated)currentUser=updated;}
}

function restoreSnapshot(snapId){
  const snaps=getSnapshots();
  const snap=snaps.find(s=>s.id===snapId);
  if(!snap){showToast("스냅샷을 찾을 수 없습니다.","error");return;}
  saveAutoSnapshot("pre_import"); // save current before restore
  applyState(snap.state||snap);
  showToast(`"${snap.label}" 스냅샷으로 복원되었습니다.`,"success");
  closeModal();
  renderSidebar();renderPage();
}

function undoLastRestore(){
  if(!_lastRestoreUndo){showToast("되돌릴 이전 상태가 없습니다.","info");return;}
  const backup=_lastRestoreUndo;
  _lastRestoreUndo=null;
  applyState(backup,true);
  showToast("이전 상태로 되돌렸습니다.","success");
  closeModal();renderSidebar();renderPage();
}
