let _importData=null;
let _importPreview=null;

function handleImportFile(input){
  const file=input.files[0];if(!file)return;
  const area=$("#import-preview-area");if(area)area.innerHTML=`<div class="fz12 text-gray mt2">📖 파일 분석 중...</div>`;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const raw=ev.target.result.replace(/^\uFEFF/,""); // strip BOM
      const parsed=JSON.parse(raw);
      _importData=parsed;
      const preview=analyzeImportData(parsed);
      _importPreview=preview;
      renderImportPreview(preview);
      const btn=document.getElementById("import-confirm-btn");
      if(btn)btn.disabled=!preview.canImport;
    }catch(err){
      const area=$("#import-preview-area");
      if(area)area.innerHTML=`<div class="alert alert-error mt2">❌ 파일 파싱 오류: ${h(err.message)}<br>유효한 JSON 백업 파일을 선택하세요.</div>`;
      const btn=document.getElementById("import-confirm-btn");if(btn)btn.disabled=true;
    }
  };
  reader.readAsText(file,"UTF-8");
  input.value="";
}

function analyzeImportData(parsed){
  const preview={canImport:false,schemaVersion:"unknown",exportedAt:"",newEmps:[],updateEmps:[],newKpis:[],updateKpis:[],otherChanges:[],errors:[],warnings:[]};
  if(!parsed||typeof parsed!=="object"){preview.errors.push("유효하지 않은 파일 형식입니다.");return preview;}
  const d=parsed.data||parsed;
  preview.schemaVersion=parsed.schemaVersion||"구 버전";
  preview.exportedAt=parsed.exportedAt||"알 수 없음";

  // Analyze employees
  if(d.employees&&Array.isArray(d.employees)){
    d.employees.forEach((emp,i)=>{
      if(!emp||!emp.id){preview.warnings.push(`직원 #${i+1}: id 필드 없음 - 건너뜀`);return;}
      const existing=employees.find(e=>e.empNo&&emp.empNo&&e.empNo===emp.empNo)||employees.find(e=>e.loginId&&emp.loginId&&e.loginId===emp.loginId)||employees.find(e=>e.id===emp.id);
      if(existing)preview.updateEmps.push({emp,existing,changes:getChangeSummary(existing,emp)});
      else preview.newEmps.push(emp);
    });
  }else{preview.warnings.push("직원 데이터 없음");}

  // Analyze KPI entries
  if(d.kpiEntries&&Array.isArray(d.kpiEntries)){
    d.kpiEntries.forEach((k,i)=>{
      if(!k||!k.id){preview.warnings.push(`KPI #${i+1}: id 필드 없음 - 건너뜀`);return;}
      const existing=kpiEntries.find(ke=>ke.id===k.id)||(k.userId&&k.year&&k.item?kpiEntries.find(ke=>ke.userId===k.userId&&ke.year===k.year&&ke.item===k.item):null);
      if(existing)preview.updateKpis.push({entry:k,existing});
      else preview.newKpis.push(k);
    });
  }

  if(d.settings)preview.otherChanges.push("운영 설정 (stage, evalYear 등)");
  if(d.orgDB)preview.otherChanges.push("조직 구조 (부서, 팀, 직급)");
  if(d.gradeSettings)preview.otherChanges.push("등급 비율 설정");
  if(d.changeRequests&&Array.isArray(d.changeRequests))preview.otherChanges.push(`수정 요청 이력 (${d.changeRequests.length}건)`);
  if(d.tieNotifications&&Array.isArray(d.tieNotifications))preview.otherChanges.push(`동점자 처리 이력 (${d.tieNotifications.length}건)`);
  preview.canImport=preview.errors.length===0;
  return preview;
}

function getChangeSummary(existing,incoming){
  const changed=[];
  const fields=["name","rank","salary","dept","team","position","active","totalCareer","edu"];
  fields.forEach(f=>{if(existing[f]!==incoming[f]&&incoming[f]!=null)changed.push(f+"("+incoming[f]+")");});
  return changed.join(", ")||"변경사항 없음";
}

      <div style="text-align:center;padding:10px;background:#faf5ff;border-radius:8px"><div style="font-size:20px;font-weight:700;color:#7c3aed">${preview.newKpis.length+preview.updateKpis.length}</div><div class="fz11 text-gray">KPI 항목</div></div>
    </div>
    ${preview.updateEmps.length?`<div style="padding:0 12px 8px"><div class="fz12 fw6 mb2">직원 업데이트 내역:</div>${preview.updateEmps.slice(0,8).map(({emp,changes})=>`<div class="import-preview-row update"><span class="badge bg-blue" style="flex-shrink:0">업데이트</span><span class="fw6">${h(emp.name||emp.empNo)}</span><span class="text-gray" style="flex:1">${h(changes)}</span></div>`).join("")}${preview.updateEmps.length>8?`<div class="fz11 text-gray" style="padding:4px 10px">외 ${preview.updateEmps.length-8}명...</div>`:""}</div>`:""}
    ${preview.newEmps.length?`<div style="padding:0 12px 8px"><div class="fz12 fw6 mb2">신규 등록 직원:</div>${preview.newEmps.slice(0,5).map(e=>`<div class="import-preview-row new"><span class="badge bg-green" style="flex-shrink:0">신규</span><span class="fw6">${h(e.name||"?")}</span><span class="text-gray">${h(e.empNo||"")} · ${h(e.dept||"")} · ${h(e.rank||"")}</span></div>`).join("")}${preview.newEmps.length>5?`<div class="fz11 text-gray" style="padding:4px 10px">외 ${preview.newEmps.length-5}명...</div>`:""}</div>`:""}
    ${preview.otherChanges.length?`<div style="padding:0 12px 12px"><div class="fz12 fw6 mb2">기타 반영 항목:</div>${preview.otherChanges.map(c=>`<div class="import-preview-row"><span>✓</span><span>${h(c)}</span></div>`).join("")}</div>`:""}
  </div></div>
  <div class="success-note mt3">✅ 가져오기 가능합니다. "가져오기 실행" 버튼을 클릭하면 현재 데이터를 자동 저장한 후 반영됩니다.</div>`;
}

function confirmImport(){
  if(!_importData){showToast("가져올 파일이 없습니다.","error");return;}
  saveAutoSnapshot("pre_import"); // save current state before import
  _lastRestoreUndo=getFullState(); // also keep in memory for immediate undo
  try{
    mergeImportData(_importData);
    showToast("데이터 가져오기가 완료되었습니다.","success");
    closeModal();
    renderSidebar();renderPage();
    // Show undo option
    setTimeout(()=>{
      const t=document.createElement("div");
      t.className="toast toast-info";
      t.style.cssText="cursor:pointer;z-index:10000";
      t.innerHTML="✅ 가져오기 완료 · <strong>되돌리기</strong>를 누르면 이전 상태로 복원됩니다";
      t.onclick=()=>{undoLastRestore();t.remove();};
      document.body.appendChild(t);
      setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .4s";setTimeout(()=>t.remove(),400);},8000);
    },100);
  }catch(err){
    // Restore from undo if error
    showToast("오류가 발생하여 이전 상태를 복원합니다: "+err.message,"error");
    undoLastRestore();
  }
}

function mergeImportData(parsed){
  const d=parsed.data||parsed;
  // Merge employees: match by empNo > loginId > id, update matching, add new
  if(d.employees&&Array.isArray(d.employees)){
    const EMP_DEFAULTS={retireDate:"",retireReason:"",customFields:{},careers:[],hrHistory:[],gradeResults:{}};
    d.employees.forEach(imp=>{
      if(!imp||!imp.id)return;
      const idx=employees.findIndex(e=>(imp.empNo&&e.empNo===imp.empNo)||(imp.loginId&&e.loginId===imp.loginId)||(e.id===imp.id));
      if(idx>=0){
        // Update: preserve fields not in backup (schema additions), merge carefully
        const merged={...EMP_DEFAULTS,...employees[idx]};
        // Only overwrite non-sensitive fields if they exist in backup
        const safeFields=["name","empNo","role","dept","team","birth","gender","hire","retireDate","retireReason","jobGroup","rank","rankYear","salary","edu","eduSchool","totalCareer","position","email","phone","address","active","customFields","careers","gradeResults"];
        safeFields.forEach(f=>{if(imp[f]!==undefined)merged[f]=imp[f];});
        // Merge hrHistory: add new entries that don't exist
        if(imp.hrHistory&&Array.isArray(imp.hrHistory)){
          const existIds=new Set((merged.hrHistory||[]).map(h=>h.id));
          imp.hrHistory.forEach(h=>{if(!existIds.has(h.id))merged.hrHistory.push(h);});
        }
        employees[idx]=merged;
        // Sync currentUser if it's this employee
        if(currentUser&&currentUser.id===merged.id)currentUser=merged;
      }else{
        // New employee: add with defaults
        employees.push({...EMP_DEFAULTS,...imp});
      }
    });
  }
  // Merge KPI entries: match by id > (userId+year+item)
  if(d.kpiEntries&&Array.isArray(d.kpiEntries)){
    const KPI_DEFAULTS={actual:"",rate:"",detail:"",selfScore:null,firstScore:null,firstComment:"",secondScore:null,secondComment:"",secondCommentPublic:false,goalSub:0,firstStatus:"",firstReason:"",finalStatus:"",finalReason:"",finalConfirmed:false,finalScore:null};
    d.kpiEntries.forEach(imp=>{
      if(!imp||!imp.id)return;
      const idx=kpiEntries.findIndex(k=>k.id===imp.id||(k.userId===imp.userId&&k.year===imp.year&&k.item===imp.item));
      if(idx>=0){
        kpiEntries[idx]={...KPI_DEFAULTS,...kpiEntries[idx],...imp};
      }else{
        kpiEntries.push({...KPI_DEFAULTS,...imp});
      }
    });
  }
  // Merge changeRequests
  if(d.changeRequests&&Array.isArray(d.changeRequests)){
    const existIds=new Set(changeRequests.map(r=>r.id));
    d.changeRequests.forEach(r=>{if(r&&r.id&&!existIds.has(r.id))changeRequests.push(r);});
  }
  // Merge tieNotifications
  if(d.tieNotifications&&Array.isArray(d.tieNotifications)){
    const existIds=new Set(tieNotifications.map(t=>t.id));
    d.tieNotifications.forEach(t=>{if(t&&t.id&&!existIds.has(t.id))tieNotifications.push(t);});
  }
  // Settings: only overwrite safe fields
  if(d.settings&&typeof d.settings==="object"){
    if(d.settings.stage)settings.stage=d.settings.stage;
    if(d.settings.evalYear)settings.evalYear=d.settings.evalYear;
  }
  // orgDB: merge arrays
  if(d.orgDB&&typeof d.orgDB==="object"){
    if(d.orgDB.depts&&Array.isArray(d.orgDB.depts)){
      d.orgDB.depts.forEach(dep=>{if(dep&&!orgDB.depts.includes(dep))orgDB.depts.push(dep);});
    }
    if(d.orgDB.teams&&typeof d.orgDB.teams==="object"){
      Object.entries(d.orgDB.teams).forEach(([dept,teams])=>{
        if(!orgDB.teams[dept])orgDB.teams[dept]=[];
        if(Array.isArray(teams))teams.forEach(t=>{if(t&&!orgDB.teams[dept].includes(t))orgDB.teams[dept].push(t);});
      });
    }
    if(d.orgDB.ranks&&Array.isArray(d.orgDB.ranks)){
      d.orgDB.ranks.forEach(r=>{if(r&&!orgDB.ranks.includes(r))orgDB.ranks.push(r);});
    }
    if(d.orgDB.positions&&Array.isArray(d.orgDB.positions)){
      d.orgDB.positions.forEach(p=>{if(p&&!orgDB.positions.includes(p))orgDB.positions.push(p);});
    }
    if(d.orgDB.rankRules&&Array.isArray(d.orgDB.rankRules)){
      // Replace rankRules if provided
      orgDB.rankRules=d.orgDB.rankRules;
    }
  }
  // gradeSettings: merge
  if(d.gradeSettings&&typeof d.gradeSettings==="object"){
    Object.entries(d.gradeSettings).forEach(([dept,gs])=>{
      if(dept&&gs&&typeof gs==="object")gradeSettings[dept]=gs;
    });
  }
  // _idCounter: take max
  if(d._idCounter&&typeof d._idCounter==="number"&&d._idCounter>_id)_id=d._idCounter;
  if(d.compGradeResults&&typeof d.compGradeResults==="object")Object.assign(compGradeResults,d.compGradeResults);
  if(d.promotionSettings&&typeof d.promotionSettings==="object")Object.assign(promotionSettings,d.promotionSettings);
  if(d.coreTalentPool&&Array.isArray(d.coreTalentPool))coreTalentPool=d.coreTalentPool;
  if(d.talentDevPlans&&Array.isArray(d.talentDevPlans))talentDevPlans=d.talentDevPlans;
  if(d.coreTalentSettings&&typeof d.coreTalentSettings==="object")Object.assign(coreTalentSettings,d.coreTalentSettings);
  if(d.evaluatorConfig&&typeof d.evaluatorConfig==="object")Object.assign(evaluatorConfig,d.evaluatorConfig);
  if(d.gradeAdjustHistory&&Array.isArray(d.gradeAdjustHistory)){const existIds=new Set(gradeAdjustHistory.map(r=>r.id));d.gradeAdjustHistory.forEach(r=>{if(r&&r.id&&!existIds.has(r.id))gradeAdjustHistory.push(r);});}
}

function connectSSE(){
  if(!serverConfig.url || !currentUser) return;
  if(_sseSource){ _sseSource.close(); _sseSource=null; }
  const base = serverConfig.url.replace(/\/+$/,"");
  const url = `${base}/events?clientId=${encodeURIComponent(_clientId)}&user=${encodeURIComponent(currentUser?.name||"unknown")}`;
  console.log("[SSE] Connecting to:", url);
  try {
    _sseSource = new EventSource(url);

    _sseSource.addEventListener("connected", ()=>{
      console.log("[SSE] Connected");
      serverConfig.status="connected";
      updateServerStatusUI();
    });

    // Another user saved → sync data
    _sseSource.addEventListener("data_updated", e=>{
      const ev = JSON.parse(e.data);
      const svr = ev.version;
      if(svr && svr > _serverVersion){
        console.log(`[SSE] Data updated by ${ev.savedBy} (v${svr}): ${ev.action}`);
        _serverVersion = svr;
        // Pull latest data and apply
        serverRequest("GET","/data",null,8000).then(r=>{
          if(r.ok && r.data){
            const d = r.data?.data || r.data;
            // Apply ALL data including settings
            if(d.employees){ employees=d.employees; if(currentUser){const u=employees.find(e=>e.id===currentUser.id);if(u)currentUser=u;} }
            if(d.kpiEntries) kpiEntries=d.kpiEntries;
            if(d.compSessions) compSessions=d.compSessions;
            if(d.compResponses) compResponses=d.compResponses;
            if(d.changeRequests) changeRequests=d.changeRequests;
            if(d.gradeAdjustHistory) gradeAdjustHistory=d.gradeAdjustHistory;
            if(d.compGradeResults) Object.assign(compGradeResults, d.compGradeResults);
            if(d.evaluatorConfig) Object.assign(evaluatorConfig, d.evaluatorConfig);
            // Apply settings (KPI stage, comp eval on/off, years, etc.)
            if(d.settings && typeof d.settings==="object"){
              const prev = JSON.stringify({
                stage:settings.stage, compEvalEnabled:settings.compEvalEnabled,
                leadershipEvalEnabled:settings.leadershipEvalEnabled,
                evalYear:settings.evalYear
              });
              Object.assign(settings, d.settings);
              const curr = JSON.stringify({
                stage:settings.stage, compEvalEnabled:settings.compEvalEnabled,
                leadershipEvalEnabled:settings.leadershipEvalEnabled,
                evalYear:settings.evalYear
              });
              if(prev!==curr){
                renderSidebar(); // menu might have changed (comp eval on/off)
                showToast(`관리자가 설정을 변경했습니다 (${ev.savedBy})`, "info");
              }
            }
            // Apply org structure
            if(d.orgDB && typeof d.orgDB==="object"){
              if(d.orgDB.depts) orgDB.depts=d.orgDB.depts;
              if(d.orgDB.teams) orgDB.teams=d.orgDB.teams;
              if(d.orgDB.ranks) orgDB.ranks=d.orgDB.ranks;
              if(d.orgDB.positions) orgDB.positions=d.orgDB.positions;
              if(d.orgDB.rankRules) orgDB.rankRules=d.orgDB.rankRules;
            }
            // Apply grade settings
            if(d.gradeSettings) Object.assign(gradeSettings, d.gradeSettings);
            if(d.compGradeSettings) Object.assign(compGradeSettings, d.compGradeSettings);
            if(d.companyWideRatios && typeof d.companyWideRatios==="object") Object.assign(companyWideRatios, d.companyWideRatios);
            renderPageSafe();
            renderSidebar();
            serverConfig.statusMsg=`동기화 완료 ${new Date().toLocaleTimeString("ko-KR")} (${ev.savedBy})`;
            updateServerStatusUI();
          }
        }).catch(()=>{});
      }
    });

    // Lock status changed
    _sseSource.addEventListener("locks_update", e=>{
      _activeLocks = JSON.parse(e.data);
      updateLockUI();
    });

    // Activity event (for activity log panel)
    _sseSource.addEventListener("activity", e=>{
      const entry = JSON.parse(e.data);
      appendActivityEntry(entry);
    });

    _sseSource.onerror = ()=>{
      console.warn("[SSE] Connection lost, will retry...");
      serverConfig.status="error";
      serverConfig.statusMsg="실시간 연결 끊김 · 재연결 중...";
      updateServerStatusUI();
      setTimeout(()=>{ if(currentUser) connectSSE(); }, 5000);
    };
  } catch(e){
    console.error("[SSE] Failed:", e);
  }
}

function disconnectSSE(){
  if(_sseSource){ _sseSource.close(); _sseSource=null; }
}

// ─── Lock API ────────────────────────────────────────────────────

async function acquireLock(lockKey, targetLabel){
  if(!serverConfig.url) return true; // no server: allow
  if(_myLocks.has(lockKey)) return true; // already have it
  try {
    const r = await serverRequest("POST","/lock",{
      key: lockKey,
      userId: _clientId,
      userName: currentUser?.name||"unknown",
      targetLabel
    });
    if(r.ok){
      _myLocks.add(lockKey);
      _activeLocks[lockKey] = r.lock;
      updateLockUI();
      return true;
    } else {
      // Locked by someone else
      const lock = r.lock;
      showToast(`⛔ ${lock?.userName||"다른 사용자"}님이 현재 수정 중입니다. 완료 후 다시 시도하세요.`,"error");
      return false;
    }
  } catch(e){
    return true; // network error: allow locally
  }
}

async function releaseLock(lockKey){
  if(!serverConfig.url) return;
  _myLocks.delete(lockKey);
  delete _activeLocks[lockKey];
  updateLockUI();
  try {
    await serverRequest("POST","/unlock",{
      key: lockKey,
      userId: _clientId,
      userName: currentUser?.name||"unknown"
    });
  } catch(e){}
}

function releaseAllMyLocks(){
  for(const key of _myLocks){
    releaseLock(key);
  }
  _myLocks.clear();
}

function getLockInfo(lockKey){
  return _activeLocks[lockKey]||null;
}

function isLockedByOther(lockKey){
  const lock = _activeLocks[lockKey];
  if(!lock) return false;
  return lock.userId !== _clientId;
}

function updateLockUI(){
  // Update lock badges in current view without full re-render
  document.querySelectorAll("[data-lock-key]").forEach(el=>{
    const key = el.getAttribute("data-lock-key");
    const lock = _activeLocks[key];
    const badge = el.querySelector(".lock-badge");
    if(badge){
      if(lock && lock.userId !== _clientId){
        badge.textContent = `🔒 ${lock.userName} 수정 중`;
        badge.style.display="inline-block";
        el.style.opacity="0.6";
      } else {
        badge.textContent="";
        badge.style.display="none";
        el.style.opacity="1";
      }
    }
  });
}

function buildKpiHistorySection(empId){
  const years=[...new Set(kpiEntries.filter(k=>k.userId===empId&&k.finalConfirmed).map(k=>k.year))].sort((a,b)=>b-a);
  if(!years.length)return`<div class="card"><div class="card-head"><h3>📊 연도별 KPI 평가 이력</h3></div><div class="p-empty">확정된 KPI 평가 이력이 없습니다.</div></div>`;
  return`<div class="card">
    <div class="card-head"><h3>📊 연도별 KPI 평가 이력</h3></div>
    <div class="card-body" style="padding:0">
      ${years.map(y=>{
        const entries=kpiEntries.filter(k=>k.userId===empId&&k.year===y&&k.finalConfirmed);
        const weighted=calcWeighted(entries);const grade=getGrade(weighted);
        return`<div class="kpi-yr-card" style="margin:10px">
          <div class="kpi-yr-head" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
            <div class="flex items-c gap3">
              <span class="fw7 fz13">${y}년</span>
              <div class="score-badge-large grade-${grade}" style="width:38px;height:38px;font-size:16px">${grade}</div>
              <span class="fw7 fz12 text-blue">${weighted}점</span>
              <span class="fz11 text-gray">(${entries.length}개 KPI)</span>
            </div>
            <span class="fz11 text-gray">▼ 상세 보기</span>
          </div>
          <div class="kpi-yr-body" style="display:none">
            <div class="tbl-wrap"><table>
              <thead><tr><th>KPI 항목</th><th>비중</th><th>목표</th><th>실적</th><th>달성율</th><th>자체점수</th><th>1차점수</th><th>2차점수</th><th>최종점수</th><th>가중점수</th></tr></thead>
              <tbody>${entries.map(k=>`<tr>
                <td><strong>${h(k.item)}</strong>${k.isDraft?'<span style="font-size:10px;background:#fef9c3;color:#92400e;padding:1px 7px;border-radius:8px;margin-left:6px;font-weight:700">임시저장</span>':""}</td><td>${k.weight}%</td>
                <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(k.goal||"-")}</td>
                <td>${h(k.actual||"-")}</td><td>${h(k.rate||"-")}</td>
                <td>${k.selfScore??"-"}</td>
                <td class="fw7 text-blue">${k.firstScore??"-"}</td>
                <td class="fw7" style="color:#7c3aed">${k.secondScore??"-"}</td>
                <td class="fw7 text-green">${k.finalScore??"-"}</td>
                <td class="fw7 text-purple">${(()=>{const sc=k.finalScore!=null?k.finalScore:k.secondScore;return sc!=null?(sc*k.weight/100).toFixed(1)+"점":"−"})()}</td>
              </tr>`).join("")}</tbody>
            </table></div>
            <div style="padding:10px 14px;background:#f8fafc;display:flex;justify-content:flex-end;gap:12px">
              <span class="fz12 text-gray">종합 점수: <strong class="text-blue">${weighted}점</strong></span>
              <span class="fz12 text-gray">등급: <strong class="text-purple">${grade}등급</strong></span>
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function buildTeamMembersSection(u){
  let members=[];
  if(u.role==="leader")members=employees.filter(e=>e.active&&e.dept===u.dept&&e.team===u.team&&e.id!==u.id);
  else if(u.role==="director")members=employees.filter(e=>e.active&&e.dept===u.dept&&e.id!==u.id);
  else if(u.role==="admin")members=employees.filter(e=>e.active&&e.id!==u.id);
  if(!members.length)return"";
  return`<div class="card">
    <div class="card-head"><h3>${u.role==="leader"?"👥 팀원 정보":u.role==="director"?"🏢 본부 직원 정보":"👥 전체 직원"}</h3>
      <span class="fz11 text-gray">총 ${members.length}명</span>
    </div>
    <div class="card-body" style="padding:0">
      <div class="tbl-wrap"><table>
        <thead><tr><th>이름</th><th>사번</th><th>직급 / 연차</th><th>직책</th><th>경력 기준 적정 직급</th><th>연락처</th><th>보기</th></tr></thead>

          <td><div class="fw6 fz12">${h(e.rank)}</div><div class="fz11 text-gray">${e.rankYear||"-"}년차</div></td><td>${h(e.position||"-")}</td>
          <td class="fz11 text-gray">${(()=>{const ri=calcAutoRank(e.totalCareer||0,e.edu||"대학교 졸업");return ri.rank+(ri.yearsToNext!=null?" (다음 "+ri.nextRank+" "+ri.yearsToNext+"년)":" (최고직급)");})()}</td>

function saveSelfEdit(canEditAll){
  const g=id=>$(id)?.value.trim()||"";
  const updates={email:g("#se-email"),phone:g("#se-phone"),address:g("#se-address"),edu:g("#se-edu")||currentUser.edu,eduSchool:g("#se-eduschool"),totalCareer:Number(g("#se-career"))||0,careers:[...selfCareers]};
  if(canEditAll){if(g("#se-name"))updates.name=g("#se-name");if(g("#se-birth"))updates.birth=g("#se-birth");}
  employees=employees.map(e=>e.id===currentUser.id?{...e,...updates}:e);
  currentUser={...currentUser,...updates};
  closeModal();showToast("내 정보가 수정되었습니다.","success");renderMyProfile();renderSidebar();
}

async function handleResumeFile(input){
  const file=input.files[0];if(!file)return;
  const loading=$("#parse-loading"),result=$("#parse-result");
  if(loading)loading.style.display="inline";if(result)result.innerHTML="";
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
    const content=[];
    if(file.type==="application/pdf")content.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}});
    else if(file.type.startsWith("image/"))content.push({type:"image",source:{type:"base64",media_type:file.type,data:b64}});
    else throw new Error("PDF 또는 이미지만 지원합니다.");
    content.push({type:"text",text:`이력서에서 다음 정보를 JSON만 반환하세요 (마크다운 없이):
{"name":"이름","birth":"YYYY-MM-DD","gender":"남 또는 여","totalCareer":총경력년수(소수 가능),"edu":"교육수준(고등학교 졸업/전문대 졸업/대학교 졸업/대학원 석사/대학원 박사 중 하나)","eduSchool":"학교명 (졸업년도)","jobGroup":"직군(관리직/영업직/개발직/연구직/생산직/서비스직/기타 중 하나)","careers":[{"co":"회사","start":"YYYY-MM","end":"YYYY-MM 또는 현재","pos":"직위"}],"email":"이메일","phone":"연락처"}`});
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content}]})});
    if(!resp.ok)throw new Error(`API 오류 ${resp.status} - API Key 설정 확인 필요`);
    const data=await resp.json();
    const txt=(data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    const p=JSON.parse(txt);
    if(p.name&&$("#hr-name"))$("#hr-name").value=p.name;
    if(p.birth&&$("#hr-birth"))$("#hr-birth").value=p.birth;
    if(p.gender&&$("#hr-gender"))$("#hr-gender").value=p.gender;
    if(p.totalCareer){if($("#hr-career"))$("#hr-career").value=p.totalCareer;}
    if(p.edu&&$("#hr-edu"))$("#hr-edu").value=p.edu;
    if(p.eduSchool&&$("#hr-eduschool"))$("#hr-eduschool").value=p.eduSchool;
    if(p.jobGroup&&$("#hr-jobgroup"))$("#hr-jobgroup").value=p.jobGroup;
    if(p.email&&$("#hr-email"))$("#hr-email").value=p.email;
    if(p.phone&&$("#hr-phone"))$("#hr-phone").value=p.phone;
    if(p.careers&&p.careers.length){hrCareers=p.careers;renderCareers();}
    // Auto-calc rank after parse
    if(p.totalCareer||p.edu)applyAutoRank();
    if(result)result.innerHTML=`<div class="alert alert-success mt2">✅ 이력서 파싱 완료! 직급이 자동 산정되었습니다. 내용을 확인 후 수정하세요.</div>`;
  }catch(err){if(result)result.innerHTML=`<div class="alert alert-error mt2">⚠ 파싱 실패: ${h(err.message)}</div>`;}
  finally{if(loading)loading.style.display="none";input.value="";}
}

function getFilteredEmps(){
  const u=currentUser;
  return employees.filter(e=>{
    // 퇴직자는 관리자만 볼 수 있음
    if(!e.active&&u.role!=="admin")return false;
    if(u.role==="director"&&e.dept!==u.dept)return false;
    if(u.role==="leader"&&(e.dept!==u.dept||e.team!==u.team))return false;
    if(hrListFilter.dept&&e.dept!==hrListFilter.dept)return false;
    if(hrListFilter.role&&e.role!==hrListFilter.role)return false;
    if(hrListFilter.status==="active"&&!e.active)return false;
    if(hrListFilter.status==="inactive"&&e.active)return false;
    if(hrListFilter.search){const s=hrListFilter.search.toLowerCase();if(!e.name.toLowerCase().includes(s)&&!e.empNo.toLowerCase().includes(s)&&!(e.loginId||"").toLowerCase().includes(s))return false;}

function getBeforeVal(emp,type){
  if(!emp)return"";
  switch(type){
    case"transfer":return emp.dept+"/"+(emp.team||"");
    case"salary":return emp.salary?Number(emp.salary).toLocaleString()+"원":"미등록";
    case"rank_change":case"promotion":return emp.rank||"";
    case"position":return emp.position||"없음";
    case"retirement":return"재직";case"leave":return"재직";case"return_leave":return"휴직";
    default:return"";
  }
}

function handleHRChgBulkUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      let raw=ev.target.result.replace(/^\uFEFF/,""); // strip BOM
      const lines=raw.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){showToast("데이터가 없습니다.","error");return;}
      let added=0,failed=[],preview=[];
      lines.slice(1).forEach((line,li)=>{
        // Support both comma-separated and tab-separated
        const cols=line.includes("\t")?line.split("\t"):line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
        if(!cols[0]||!cols[0].trim())return; // skip empty rows
        const empNo=cols[0].trim();const type=cols[1]?.trim();const date=cols[2]?.trim();const desc=cols[3]?.trim();
        if(!empNo||!type||!date||!desc){failed.push(`줄${li+2}: 필수값 누락 (사번:${empNo}, 유형:${type})`);return;}
        const emp=employees.find(e=>e.empNo===empNo||(e.loginId&&e.loginId===empNo));
        if(!emp){failed.push(`줄${li+2}: 사번 "${empNo}" 직원 없음`);return;}
        if(!HR_TYPES[type]){failed.push(`줄${li+2}: 유효하지 않은 유형 "${type}". 유효한 유형: ${Object.keys(HR_TYPES).join(",")}`);return;}
        const after=(cols[4]||"").trim();const note=(cols[5]||"").trim();
        const before=getBeforeVal(emp,type);
        let updates={};
        if(type==="salary"){
          const v=Number(after.replace(/[^0-9]/g,""));
          if(v){updates={salary:v};}else{failed.push(`줄${li+2}: 연봉값 "${after}" 숫자 아님`);return;}
        }else if(type==="rank_change"||type==="promotion"){
          if(after)updates={rank:after};
        }else if(type==="position"){
          if(after){updates={position:after};if(!orgDB.positions.includes(after))orgDB.positions.push(after);}
        }else if(type==="transfer"){
          const parts=after.split("/");
          if(parts.length>=2){updates={dept:parts[0].trim(),team:parts[1].trim()};}
          else if(parts.length===1){updates={team:parts[0].trim()};}
        }else if(type==="retirement"){
          updates={active:false,retireDate:date,retireReason:after||"기타"};
        }
        const newH={id:genId(),type,date,desc,before,after,note};
        employees=employees.map(e=>e.id===emp.id?{...e,...updates,hrHistory:Array.isArray(e.hrHistory)?[...e.hrHistory,newH]:[newH]}:e);
        // Sync currentUser if modified
        if(currentUser&&currentUser.id===emp.id){const upd=employees.find(e=>e.id===emp.id);if(upd)currentUser=upd;}
        preview.push(`✓ ${emp.name}: ${HR_TYPES[type]} (${after||"-"})`);
        added++;
      });
      let msg=`${added}건 처리 완료`;
      if(failed.length)msg+=` / ${failed.length}건 오류`;
      showToast(msg,added>0?"success":"error");
      if(failed.length>0){
        console.warn("인사변동 업로드 오류:",failed);
        showModal(`<div class="modal modal-md"><div class="modal-head"><h2>업로드 결과</h2><button class="modal-close" onclick="closeModal()">×</button></div>
        <div class="modal-body">
          <div class="success-note mb3">✅ 성공: ${added}건<br>${preview.slice(0,10).map(p=>`<div class="fz11">${h(p)}</div>`).join("")}${preview.length>10?`<div class="fz11 text-gray">외 ${preview.length-10}건...</div>`:""}</div>
          ${failed.length?`<div class="alert alert-error">오류: ${failed.length}건<br>${failed.map(f=>`<div class="fz11">${h(f)}</div>`).join("")}</div>`:""}
        </div>
        <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">확인</button></div></div>`);
      }
      renderHRChanges();
    }catch(err){showToast("파일 파싱 오류: "+err.message,"error");console.error(err);}
  };
  reader.readAsText(file,"UTF-8");input.value="";
}

function updateHCFields(){
  const type=$("#hc-type")?.value;const el=$("#hc-specific-fields");if(!el)return;
  const emp=getEmp(Number(hrChgEmpId));if(!emp)return;
  const beforeVal=getBeforeVal(emp,type);const today=new Date().toISOString().slice(0,10);
  let html="";
  if(type==="transfer"){html=`<div class="fg"><label class="fl">변동 전 (현재)</label><input class="fc" id="hc-before" value="${h(beforeVal)}" readonly></div>
  <div class="g2"><div class="fg"><label class="fl">변동 후 — 부서 <span class="req">*</span></label><select class="fc" id="hc-new-dept" onchange="syncHCTeams(this.value)"><option value="">선택</option>${orgDB.depts.map(d=>`<option${emp.dept===d?" selected":""}>${h(d)}</option>`).join("")}</select></div>
  <div class="fg"><label class="fl">변동 후 — 팀 <span class="req">*</span></label><select class="fc" id="hc-new-team"><option value="">선택</option>${getTeams(emp.dept).map(t=>`<option${emp.team===t?" selected":""}>${h(t)}</option>`).join("")}</select></div></div>`;}
  else if(type==="salary"){html=`<div class="g2"><div class="fg"><label class="fl">변동 전 (현재)</label><input class="fc" id="hc-before" value="${h(beforeVal)}" readonly></div><div class="fg"><label class="fl">변동 후 연봉 (원) <span class="req">*</span></label><input class="fc" id="hc-after-salary" type="number" value="${emp.salary||""}"></div></div>`;}
  else if(type==="rank_change"||type==="promotion"){html=`<div class="g2"><div class="fg"><label class="fl">변동 전 (현재)</label><input class="fc" id="hc-before" value="${h(beforeVal)}" readonly></div><div class="fg"><label class="fl">변동 후 직급 <span class="req">*</span></label><select class="fc" id="hc-after-rank">${orgDB.ranks.map(r=>`<option${emp.rank===r?" selected":""}>${h(r)}</option>`).join("")}</select></div></div>`;}
  else if(type==="position"){html=`<div class="g2"><div class="fg"><label class="fl">변동 전 (현재)</label><input class="fc" id="hc-before" value="${h(beforeVal)}" readonly></div><div class="fg"><label class="fl">변동 후 직책 <span class="req">*</span></label><select class="fc" id="hc-after-pos" onchange="syncPosInput(this.value)"><option value="">없음</option>${orgDB.positions.filter(p=>p).map(p=>`<option${emp.position===p?" selected":""}>${h(p)}</option>`).join("")}<option value="__new__">+ 직접 입력</option></select></div></div><div id="hc-pos-new-wrap" style="display:none" class="fg"><label class="fl">직접 입력</label><input class="fc" id="hc-after-pos-new" placeholder="직책명 직접 입력"></div>`;}
  else if(type==="leave"){html=`<div class="g3"><div class="fg"><label class="fl">휴직 시작일</label><input class="fc" id="hc-leave-start" type="date" value="${today}"></div><div class="fg"><label class="fl">휴직 종료(예정)일</label><input class="fc" id="hc-leave-end" type="date"></div><div class="fg"><label class="fl">휴직 사유</label><select class="fc" id="hc-leave-reason"><option value="">선택</option>${["개인 사정","육아 휴직","병가","군 휴직","가족 돌봄","기타"].map(r=>`<option>${r}</option>`).join("")}</select></div></div>`;}
  else if(type==="retirement"){html=`<div class="g2"><div class="fg"><label class="fl">퇴직일</label><input class="fc" id="hc-retire-date" type="date" value="${today}"></div><div class="fg"><label class="fl">퇴직 사유</label><select class="fc" id="hc-retire-reason"><option value="">선택</option>${["자진 퇴사","권고 사직","계약 만료","정년 퇴직","기타"].map(r=>`<option>${r}</option>`).join("")}</select></div></div>`;}
  else if(type==="award"||type==="core_talent"){html=`<div class="g2"><div class="fg"><label class="fl">선정 기간 시작</label><input class="fc" id="hc-period-start" type="date"></div><div class="fg"><label class="fl">선정 기간 종료</label><input class="fc" id="hc-period-end" type="date"></div></div>`;}
  else{html=`<div class="g2"><div class="fg"><label class="fl">변동 전</label><input class="fc" id="hc-before" value="${h(beforeVal)}"></div><div class="fg"><label class="fl">변동 후</label><input class="fc" id="hc-after-text" placeholder="변동 후 내용"></div></div>`;}
  el.innerHTML=html;
}
function syncHCTeams(dept){const el=$("#hc-new-team");if(!el)return;el.innerHTML=`<option value="">선택</option>${getTeams(dept).map(t=>`<option>${h(t)}</option>`).join("")}`;}
function syncPosInput(v){const w=$("#hc-pos-new-wrap");if(w)w.style.display=v==="__new__"?"block":"none";}
function submitHRChange(){
  const type=$("#hc-type")?.value,date=$("#hc-date")?.value,desc=$("#hc-desc")?.value.trim();
  if(!type||!date||!desc){showToast("변동 유형, 날짜, 내용을 입력하세요.","error");return;}
  const emp=getEmp(Number(hrChgEmpId));if(!emp)return;
  const before=getBeforeVal(emp,type);
  let after="",updates={};
  if(type==="transfer"){const nd=$("#hc-new-dept")?.value,nt=$("#hc-new-team")?.value;if(!nd||!nt){showToast("부서와 팀을 선택하세요.","error");return;}after=nd+"/"+nt;updates={dept:nd,team:nt};}
  else if(type==="salary"){const v=Number($("#hc-after-salary")?.value);if(!v){showToast("연봉을 입력하세요.","error");return;}after=v.toLocaleString()+"원";updates={salary:v};}
  else if(type==="rank_change"||type==="promotion"){after=$("#hc-after-rank")?.value||"";if(!after){showToast("직급을 선택하세요.","error");return;}updates={rank:after};}
  else if(type==="position"){const pSel=$("#hc-after-pos")?.value;after=pSel==="__new__"?($("#hc-after-pos-new")?.value.trim()||""):pSel;updates={position:after};if(after&&after!=="없음"&&!orgDB.positions.includes(after))orgDB.positions.push(after);}
  else if(type==="leave"){after=`${$("#hc-leave-start")?.value||""}~${$("#hc-leave-end")?.value||""} (${$("#hc-leave-reason")?.value||""})`;}
  else if(type==="retirement"){after=`${$("#hc-retire-date")?.value||""} (${$("#hc-retire-reason")?.value||""})`;updates={active:false};}
  else if(type==="award"||type==="core_talent"){after=`${$("#hc-period-start")?.value||""}~${$("#hc-period-end")?.value||""}`;}
  else{after=$("#hc-after-text")?.value.trim()||"";}
  const newH={id:genId(),type,date,desc,before,after,note:$("#hc-note")?.value.trim()||""};
  employees=employees.map(e=>e.id===Number(hrChgEmpId)?{...e,...updates,hrHistory:[...(e.hrHistory||[]),newH]}:e);
  closeModal();showToast("인사 변동 사항이 등록되었습니다.","success");renderHRChanges();
}

// ==================== KPI ====================
function getScopeEmps(){
  const u=currentUser;
  if(u.role==="admin")return employees.filter(e=>e.active&&e.role!=="admin");
  if(u.role==="director")return employees.filter(e=>e.active&&e.dept===u.dept&&e.role!=="admin");
  if(u.role==="leader")return employees.filter(e=>e.active&&e.dept===u.dept&&e.team===u.team);
  return employees.filter(e=>e.id===u.id&&e.active);
}

function applyKpiSearch(resultsMode){
  const scope=getScopeEmps();
  const name=(kpiSearch?.name||"").trim();
  const dept=kpiSearch?.dept||"";
  if(!name&&!dept){kpiSelUserId=currentUser.id;renderKPI(resultsMode);return;}
  const matched=scope.filter(e=>
    (!name||e.name.includes(name))&&
    (!dept||e.dept===dept)
  );
  if(matched.length===1){
    kpiSelUserId=matched[0].id;
    renderKPI(resultsMode);
  } else {
    // Show matching list in cards area
    const c=document.getElementById("kpi-cards-area");
    if(!c)return;
    if(!matched.length){c.innerHTML=`<div class="card"><div class="p-empty">검색 결과가 없습니다.</div></div>`;return;}
    c.innerHTML=`<div class="card"><div class="card-head"><h3>검색 결과 (${matched.length}명)</h3></div>
    <div class="card-body" style="padding:0"><div class="tbl-wrap"><table>
      <thead><tr><th>이름</th><th>직위</th><th>부서</th><th>팀</th><th>선택</th></tr></thead>
      <tbody>${matched.map(e=>`<tr>
        <td><strong>${h(e.name)}</strong></td>
        <td>${roleBadge(e.role)}</td>
        <td>${h(e.dept)}</td>
        <td>${h(e.team)}</td>
        <td><button class="btn btn-primary btn-sm" onclick="kpiSelUserId=${e.id};kpiSearch={name:'',dept:''};renderKPI(${resultsMode})">선택</button></td>
      </tr>`).join("")}
      </tbody>
    </table></div></div></div>`;
  }
}

function renderKPI(resultsMode){
  if(!kpiSelUserId)kpiSelUserId=currentUser.id;
  const year=settings.evalYear,scope=getScopeEmps();
  const selEmp=getEmp(kpiSelUserId)||getEmp(currentUser.id);
  const entries=kpiEntries.filter(k=>k.userId===selEmp?.id&&k.year===year);
  const u=currentUser;
  const canEdit=u.role==="admin"||(u.role==="director"&&selEmp?.dept===u.dept)||(u.role==="leader"&&selEmp?.dept===u.dept&&selEmp?.team===u.team)||(u.id===selEmp?.id);
  const isSelf=u.id===selEmp?.id;
  const stageOK=!resultsMode?(settings.stage==="goal"):(settings.stage==="performance");
  const wt=weightTotal(entries);
  const c=$("#content");
  c.innerHTML=`
  ${scope.length>1?`<div class="card"><div class="card-body"><div class="fg" style="margin:0"><label class="fl">대상자 선택</label>
    <select class="fc" style="width:320px" onchange="kpiSelUserId=Number(this.value);renderKPI(${resultsMode})">
      ${scope.map(e=>`<option value="${e.id}"${kpiSelUserId===e.id?" selected":""}>${h(e.name)} (${ROLES[e.role]}, ${h(e.team)})</option>`).join("")}
    </select></div></div></div>`:""}
  <div class="card"><div class="card-body" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div><strong style="font-size:14px">${h(selEmp?.name||"-")}</strong><span class="text-gray fz12" style="margin-left:8px">${h(selEmp?.dept||"")} / ${h(selEmp?.team||"")} / ${h(selEmp?.rank||"")}</span>
    <span style="margin-left:12px;font-size:12px;font-weight:600;color:${wt===100?"#16a34a":"#d97706"}">비중: ${wt}%${wt!==100?" ⚠":""}</span></div>
    <div class="flex gap2">
      <button class="btn btn-secondary btn-sm" onclick="dlKpiCSV(${selEmp?.id||0},${year})">📥 다운로드</button>
      ${!resultsMode&&stageOK&&canEdit?`<button class="btn btn-primary btn-sm" onclick="openKpiAdd(${selEmp?.id||0},${year})">+ KPI 추가</button>`:""}
    </div>
  </div></div>
  ${!stageOK?`<div class="stage-banner ${settings.stage==="goal"?"goal":"perf"}"><span style="font-size:18px">⚠</span><span class="fz12 fw6">${resultsMode?"현재 KPI 등록 단계입니다.":"현재 결과 입력 단계입니다."}</span></div>`:""}
  <div id="kpi-cards-area">${entries.length?entries.map(k=>buildKpiCard(k,selEmp,u,canEdit,isSelf,stageOK,resultsMode)).join(""):`<div class="card"><div class="p-empty">등록된 KPI가 없습니다.</div></div>`}</div>`;
}
function buildKpiCard(k,selEmp,u,canEdit,isSelf,stageOK,resultsMode){
  const confirmed=k.finalConfirmed&&k.finalStatus==="approved";
  const canShowScore=confirmed||u.role==="admin"||u.role==="director"||(u.role==="leader"&&selEmp?.dept===u.dept&&selEmp?.team===u.team);
  const submitted=k.goalSub===1;
  return`<div class="kpi-card"><div class="kpi-card-head">
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px"><strong>${h(k.item)}</strong>${k.isDraft?'<span style="font-size:10px;background:#fef9c3;color:#92400e;padding:1px 7px;border-radius:8px;margin-left:6px;font-weight:700">임시저장</span>':""}${badge("비중 "+k.weight+"%","blue")}${statusBadge(k)}</div>
    <div class="flex gap2">
      ${stageOK&&!resultsMode&&canEdit&&!submitted?`<button class="btn btn-ghost btn-sm" onclick="openKpiEdit(${k.id})">수정</button>`:""}
      ${stageOK&&!resultsMode&&canEdit&&!submitted?`<button class="btn btn-success btn-sm" onclick="submitKpi(${k.id})">제출</button>`:""}
      ${stageOK&&!resultsMode&&canEdit&&!submitted?`<button class="btn btn-danger btn-sm" onclick="deleteKpi(${k.id})">삭제</button>`:""}
      ${stageOK&&!resultsMode&&submitted&&isSelf?`<button class="btn btn-warning btn-sm" onclick="openKpiReq(${k.id})">수정 요청</button>`:""}
      ${stageOK&&resultsMode&&isSelf?`<button class="btn btn-primary btn-sm" onclick="openKpiResult(${k.id})">결과 입력</button>`:""}
    </div>
  </div>
  <div class="kpi-card-body"><div class="g3" style="gap:10px">
    <div><div class="kf-label">전년도 실적</div><div class="kf-val">${h(k.prev||"-")}</div></div>
    <div><div class="kf-label">당해년도 목표</div><div class="kf-val fw6">${h(k.goal||"-")}</div></div>
    <div><div class="kf-label">전년비</div><div class="kf-val">${h(k.yoy||"-")}</div></div>
    <div class="cs3"><div class="kf-label">달성 전략</div><div class="kf-val">${h(k.strategy||"-")}</div></div>
    <div><div class="kf-label">평가 기준</div><div class="kf-val">${h(k.evalCriteria||"-")}</div></div>
    ${settings.stage==="performance"?`
    <div><div class="kf-label">실적</div><div class="kf-val fw6">${h(k.actual||"-")}</div></div>
    <div><div class="kf-label">달성율</div><div class="kf-val">${h(k.rate||"-")}</div></div>
    <div class="cs3"><div class="kf-label">세부 추진 실적</div><div class="kf-val">${h(k.detail||"-")}</div></div>
    <div><div class="kf-label">자체 평가 점수</div><div class="kf-val fw7">${k.selfScore??"-"}</div></div>
    ${canShowScore&&k.ceoScore!=null?`<div><div class="kf-label">차상위자 점수</div><div class="kf-val fw7 text-blue">${k.ceoScore}</div></div>
    <div><div class="kf-label">가중 반영</div><div class="kf-val fw7 text-purple">${(k.ceoScore*k.weight/100).toFixed(2)}점</div></div>`:""}
    `:""}
    ${k.firstItemFeedback&&canShowScore?`<div class="cs3" style="background:#eff6ff;padding:8px 10px;border-radius:6px;font-size:11px;color:#1d4ed8;border-left:2px solid #2563eb">💬 1차 항목 피드백: ${h(k.firstItemFeedback)}</div>`:""}
    ${k.secondItemFeedback&&canShowScore&&k.secondCommentPublic?`<div class="cs3" style="background:#faf5ff;padding:8px 10px;border-radius:6px;font-size:11px;color:#6d28d9;border-left:2px solid #7c3aed">💬 2차 항목 피드백: ${h(k.secondItemFeedback)}</div>`:""}
    ${k.firstStatus==="rejected"?`<div class="cs3" style="background:#fef2f2;padding:8px 10px;border-radius:6px;font-size:11px;color:#b91c1c">1차 반려 사유: ${h(k.firstReason||"")}</div>`:""}
    ${k.finalStatus==="rejected"?`<div class="cs3" style="background:#fef2f2;padding:8px 10px;border-radius:6px;font-size:11px;color:#b91c1c">최종 반려 사유: ${h(k.finalReason||"")}</div>`:""}

}

// ==================== APPROVALS ====================
// 평가 단계: 팀원 KPI → 팀원 자체평가 → 팀장 1차 승인+점수 → 사업부장 2차 점수 → 최종확정
// 팀장: 팀원 전체에 1차 점수+의견 입력 가능 (사업부장 입력 전까지 수정 가능)
// 사업부장: 팀장이 소속 팀원 전체에 firstScore 입력 완료 후에만 2차 점수 입력 가능
// 사업부장: 최종확정 전까지 1차/2차 점수 모두 수정 가능

function isTeamFullyFirst(leaderId, year){
  // 팀장의 소속 팀원 전부가 firstScore 있는지 확인
  const leader=getEmp(leaderId);if(!leader)return false;
  const members=employees.filter(e=>e.active&&e.role==="member"&&e.dept===leader.dept&&e.team===leader.team);
  if(!members.length)return false;
  return members.every(m=>{
    const kpis=kpiEntries.filter(k=>k.userId===m.id&&k.year===year&&k.goalSub);
    return kpis.length>0&&kpis.every(k=>k.firstScore!=null);
  });
}

function getEvalProgress(u, year){
  // Returns {pending, done, total} for current user's evaluation duties
  if(u.role==="leader"){
    const members=employees.filter(e=>e.active&&e.role==="member"&&e.dept===u.dept&&e.team===u.team);
    let total=0,done=0,pending=0;
    members.forEach(m=>{
      const kpis=kpiEntries.filter(k=>k.userId===m.id&&k.year===year&&k.goalSub&&k.firstStatus==="approved");
      if(!kpis.length)return;
      total++;
      if(kpis.every(k=>k.firstScore!=null))done++;
      else pending++;
    });
    return{total,done,pending,label:"1차 평가 대상"};
  }else if(u.role==="director"){
    const members=employees.filter(e=>e.active&&e.dept===u.dept&&(e.role==="member"||e.role==="leader"));
    let total=0,done=0,pending=0;
    members.forEach(m=>{
      const kpis=kpiEntries.filter(k=>k.userId===m.id&&k.year===year&&k.goalSub&&k.firstStatus==="approved");
      if(!kpis.length)return;
      // For members: only after team is fully done with first eval
      if(m.role==="member"){
        const leader=employees.find(e=>e.active&&e.role==="leader"&&e.dept===m.dept&&e.team===m.team);
        if(!leader||!isTeamFullyFirst(leader.id,year))return; // not yet available
      }
      total++;
      if(kpis.every(k=>k.secondScore!=null))done++;
      else pending++;
    });
    return{total,done,pending,label:"2차 평가 대상"};
  }
  return{total:0,done:0,pending:0,label:""};
}

function renderApprovals(){
  const year=settings.evalYear,u=currentUser;
  let scopeEmps=[];
  if(u.role==="admin")scopeEmps=employees.filter(e=>e.active&&e.id!==u.id);
  else if(u.role==="director")scopeEmps=employees.filter(e=>e.active&&e.dept===u.dept&&e.id!==u.id);

  const pendingTies=tieNotifications.filter(t=>!t.resolved&&(u.role==="director"?t.dept===u.dept:u.role==="admin"));
  const prog=getEvalProgress(u,year);
  const pendingReqCount=changeRequests.filter(r=>{if(r.status!=="pending")return false;const k=getKpi(r.kpiId);if(!k)return false;const owner=getEmp(k.userId);if(!owner)return false;if(u.role==="leader")return owner.role==="member"&&owner.dept===u.dept&&owner.team===u.team;if(u.role==="director"||u.role==="admin")return owner.dept===(u.dept||"__all__")||u.role==="admin";return false;}).length;

  const tabs=[

    ...(!isFirstEvalPage&&!isSecondEvalPage&&!isAmendPage&&settings.stage==="goal"?[{id:"list",label:"KPI 승인 현황"}]:[]),

    // 수정 요청 / 처리 완료 - 수정승인 페이지이거나 기타 페이지
    ...(isAmendPage||(!isFirstEvalPage&&!isSecondEvalPage)?[
      {id:"requests",label:`수정 요청 (${pendingReqCount})`},
      ...(pendingTies.length?[{id:"ties",label:`🔔 동점자 처리 (${pendingTies.length})`}]:[]),

    ]:[]),

  // Ensure approvalTab is valid
  if(tabs.length&&!tabs.find(t=>t.id===approvalTab)){

  <div class="modal-body">

      <div class="fg" style="margin:0"><label class="fl">종합 평가 의견 <span class="req">*</span> (2차 평가자에게 공개됩니다)</label>
        <textarea class="fc" id="first-comment" rows="4" placeholder="해당 직원의 전반적인 성과, 역량, 발전 가능성, 개선점 등을 종합하여 작성하세요">${h(prevComment)}</textarea>
      </div>
    </div>
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="saveFirstEval(${memberId},${year})">1차 평가 저장</button></div></div>`);
}
function saveFirstEval(memberId,year){
  const comment=$("#first-comment")?.value.trim();
  if(!comment){showToast("전체 평가 의견을 반드시 입력하세요.","error");return;}
  const kpis=kpiEntries.filter(k=>k.userId===memberId&&k.year===year&&k.goalSub&&k.firstStatus==="approved");
  let valid=true;
  kpis.forEach(k=>{const s=Number(document.getElementById("fs-"+k.id)?.value);if(!s&&s!==0){valid=false;}});
  if(!valid){showToast("모든 KPI 항목의 1차 평가 점수를 입력하세요.","error");return;}
  kpiEntries=kpiEntries.map(k=>{
    if(k.userId===memberId&&k.year===year&&k.goalSub&&k.firstStatus==="approved"){
      const s=Number(document.getElementById("fs-"+k.id)?.value);
      const itemFeedback=document.getElementById("ff-"+k.id)?.value.trim()||"";
      return{...k,firstScore:s,firstComment:comment,firstItemFeedback:itemFeedback};
    }
    return k;
  });
  closeModal();showToast(`${getEmpName(memberId)}님 1차 평가가 완료되었습니다.`,"success");logAction("kpi_eval_first","1차 평가",`member:${memberId}`,`${year}년`);autoSaveToServerIfEnabled();renderApprovals();
}

function calcCompGradesForAll(year){
  if(!year)year=settings.compEvalYear;
  const allTargets=employees.filter(e=>e.active&&e.role!=="admin");
  allTargets.forEach(target=>{
    const session=compSessions.find(s=>s.targetId===target.id&&s.year===year);
    if(!session)return;
    const responses=compResponses.filter(r=>r.sessionId===session.id&&r.submittedAt);
    if(!responses.length)return;
    const score=calcCompScore(session.id)||0;
    if(!compGradeResults[target.id])compGradeResults[target.id]={};
    const existing=compGradeResults[target.id][year];
    if(existing&&existing.adjustedBy)return; // keep manual adjustments
    compGradeResults[target.id][year]={score,grade:null,rank:null,pool:null,computedAt:new Date().toISOString()};
  });
  // Now assign grades by dept/pool
  const depts=[...new Set(allTargets.map(e=>e.dept))];
  depts.forEach(dept=>{
    const deptEmps=allTargets.filter(e=>e.dept===dept);
    const gs=getCompGradeSettings(dept);
    ['member','leader'].forEach(pool=>{
      const poolEmps=deptEmps.filter(e=>e.role===pool);
      if(!poolEmps.length)return;
      // Check all have sessions with responses
      const allDone=poolEmps.every(emp=>{
        const s=compSessions.find(ss=>ss.targetId===emp.id&&ss.year===year);
        if(!s)return false;
        return compResponses.filter(r=>r.sessionId===s.id&&r.submittedAt).length>0;
      });
      if(!allDone)return;
      assignCompPoolGrades(poolEmps,gs[pool],dept,year,pool);
    });
  });
}
function assignCompPoolGrades(pool,ratios,dept,year,poolName){
  if(!pool||!pool.length)return;
  const scored=pool.map(e=>{const cg=compGradeResults[e.id]?.[year];return{emp:e,score:cg?.score||0};}).sort((a,b)=>b.score-a.score);
  const total=scored.length;let idx=0;
  ratios.forEach((ratio,ri)=>{
    let cnt=ri===ratios.length-1?(total-idx):Math.max(0,Math.round(ratio.pct/100*total));
    cnt=Math.min(cnt,total-idx);
    for(let i=idx;i<idx+cnt;i++){
      if(!compGradeResults[scored[i].emp.id])compGradeResults[scored[i].emp.id]={};
      const existing=compGradeResults[scored[i].emp.id][year]||{};
      if(!existing.adjustedBy){
        compGradeResults[scored[i].emp.id][year]={...existing,grade:ratio.grade,rank:i+1,pool:poolName};
      }
    }
    idx+=cnt;
  });
}
function getCompGradeResult(empId,year){
  return (compGradeResults[empId]||{})[year]||null;
}
function adjustCompGrade(empId,year,newGrade,reason){
  const old=getCompGradeResult(empId,year);
  const oldGrade=old?.grade||"-";
  if(!compGradeResults[empId])compGradeResults[empId]={};
  compGradeResults[empId][year]={...(old||{}),grade:newGrade,adjustedBy:currentUser.id,adjustedByName:currentUser.name,adjustReason:reason,adjustedAt:new Date().toISOString()};
  gradeAdjustHistory.push({id:genId(),type:"comp",empId,year,dept:getEmp(empId)?.dept||"",oldGrade,newGrade,reason,adjustedBy:currentUser.id,adjustedByName:currentUser.name,adjustedAt:new Date().toISOString()});
}
function adjustKpiGrade(empId,year,newGrade,reason){
  const emp=getEmp(empId);if(!emp)return;
  const oldGrade=(emp.gradeResults||{})[str(year)]?.grade||"-";
  employees=employees.map(e=>{if(e.id!==empId)return e;const gr={...(e.gradeResults||{})};gr[String(year)]={...(gr[String(year)]||{}),grade:newGrade,adjustedBy:currentUser.id,adjustReason:reason,adjustedAt:new Date().toISOString()};return{...e,gradeResults:gr};});
  if(currentUser.id===empId){const upd=employees.find(e=>e.id===empId);if(upd)currentUser=upd;}
  gradeAdjustHistory.push({id:genId(),type:"kpi",empId,year,dept:emp.dept||"",oldGrade,newGrade,reason,adjustedBy:currentUser.id,adjustedByName:currentUser.name,adjustedAt:new Date().toISOString()});
}

function moveCompItem(type,i,dir){

}
function addCompItemStaged(type){
  if(type==="comp"){if(!_compItemsStage)_compItemsStage=JSON.parse(JSON.stringify(COMP_FORM_ITEMS));_compItemsStage.push({id:"c"+Date.now(),cat:"업무역량",title:"",q:""});}
  else{if(!_compItemsLsStage)_compItemsLsStage=JSON.parse(JSON.stringify(LS_FORM_ITEMS));_compItemsLsStage.push({id:"ls"+Date.now(),q:""});}
  renderCompEvalSettings();showCompItemTab(type);

function saveCompItems(){
  if(!_compItemsStage||!_compItemsLsStage){showToast("수정된 내용이 없습니다.","info");return;}
  const emptyComp=_compItemsStage.filter(i=>!i.q.trim());
  const emptyLs=_compItemsLsStage.filter(i=>!i.q.trim());
  if(emptyComp.length||emptyLs.length){showToast(`빈 문항이 ${emptyComp.length+emptyLs.length}개 있습니다. 모두 입력하거나 삭제하세요.`,"error");return;}
  // Apply
  COMP_FORM_ITEMS.length=0;_compItemsStage.forEach(i=>COMP_FORM_ITEMS.push({...i}));
  LS_FORM_ITEMS.length=0;_compItemsLsStage.forEach(i=>LS_FORM_ITEMS.push({...i}));
  _compItemsStage=null;_compItemsLsStage=null;
  showToast(`역량평가 ${COMP_FORM_ITEMS.length}개, 리더십평가 ${LS_FORM_ITEMS.length}개 항목이 저장되었습니다.`,"success");
  broadcastSettingsChange("역량평가 항목 수정");
  renderCompEvalSettings();
}
function showCompItemTab(t){
  document.getElementById("comp-items-comp").style.display=t==="comp"?"block":"none";
  document.getElementById("comp-items-ls").style.display=t==="ls"?"block":"none";
  [...document.getElementById("comp-item-tabs").querySelectorAll(".tab-btn")].forEach((b,i)=>b.classList.toggle("active",i===(t==="comp"?0:1)));
}

function renderCompGradeRatioCompare(){
  const year=settings.compEvalYear||settings.evalYear;
  const allEmps=employees.filter(e=>e.active&&e.role!=="admin");
  function buildTable(pool,ratios,scopeEmps,label){
    const total=scopeEmps.length;const gc={};ratios.forEach(r=>{gc[r.grade]=0;});
    scopeEmps.forEach(e=>{const cg=getCompGradeResult(e.id,year);if(cg?.grade&&gc[cg.grade]!==undefined)gc[cg.grade]++;});
    return`<div class="sec-title mt3">${label}</div><div class="tbl-wrap"><table style="font-size:12px"><thead><tr style="background:#f1f5f9"><th>등급</th><th>목표비율</th><th>목표인원</th><th>현재배분</th><th>차이</th></tr></thead><tbody>
    ${ratios.map(r=>{const tgt=Math.max(0,Math.round(r.pct/100*total));const act=gc[r.grade]||0;const diff=act-tgt;return`<tr style="${Math.abs(diff)>0?"background:#fff7ed":""}"><td><span class="grade-badge-large grade-${r.grade}" style="width:24px;height:24px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%">${r.grade}</span></td><td class="tc">${r.pct}%</td><td class="tc fw7">${tgt}명</td><td class="tc fw7 text-blue">${act}명</td><td class="tc fw7" style="color:${diff>0?"#dc2626":diff<0?"#d97706":"#16a34a"}">${diff>0?"+"+diff:diff||"✓"}</td></tr>`;}).join("")}
    <tr style="background:#f8fafc"><td colspan="2" class="fw7">합계</td><td class="tc fw7">${total}명</td><td class="tc fw7 text-blue">${Object.values(gc).reduce((a,b)=>a+b,0)}명</td><td></td></tr>
    </tbody></table></div>`;
  }
  showModal(`<div class="modal modal-lg"><div class="modal-head"><h2>역량평가 등급 비율 비교 (${year}년)</h2><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="card" style="margin-bottom:10px"><div class="card-head"><h3>전사</h3></div><div class="card-body"><div class="g2">
      ${buildTable("member",companyWideRatios.comp.member,allEmps.filter(e=>e.role==="member"),"팀원 풀")}
      ${buildTable("leader",companyWideRatios.comp.leader,allEmps.filter(e=>e.role==="leader"),"팀장 풀")}
    </div></div></div>
    ${orgDB.depts.map(d=>{const de=allEmps.filter(e=>e.dept===d);const gs=getCompGradeSettings(d);return`<div class="card" style="margin-bottom:10px"><div class="card-head"><h3>${h(d)}</h3></div><div class="card-body"><div class="g2">${buildTable("member",gs.member,de.filter(e=>e.role==="member"),"팀원")}${buildTable("leader",gs.leader,de.filter(e=>e.role==="leader"),"팀장")}</div></div></div>`;}).join("")}
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">닫기</button></div></div>`);
}


function enforceCompanyWideCap(dept,pool){
  const gs=getCompGradeSettings(dept);
  const cwRatios=companyWideRatios.comp[pool];
  const allEmps=employees.filter(e=>e.active&&e.role!=="admin");
  const deptEmps=allEmps.filter(e=>e.dept===dept&&e.role===pool);
  const allPoolEmps=allEmps.filter(e=>e.role===pool);
  if(!allPoolEmps.length)return;
  gs[pool].forEach((r,i)=>{
    const cwRatio=cwRatios.find(c=>c.grade===r.grade);
    if(!cwRatio)return;
    const cwMax=cwRatio.pct;
    // calc how many this dept can have of this grade given company-wide cap
    const cwMaxTotal=Math.round(cwMax/100*allPoolEmps.length);
    const otherDeptCount=allEmps.filter(e=>e.dept!==dept&&e.role===pool).reduce((cnt,e)=>{const cg=getCompGradeResult(e.id,settings.compEvalYear||settings.evalYear);return cnt+(cg?.grade===r.grade?1:0);},0);
    const remaining=cwMaxTotal-otherDeptCount;
    const maxPct=Math.round(remaining/deptEmps.length*100);
    if(r.pct>maxPct){gs[pool][i].pct=maxPct;}
  });
}

function render9Block(results,yr){
  // 9-Block: 
  //   컬럼(X축) = 역량: 왼쪽이 낮음 → 오른쪽이 높음 (col 0=낮음, 1=보통, 2=높음)
  //   행(Y축)   = 성과: 위가 높음 → 아래가 낮음   (row 0=높음, 1=보통, 2=낮음)
  //   우측 상단 = 최고 (성과高/역량高), 좌측 하단 = 인력효율화
  const tierMap={S:1,E:1,A:1,B:2,C:3,D:3};

  // grid[perf_tier-1][comp_tier-1]  (perf 1=high, comp 1=high)
  let grid=Array.from({length:3},()=>Array.from({length:3},()=>[]));
  results.forEach(r=>{
    const pi=tierMap[r.latestKpi]||3;   // 1=높음 3=낮음
    const ci=tierMap[r.latestComp]||3;
    grid[pi-1][ci-1].push(r);
  });

  // Block definitions: [perf_tier][comp_tier] → displayed as row/col
  // Display col order: comp 낮음(2) → 보통(1) → 높음(0) → so reverse comp
  // Display row order: perf 높음(0) → 보통(1) → 낮음(2)
  const blockLabels=[
    // perf_tier=1(높음)  comp: 낮음, 보통, 높음 → display reversed
    ["성과高/역량低","성과高/역량中","우수인재(핵심)"],
    ["성과中/역량低","유지발전","성과中/역량高"],
    ["인력효율화","성과低/역량中","역량형"],
  ];
  const blockColors=[
    ["#fef9c3","#d1fae5","#16a34a"],  // perf high: 낮음=yellow, 보통=green, 높음=dark green
    ["#fef3c7","#f1f5f9","#cffafe"],
    ["#fee2e2","#fef2f2","#fce7f3"],
  ];
  const borderColors=[
    ["#e2e8f0","#bbf7d0","#166534"],
    ["#e2e8f0","#e2e8f0","#a5f3fc"],
    ["#fecaca","#e2e8f0","#e2e8f0"],
  ];
  const textColors=[
    ["#374151","#374151","#fff"],
    ["#374151","#374151","#0e7490"],
    ["#dc2626","#374151","#374151"],
  ];

  const topBlocks=coreTalentSettings.topBlocks;
  const isTopBlock=(pi,ci_orig)=>topBlocks.some(b=>(tierMap[b.kpiRank]||1)===pi&&(tierMap[b.compRank]||1)===ci_orig);

  // Column headers: comp 낮음→보통→높음 (left to right in display = comp tier 3,2,1)
  const compColOrder=[2,1,0]; // display index → comp_tier index (0-based)
  const compHeaders=["역량 낮음<br><span style='font-size:9px;color:#94a3b8'>(C/D)</span>",
    "역량 보통<br><span style='font-size:9px;color:#94a3b8'>(B)</span>",
    "역량 높음<br><span style='font-size:9px;color:#94a3b8'>(S/A/E)</span>"];
  const perfRowLabels=["성과 높음<br><span style='font-size:9px;color:#94a3b8'>(S/A/E)</span>",
    "성과 보통<br><span style='font-size:9px;color:#94a3b8'>(B)</span>",
    "성과 낮음<br><span style='font-size:9px;color:#94a3b8'>(C/D)</span>"];

  // Mapping for display: compColOrder maps display-col → actual comp index
  // display-col 0=역량낮음 = comp_tier 3 = index 2
  // display-col 1=역량보통 = comp_tier 2 = index 1
  // display-col 2=역량높음 = comp_tier 1 = index 0
  // So compColOrder = [2,1,0]

  // Total for summary
  const total=results.length;

  return`
  <div style="overflow-x:auto">
  <div style="display:grid;grid-template-columns:60px repeat(3,1fr);gap:4px;font-size:11px;min-width:500px">
    <!-- Header row -->
    <div style="display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px">
      <span class="fz10 text-gray fw7">성과↑<br>역량→</span>
    </div>
    ${compHeaders.map(l=>`<div style="text-align:center;padding:6px 4px;font-weight:700;color:#374151;background:#f1f5f9;border-radius:6px;font-size:10px">${l}</div>`).join("")}

    <!-- Data rows: perf 높음 → 보통 → 낮음 -->
    ${[0,1,2].map(pi=>`
      <!-- Row label: vertical text fixed (no rotation) -->
      <div style="display:flex;align-items:center;justify-content:center;font-weight:700;color:#374151;background:#f1f5f9;border-radius:6px;padding:4px 2px;text-align:center;font-size:10px">
        ${perfRowLabels[pi]}
      </div>
      <!-- Cells: display col order = comp 낮음, 보통, 높음 -->
      ${compColOrder.map((ci_idx, display_col)=>{
        const emps=grid[pi][ci_idx];
        // comp_tier_orig for top-block check: ci_idx+1
        const isTop=isTopBlock(pi+1, ci_idx+1);
        const bg=blockColors[pi][display_col];
        const border=isTop?"2px solid #1d4ed8":("1px solid "+borderColors[pi][display_col]);
        const tc=textColors[pi][display_col];
        const lbl=blockLabels[pi][display_col];
        // Special labels for corners
        const isTopRight=(pi===0&&display_col===2);
        const isBotLeft=(pi===2&&display_col===0);
        const badge_=isTopRight?`<div style="position:absolute;top:4px;right:4px;font-size:8px;background:#166534;color:white;padding:1px 4px;border-radius:3px">최고</div>`:
          isBotLeft?`<div style="position:absolute;top:4px;right:4px;font-size:8px;background:#dc2626;color:white;padding:1px 4px;border-radius:3px">효율화</div>`:
          isTop?`<div style="position:absolute;top:4px;right:4px;font-size:8px;background:#1d4ed8;color:white;padding:1px 4px;border-radius:3px">TOP</div>`:"";
        return`<div style="background:${bg};border:${border};border-radius:6px;padding:6px;min-height:80px;position:relative">
          ${badge_}
          <div style="font-size:9px;font-weight:700;color:${tc};margin-bottom:4px;line-height:1.3">${lbl}<br><span style="font-weight:400;opacity:.8">(${emps.length}명)</span></div>
          <div style="display:flex;flex-wrap:wrap;gap:2px">${emps.slice(0,6).map(r=>`<span style="font-size:8px;background:rgba(255,255,255,.75);color:#1e293b;padding:1px 4px;border-radius:3px">${h(r.name)}</span>`).join("")}${emps.length>6?`<span style="font-size:8px;color:#64748b;padding:2px">+${emps.length-6}</span>`:""}</div>
        </div>`;
      }).join("")}
    `).join("")}
  </div>
  </div>`;
}

function saveCtSettings(){
  const cs=coreTalentSettings;
  cs.evalYear=Number(document.getElementById("ct-yr")?.value)||cs.evalYear;
  cs.kpiYearRange=Number(document.getElementById("ct-k-yr")?.value)||3;
  cs.kpiCountRequired=Number(document.getElementById("ct-k-cnt")?.value)||2;
  cs.kpiEligibleGrades=(document.getElementById("ct-k-gr")?.value||"S,A,E").split(",").map(g=>g.trim().toUpperCase()).filter(Boolean);
  cs.compYearRange=Number(document.getElementById("ct-c-yr")?.value)||3;
  cs.compCountRequired=Number(document.getElementById("ct-c-cnt")?.value)||2;
  cs.compEligibleGrades=(document.getElementById("ct-c-gr")?.value||"S,A,E").split(",").map(g=>g.trim().toUpperCase()).filter(Boolean);
  // Top blocks
  cs.topBlocks=Array.from({length:document.querySelectorAll("[id^='ctb-kpi-']").length},(_,i)=>({
    kpiRank:document.getElementById("ctb-kpi-"+i)?.value||"S",
    compRank:document.getElementById("ctb-comp-"+i)?.value||"S",
  }));
  // Additional criteria
  const acItems=document.querySelectorAll("[id^='cac-name-']");
  const newCriteria=[];
  acItems.forEach((_,ci)=>{
    const n=document.getElementById("cac-name-"+ci)?.value.trim();
    const d=document.getElementById("cac-desc-"+ci)?.value.trim()||"";
    const r=document.getElementById("cac-req-"+ci)?.value==="1";
    if(n) newCriteria.push({id:"ac"+Date.now()+ci,name:n,description:d,type:"manual",required:r});
  });
  cs.additionalCriteria=newCriteria;
  // Plan period
  cs.planStage=document.getElementById("ct-plan-open")?.checked?"open":"closed";
  cs.planStart=document.getElementById("ct-plan-start")?.value||"";
  cs.planEnd=document.getElementById("ct-plan-end")?.value||"";
  // Achieve period
  cs.achieveStage=document.getElementById("ct-achieve-open")?.checked?"open":"closed";
  cs.achieveStart=document.getElementById("ct-achieve-start")?.value||"";
  cs.achieveEnd=document.getElementById("ct-achieve-end")?.value||"";
  closeModal();
  showToast("핵심인재 요건이 저장되었습니다.","success");
  renderCoreTalentPage();
}

  const score=Number(document.getElementById("ct-comp-score")?.value);
  if(isNaN(score)||score<0||score>100){showToast("0~100 사이의 점수를 입력하세요.","error");return;}
  const yr=coreTalentSettings.evalYear;
  const existing=coreTalentPool.find(p=>p.empId===empId&&p.year===yr);
  if(existing){
    existing.manualCompScore=score;
    existing.manualCompReason=document.getElementById("ct-comp-reason")?.value.trim()||"";
  } else {
    coreTalentPool.push({empId,year:yr,status:"candidate",manualCompScore:score,
      manualCompReason:document.getElementById("ct-comp-reason")?.value.trim()||""});
  }
  closeModal();showToast("역량 점수가 저장되었습니다.","success");
  autoSaveToServerIfEnabled();
  renderCoreTalentPage();
}

function doAddToPool(){
  const empId=Number(document.getElementById("ct-add-emp")?.value);
  const track=document.getElementById("ct-add-track")?.value;
  const reason=document.getElementById("ct-add-reason")?.value.trim()||"";
  if(!empId||!track){showToast("직원과 Track을 선택하세요.","error");return;}
  const yr=coreTalentSettings.evalYear;
  const existing=coreTalentPool.findIndex(p=>p.empId===empId&&p.year===yr);
  const entry={empId,year:yr,track,status:"candidate",reason,registeredAt:ts(),registeredBy:currentUser.name};
  if(existing>=0) coreTalentPool[existing]={...coreTalentPool[existing],...entry};
  else coreTalentPool.push(entry);
  // Record in employee hrHistory
  employees=employees.map(e=>{
    if(e.id!==empId)return e;
    const hist=Array.isArray(e.hrHistory)?[...e.hrHistory]:[];
    hist.push({id:genId(),type:"core_talent",date:ts().slice(0,10),desc:`${yr}년 핵심인재 Pool 등록 (${coreTalentSettings.tracks.find(t=>t.id===track)?.name||track})`,before:"",after:"Pool 등록",note:reason});
    return{...e,hrHistory:hist};
  });
  closeModal();showToast(`${getEmpName(empId)}님이 핵심인재 Pool에 등록되었습니다.`,"success");
  logAction("core_talent_pool","핵심인재 Pool 등록",`emp:${empId}`,`${yr}년 ${track}`);
  autoSaveToServerIfEnabled();
  renderCoreTalentPage();
}

function doSelectTalent(empId){
  const comment=document.getElementById("ct-sel-comment")?.value.trim();
  if(!comment){showToast("심의 의견을 입력하세요.","error");return;}
  const yr=coreTalentSettings.evalYear;
  const pe=coreTalentPool.find(p=>p.empId===empId&&p.year===yr);
  if(!pe){showToast("Pool 등록 정보가 없습니다.","error");return;}
  const score=document.getElementById("ct-sel-score")?.value;
  pe.status="selected";
  pe.recommendedBy=document.getElementById("ct-sel-recomm")?.value.trim()||"";
  pe.reviewScore=score?Number(score):null;
  pe.reviewComment=comment;

// ── 9-Block Excel Download ──────────────────────────────────────
function dl9BlockExcel(){
  const yr=coreTalentSettings.evalYear;
  const allEmps=employees.filter(e=>e.active&&e.role!=="admin");
  const results=allEmps.map(e=>calcCoreTalent(e,yr));
  const tierMap={S:1,E:1,A:1,B:2,C:3,D:3};

  // Build 3x3 grid [perf][comp] same as render9Block
  let grid=Array.from({length:3},()=>Array.from({length:3},()=>[]));
  results.forEach(r=>{
    const pi=(tierMap[r.latestKpi]||3)-1;
    const ci=(tierMap[r.latestComp]||3)-1;
    grid[pi][ci].push(r);
  });

  // Build CSV with 9-block layout
  const compColOrder=[2,1,0]; // 낮음→보통→높음
  const blockLabels=[
    ["성과高/역량低","성과高/역량中","우수인재(핵심)"],
    ["성과中/역량低","유지발전","성과中/역량高"],
    ["인력효율화","성과低/역량中","역량형"],
  ];
  const compHeaders=["역량 낮음(C/D)","역량 보통(B)","역량 높음(S/A/E)"];
  const perfHeaders=["성과 높음(S/A/E)","성과 보통(B)","성과 낮음(C/D)"];

  const rows=[
    [`${yr}년 핵심인재 9-Block Matrix`],
    [],
    ["","역량 낮음(C/D)","역량 보통(B)","역량 높음(S/A/E)"],
  ];

  [0,1,2].forEach(pi=>{
    // Block name row
    const nameRow=[perfHeaders[pi]];
    compColOrder.forEach(ci_idx=>{
      const di=compColOrder.indexOf(ci_idx);
      nameRow.push(`[${blockLabels[pi][di]}]`);
    });
    rows.push(nameRow);
    // Max employees across this row
    const maxEmp=Math.max(...compColOrder.map(ci_idx=>grid[pi][ci_idx].length),1);
    for(let ei=0;ei<maxEmp;ei++){
      const row=[""];
      compColOrder.forEach(ci_idx=>{
        const emps=grid[pi][ci_idx];
        const emp=emps[ei];
        row.push(emp?`${emp.name} (${emp.dept})`:"-");
      });
      rows.push(row);
    }
    rows.push([]);
  });

  dlCSV(`9Block_${yr}년.csv`,[],rows);
  showToast("9-Block 엑셀이 다운로드되었습니다.","success");
}

function dlCoreTalentList(){
  const yr=coreTalentSettings.evalYear;
  const cs=coreTalentSettings;
  const allEmps=employees.filter(e=>e.active&&e.role!=="admin");
  const results=allEmps.map(e=>calcCoreTalent(e,yr));

  // Build headers: base + KPI raw (N years) + Comp raw (N years)
  const kpiYrs=Array.from({length:cs.kpiYearRange},(_,i)=>yr-1-i);
  const compYrs=Array.from({length:cs.compYearRange},(_,i)=>yr-1-i);

  const headers=["이름","사번","부서","팀","직급","Track",
    // KPI raw data
    ...kpiYrs.map(y=>`KPI ${y}년 등급`),
    ...kpiYrs.map(y=>`KPI ${y}년 비고`),
    "KPI 요건 충족","KPI 해당 등급 횟수",
    // Comp raw data
    ...compYrs.map(y=>`역량 ${y}년 등급`),
    ...compYrs.map(y=>`역량 ${y}년 비고`),
    "역량 요건 충족","역량 해당 등급 횟수","역량 수동 점수",
    // 9-block
    "최근 KPI 등급","최근 역량 등급","9-Block 위치","1차 후보",
    // Pool
    "Pool 상태","선발 여부","등록 연도","Track명","심의 점수","심의 의견",
    "육성 계획","Pool Out 사유","Pool Out 상세",
  ];

  const rows=[
    [`${yr}년 핵심인재 현황 (Raw Data)`],[],
    headers
  ];

  results.forEach(r=>{
    const pe=r.poolEntry;
    const emp=getEmp(r.empId);
    const track=cs.tracks.find(t=>t.id===pe?.track);

    // KPI raw
    const kpiGrades=r.kpiHistory.map(g=>g.grade||"-");
    const kpiNotes=r.kpiHistory.map(g=>g.estimated?"(평균추정)":g.grade?"":" 미평가");

    // Comp raw
    const compGrades=r.compHistory.map(g=>g.grade||"-");
    const compNotes=r.compHistory.map(g=>g.manual?"[수동입력]":g.estimated?"(평균추정)":g.grade?"":" 미평가");

    const poolStatus=r.isOut?"Pool Out":r.isSelected?"선발 확정":r.inPool?"Pool 등록":"미등록";
    const blockPos=`성과:${r.latestKpi}/역량:${r.latestComp}`;

    rows.push([
      r.name, emp?.empNo||"", r.dept, r.team, r.rank, track?.name||"-",
      ...kpiGrades, ...kpiNotes,
      r.kpiCheck.ok?"충족":"미충족", r.kpiCheck.count,
      ...compGrades, ...compNotes,
      r.compCheck.ok?"충족":"미충족", r.compCheck.count, pe?.manualCompScore||"",
      r.latestKpi, r.latestComp, blockPos, r.isCandidate?"해당":"미해당",
      poolStatus, r.isSelected?"Y":"N", pe?.year||"", track?.name||"",
      pe?.reviewScore||"", pe?.reviewComment||"",
      pe?.devPlan||"", pe?.outReason||"", pe?.outDetail||"",
    ]);
  });
  dlCSV(`핵심인재현황_${yr}년_RawData.csv`,[],rows);
  showToast("핵심인재 목록(Raw Data)이 다운로드되었습니다.","success");
}

function savePromoSettings(){
  const ps=promotionSettings;
  // Rank name editing
  const oldRanks=[...orgDB.ranks];
  orgDB.ranks.forEach((rank,ri)=>{
    const newName=document.getElementById("rank-name-"+ri)?.value.trim();
    if(newName&&newName!==rank){
      // Update all employees with old rank
      employees=employees.map(e=>e.rank===rank?{...e,rank:newName}:e);
      // Update minYearsByRank key
      if(ps.minYearsByRank[rank]!==undefined){
        ps.minYearsByRank[newName]=ps.minYearsByRank[rank];
        delete ps.minYearsByRank[rank];
      }
      // Update excludeRanks
      const ei=ps.excludeRanks.indexOf(rank);
      if(ei>=0) ps.excludeRanks[ei]=newName;
      orgDB.ranks[ri]=newName;
    }
  });
  // Cond1: min years by rank
  orgDB.ranks.filter(r=>!ps.excludeRanks.includes(r)).forEach(rank=>{
    const v=document.getElementById("promo-min-"+rank)?.value;
    if(v!==undefined&&v!=="") ps.minYearsByRank[rank]=Number(v);
  });
  // Cond2: grade settings
  const yr=Number(document.getElementById("promo-year-range")?.value)||3;
  const cnt=Number(document.getElementById("promo-count-req")?.value)||2;
  const grades=(document.getElementById("promo-grades")?.value||"S,A,E").split(",").map(g=>g.trim().toUpperCase()).filter(Boolean);
  ps.gradeYearRange=yr; ps.gradeCountRequired=cnt; ps.eligibleGrades=grades;
  // Cond3: legal edu
  ps.legalEduRequired=document.getElementById("promo-edu-req")?.checked;
  const field=document.getElementById("promo-edu-field")?.value.trim();
  if(field) ps.legalEduField=field;
  // Eval year
  ps.evalYear=Number(document.getElementById("promo-eval-year")?.value)||2026;
  // Exclude ranks
  ps.excludeRanks=[...document.querySelectorAll(".promo-excl:checked")].map(c=>c.value);
  // Custom conditions
  ps.customConditions.forEach((cond,ci)=>{
    const n=document.getElementById("cc-name-"+ci)?.value.trim();
    const t=document.getElementById("cc-type-"+ci)?.value;
    const f=document.getElementById("cc-field-"+ci)?.value.trim();
    const d=document.getElementById("cc-desc-"+ci)?.value.trim();
    const r=document.getElementById("cc-req-"+ci)?.value==="1";
    if(n){cond.name=n;cond.type=t||cond.type;cond.fieldKey=f||cond.fieldKey;cond.description=d||"";cond.required=r;}
  });
  closeModal();
  showToast("승진 요건이 저장되었습니다.","success");
  renderPromotionPage();
}

function doPromotion(empId, nextRank){

    const hist=Array.isArray(e.hrHistory)?[...e.hrHistory]:[];

function doBulkPromotion(){
  const date=document.getElementById("bulk-promo-date")?.value||new Date().toISOString().slice(0,10);
  const yr=promotionSettings.evalYear;
  const eligible=employees
    .filter(e=>e.active&&e.role!=="admin"&&!promotionSettings.excludeRanks.includes(e.rank))
    .map(e=>({emp:e,result:calcPromotion(e,yr)}))
    .filter(({result})=>result.eligible);
  let cnt=0;
  eligible.forEach(({emp,result})=>{
    const oldRank=emp.rank; const nextRank=result.nextRank;
    if(!nextRank||nextRank==="(최고 직급)") return;
    employees=employees.map(e=>{
      if(e.id!==emp.id) return e;
      const hist=Array.isArray(e.hrHistory)?[...e.hrHistory]:[];
      hist.push({id:genId(),type:"promotion",date,desc:"승진 처리 (일괄)",before:oldRank,after:nextRank,note:"일괄 승진 처리"});
      return{...e,rank:nextRank,rankYear:0,hrHistory:hist};
    });
    logAction("promotion","일괄 승진",`emp:${emp.id}`,`${oldRank} → ${nextRank}`);
    cnt++;
  });
  closeModal();
  showToast(`${cnt}명 일괄 승진 처리 완료`,"success");
  autoSaveToServerIfEnabled();
  renderPromotionPage();
}
