// ==================== AUTO GRADE AFTER 2ND EVAL ====================
function tryAutoGradeAfterSecond(dept, year){
  // Check if all 2nd evals in this dept are complete
  const deptEmps=employees.filter(e=>e.active&&e.dept===dept&&(e.role==="member"||e.role==="leader"));
  if(!deptEmps.length) return;
  
  ["member","leader"].forEach(pool=>{
    const poolEmps=deptEmps.filter(e=>e.role===pool);
    if(!poolEmps.length) return;
    
    // Check all have 2nd score
    const allScored=poolEmps.every(emp=>{
      const kpis=kpiEntries.filter(k=>k.userId===emp.id&&k.year===year&&k.goalSub&&k.firstStatus==="approved");
      if(!kpis.length) return false;
      return kpis.every(k=>k.secondScore!=null);
    });
    if(!allScored) return;
    
    // Calculate weighted average score for each employee
    const scored=poolEmps.map(emp=>{
      const kpis=kpiEntries.filter(k=>k.userId===emp.id&&k.year===year&&k.goalSub&&k.firstStatus==="approved"&&k.secondScore!=null);
      if(!kpis.length) return{emp,score:0};
      const totalWt=kpis.reduce((s,k)=>s+k.weight,0)||100;
      const wtScore=kpis.reduce((s,k)=>s+(k.secondScore*k.weight/totalWt),0);
      return{emp,score:Math.round(wtScore*10)/10};
    }).sort((a,b)=>b.score-a.score);
    
    // Assign grades by ratio
    const gs=getGradeSettings(dept);
    const ratios=gs[pool]||[];
    const total=scored.length;
    let idx=0;
    ratios.forEach((ratio,ri)=>{
      const cnt=ri===ratios.length-1?(total-idx):Math.max(0,Math.round(ratio.pct/100*total));
      const assign=Math.min(cnt,total-idx);
      for(let i=idx;i<idx+assign;i++){
        const emp=scored[i].emp;
        if(!(emp.gradeResults||{})[String(year)]?.manualOverride){
          employees=employees.map(e=>{
            if(e.id!==emp.id) return e;
            const gr={...(e.gradeResults||{})};
            gr[String(year)]={grade:ratio.grade,score:scored[i].score,computedAt:new Date().toISOString(),autoAssigned:true};
            return{...e,gradeResults:gr};
          });
        }
      }
      idx+=assign;
    });
    showToast(`${dept} ${pool==="member"?"팀원":"팀장"} KPI 등급이 자동 배부되었습니다.`,"success");
  });
}

// Manual grade override with ratio check
function openKpiGradeOverrideModal(empId, year){
  const u=currentUser;
  if(u.role!=="admin"&&u.role!=="director"){showToast("사업부장 또는 관리자만 수정 가능합니다.","error");return;}
  const emp=getEmp(empId);if(!emp)return;
  const current=(emp.gradeResults||{})[String(year)]?.grade||"-";
  const dept=emp.dept;
  const pool=emp.role;
  const gs=getGradeSettings(dept);
  const ratios=gs[pool]||[];
  
  // Count current grade allocations
  const deptPoolEmps=employees.filter(e=>e.active&&e.dept===dept&&e.role===pool);
  const total=deptPoolEmps.length;
  const gradeCounts={};
  ratios.forEach(r=>{gradeCounts[r.grade]=deptPoolEmps.filter(e=>(e.gradeResults||{})[String(year)]?.grade===r.grade).length;});
  
  const gradeOptions=ratios.map(r=>{
    const max=Math.max(0,Math.round(r.pct/100*total));
    const curr=gradeCounts[r.grade]||0;
    const available=max-curr+(current===r.grade?1:0);
    const canSelect=available>0;
    return`<option value="${r.grade}" ${current===r.grade?"selected":""} ${!canSelect?"disabled":""}>
      ${r.grade}등급 (배정: ${curr}/${max}명${!canSelect?" - 초과":""})</option>`;
  }).join("");
  
  showModal(`<div class="modal modal-sm"><div class="modal-head"><h2>KPI 등급 수정 — ${h(emp.name)}</h2><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div style="padding:10px;background:#f8fafc;border-radius:8px;font-size:12px;margin-bottom:14px">
      <div class="fw7">${h(emp.name)} · ${h(emp.dept)} / ${h(emp.team)}</div>
      <div class="text-gray mt2">${year}년 현재 등급: <strong>${current}</strong></div>
    </div>
    <div class="info-note mb3 fz11">📊 등급별 배정 가능 인원을 초과할 수 없습니다.</div>
    <div class="fg"><label class="fl">변경할 등급</label>
      <select class="fc" id="grade-override-sel">${gradeOptions}</select>
    </div>
    <div class="fg"><label class="fl">수정 사유 <span class="req">*</span></label>
      <textarea class="fc" id="grade-override-reason" rows="2" placeholder="등급 수정 사유를 입력하세요"></textarea>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-secondary" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" onclick="saveKpiGradeOverride(${empId},${year})">저장</button>
  </div></div>`);
}

function saveKpiGradeOverride(empId, year){
  const newGrade=document.getElementById("grade-override-sel")?.value;
  const reason=document.getElementById("grade-override-reason")?.value.trim();
  if(!newGrade){showToast("등급을 선택하세요.","error");return;}
  if(!reason){showToast("수정 사유를 입력하세요.","error");return;}
  
  const emp=getEmp(empId);if(!emp)return;
  const oldGrade=(emp.gradeResults||{})[String(year)]?.grade||"-";
  
  // Ratio check
  const dept=emp.dept;const pool=emp.role;
  const gs=getGradeSettings(dept);
  const ratio=gs[pool]?.find(r=>r.grade===newGrade);
  if(ratio){
    const deptPoolEmps=employees.filter(e=>e.active&&e.dept===dept&&e.role===pool&&e.id!==empId);
    const currCount=deptPoolEmps.filter(e=>(e.gradeResults||{})[String(year)]?.grade===newGrade).length;
    const maxCount=Math.max(0,Math.round(ratio.pct/100*(deptPoolEmps.length+1)));
    if(currCount>=maxCount){showToast(`${newGrade}등급 배정 가능 인원(${maxCount}명)을 초과합니다.`,"error");return;}
  }
  
  employees=employees.map(e=>{
    if(e.id!==empId)return e;
    const gr={...(e.gradeResults||{})};
    gr[String(year)]={...(gr[String(year)]||{}),grade:newGrade,manualOverride:true,
      overrideBy:currentUser.name,overrideReason:reason,overrideAt:new Date().toISOString()};
    return{...e,gradeResults:gr};
  });
  gradeAdjustHistory.push({id:genId(),type:"kpi",empId,year,dept:emp.dept,
    oldGrade,newGrade,reason,adjustedBy:currentUser.id,adjustedByName:currentUser.name,
    adjustedAt:new Date().toISOString()});
  closeModal();
  showToast(`${emp.name}님의 ${year}년 KPI 등급이 ${newGrade}로 수정되었습니다.`,"success");
  autoSaveToServerIfEnabled();
  renderGradeView();
}

let _tdTab = "plan"; // "plan" | "achieve" | "approve" | "edit-request"

function renderTalentDevPage(){
  const c=$("#content"); if(!c) return;
  const u=currentUser;
  const yr=coreTalentSettings.evalYear;
  const isAdmin=u.role==="admin";
  const isDirector=u.role==="director";
  const isLeader=u.role==="leader";

  // Check if this user is a selected talent
  const myPool=coreTalentPool.find(p=>p.empId===u.id&&p.year===yr&&p.status==="selected");
  const isSelectedTalent=!!myPool;

  // Scope for approval: leader sees own team's plans, director sees dept
  const planOpen=isTalentPlanOpen();
  const achOpen=isTalentAchieveOpen();

  // Pending approvals count
  const pendingLeader=isLeader?talentDevPlans.filter(p=>{
    const emp=getEmp(p.empId);
    return p.status==="submitted"&&emp?.dept===u.dept&&emp?.team===u.team;
  }).length:0;
  const pendingDirector=isDirector?talentDevPlans.filter(p=>{
    const emp=getEmp(p.empId);
    return p.status==="leader_approved"&&emp?.dept===u.dept;
  }).length:0;
  const pendingAdmin=isAdmin?talentDevPlans.filter(p=>p.status==="leader_approved"||p.status==="submitted").length:0;
  const pendingEditReq=(isAdmin||isDirector||isLeader)?talentDevPlans.reduce((s,p)=>s+(p.editRequests||[]).filter(r=>r.status==="pending").length,0):0;

  const tabs=[
    ...(isSelectedTalent||isAdmin?[
      {id:"plan",label:`육성 계획서 ${planOpen?badge("작성 기간","green"):badge("마감","gray")}`},
      {id:"achieve",label:`육성 실적 ${achOpen?badge("작성 기간","green"):badge("마감","gray")}`},
    ]:[]),
    ...(isLeader&&pendingLeader>0||isDirector&&pendingDirector>0||isAdmin&&pendingAdmin>0?
      [{id:"approve",label:`승인 관리 (${pendingLeader||pendingDirector||pendingAdmin})`}]:[]),
    ...(isAdmin?[{id:"approve",label:`승인 관리 (${pendingAdmin})`}]:[]),
    ...(isAdmin&&pendingEditReq>0?[{id:"edit-request",label:`수정 요청 (${pendingEditReq})`}]:[]),
  ].filter((t,i,a)=>a.findIndex(x=>x.id===t.id)===i); // deduplicate

  if(!tabs.length){c.innerHTML=`<div class="card"><div class="p-empty">접근 권한이 없거나 핵심인재로 선발되지 않았습니다.</div></div>`;return;}
  if(!tabs.find(t=>t.id===_tdTab)) _tdTab=tabs[0].id;

  c.innerHTML=`
  <div class="tabs mb3">${tabs.map(t=>`<button class="tab-btn${_tdTab===t.id?" active":""}" onclick="_tdTab='${t.id}';renderTalentDevPage()">${t.label}</button>`).join("")}</div>
  <div id="td-content"></div>`;

  const el=document.getElementById("td-content");

  if(_tdTab==="plan") renderTdFormList(el, u, yr, "plan", planOpen);
  else if(_tdTab==="achieve") renderTdFormList(el, u, yr, "achieve", achOpen);
  else if(_tdTab==="approve") renderTdApproveList(el, u, yr);
  else if(_tdTab==="edit-request") renderTdEditRequestList(el, u);
}

function collectTdFormData(type){
  const data={};
  if(type==="plan"){
    data.education=document.getElementById("tdp-edu")?.value.trim()||"";
    data.memo=document.getElementById("tdp-memo")?.value.trim()||"";
    [0,1,2].forEach(i=>{
      ["job","period"].forEach(f=>{ const v=document.getElementById(`tdp-career-${i}-${f}`)?.value.trim(); if(v)data[`career_${i}_${f}`]=v; });
      ["name","period"].forEach(f=>{ const v=document.getElementById(`tdp-task-${i}-${f}`)?.value.trim(); if(v)data[`task_${i}_${f}`]=v; });
      ["name","period"].forEach(f=>{ const v=document.getElementById(`tdp-edu-${i}-${f}`)?.value.trim(); if(v)data[`edu_${i}_${f}`]=v; });
    });
    [0,1].forEach(i=>{ ["dept","period"].forEach(f=>{ const v=document.getElementById(`tdp-exp-${i}-${f}`)?.value.trim(); if(v)data[`exp_${i}_${f}`]=v; }); });
  } else {
    data.memo=document.getElementById("tda-memo")?.value.trim()||"";
    [0,1,2].forEach(i=>{
      ["period","result","rate"].forEach(f=>{ const v=document.getElementById(`tda-task-${i}-${f}`)?.value.trim(); if(v)data[`task_${i}_${f}`]=v; });
      ["period","result","rate"].forEach(f=>{ const v=document.getElementById(`tda-edu-${i}-${f}`)?.value.trim(); if(v)data[`edu_${i}_${f}`]=v; });
    });
  }
  return data;
}

function saveTdDraft(empId, yr, type, planId, closeAfter=false){
  const data=collectTdFormData(type);
  const now=ts();
  if(planId){
    talentDevPlans=talentDevPlans.map(p=>p.id===planId?{...p,data,updatedAt:now}:p);
  } else {
    const newPlan={id:genId(),empId,year:yr,type,status:"draft",data,
      editRequests:[],createdAt:now,updatedAt:now};
    talentDevPlans.push(newPlan);
    planId=newPlan.id;
  }
  // Reset edit approval after save
  const plan=talentDevPlans.find(p=>p.id===planId);
  if(plan) plan.editRequests=(plan.editRequests||[]).map(r=>r.status==="approved"?{...r,status:"used"}:r);
  showToast("저장되었습니다.","success");
  autoSaveToServerIfEnabled();
  if(closeAfter){ closeModal(); renderTalentDevPage(); }
}

function submitTdPlan(planId){
  const plan=talentDevPlans.find(p=>p.id===planId);
  if(!plan){showToast("계획서를 먼저 저장하세요.","error");return;}
  plan.status="submitted";
  plan.submittedAt=ts();
  showToast("제출되었습니다. 팀장 승인 대기 중입니다.","success");
  autoSaveToServerIfEnabled();

function approveTdPlan(planId){
  const plan=talentDevPlans.find(p=>p.id===planId);if(!plan)return;
  const u=currentUser;
  if(u.role==="leader"||u.role==="admin"&&plan.status==="submitted"){
    showModal(`<div class="modal modal-sm"><div class="modal-head"><h2>1차 승인</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="fg"><label class="fl">승인 의견 (선택)</label><textarea class="fc" id="approve-comment" rows="2" placeholder="의견을 입력하세요"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-success" onclick="doApproveTd(${planId},'leader')">1차 승인</button>
    </div></div>`);
  } else if(u.role==="director"||u.role==="admin"&&plan.status==="leader_approved"){
    showModal(`<div class="modal modal-sm"><div class="modal-head"><h2>2차 승인 (사업부장)</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="fg"><label class="fl">사업부장 Comment <span class="req">*</span></label>
        <textarea class="fc" id="approve-comment" rows="3" placeholder="사업부장 코멘트를 입력하세요" required></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-success" onclick="doApproveTd(${planId},'director')">최종 승인</button>
    </div></div>`);
  }
}

function doApproveTd(planId, level){
  const comment=document.getElementById("approve-comment")?.value.trim()||"";
  if(level==="director"&&!comment){showToast("사업부장 Comment를 입력하세요.","error");return;}
  const plan=talentDevPlans.find(p=>p.id===planId);if(!plan)return;
  if(level==="leader"){
    plan.status="leader_approved";
    plan.leaderComment=comment;
    plan.leaderApprovedAt=ts();
    plan.leaderApprovedBy=currentUser.name;
  } else {
    plan.status="director_approved";
    plan.directorComment=comment;
    plan.directorApprovedAt=ts();
    plan.directorApprovedBy=currentUser.name;
  }
  closeModal();
  showToast(`${level==="leader"?"1차":"최종"} 승인이 완료되었습니다.`,"success");
  autoSaveToServerIfEnabled();
  renderTalentDevPage();
}

let gradeViewFilter={year:0,dept:"",role:""};
function renderGradeView(){
  if(!gradeViewFilter.year)gradeViewFilter.year=settings.evalYear;
  const u=currentUser;
  const yrs=Array.from({length:10},(_,i)=>2020+i).filter(y=>kpiEntries.some(k=>k.finalConfirmed&&k.year===y));
  if(!yrs.includes(settings.evalYear))yrs.unshift(settings.evalYear);
  const allYrs=[...new Set([...yrs,gradeViewFilter.year])].sort((a,b)=>b-a);
  let emps=[];
  if(u.role==="leader")emps=employees.filter(e=>e.active&&e.role==="member"&&e.dept===u.dept&&e.team===u.team);
  else if(u.role==="director")emps=employees.filter(e=>e.active&&e.dept===u.dept&&(e.role==="member"||e.role==="leader")&&e.id!==u.id);
  else emps=employees.filter(e=>e.active&&e.role!=="admin");
  if(gradeViewFilter.dept)emps=emps.filter(e=>e.dept===gradeViewFilter.dept);
  if(gradeViewFilter.role)emps=emps.filter(e=>e.role===gradeViewFilter.role);
  const yr=gradeViewFilter.year;
  const rows=emps.map(e=>{
    const kpis=kpiEntries.filter(k=>k.userId===e.id&&k.year===yr&&k.finalConfirmed);
    const weighted=kpis.length?calcWeighted(kpis):null;
    const grade=weighted!=null?getGrade(weighted):"-";

    return{e,kpis,weighted,grade,grRes};

  const c=$("#content");
  c.innerHTML=`<div class="card"><div class="card-body">
    <div class="filter-bar">
      <select class="fc" style="width:120px" onchange="gradeViewFilter.year=Number(this.value);renderGradeView()">${allYrs.map(y=>`<option value="${y}"${yr===y?" selected":""}>${y}년</option>`).join("")}</select>
      ${u.role==="admin"?`<select class="fc" style="width:160px" onchange="gradeViewFilter.dept=this.value;renderGradeView()"><option value="">전체 부서</option>${orgDB.depts.map(d=>`<option${gradeViewFilter.dept===d?" selected":""}>${h(d)}</option>`).join("")}</select>`:""}
      <select class="fc" style="width:120px" onchange="gradeViewFilter.role=this.value;renderGradeView()"><option value="">전체</option><option value="leader"${gradeViewFilter.role==="leader"?" selected":""}>팀장</option><option value="member"${gradeViewFilter.role==="member"?" selected":""}>팀원</option></select>
      <span class="fz12 text-gray">총 ${rows.length}명</span>
      <div style="margin-left:auto"><button class="btn btn-primary btn-sm" onclick="dlGradeList()">📥 고과등급 다운로드</button></div>
    </div>
  </div></div>
  <div class="card"><div class="card-body" style="padding:0"><div class="tbl-wrap"><table>
    <thead><tr><th>이름</th><th>사번</th><th>소속</th><th>직급</th><th>KPI 항목수</th><th>종합점수</th><th>KPI 등급</th><th>사업부 등급</th><th>순위(풀내)</th><th>수정</th></tr></thead>
    <tbody>${rows.map(({e,kpis,weighted,grade,grRes})=>`<tr>
      <td><strong>${h(e.name)}</strong></td>
      <td class="text-gray fz11">${h(e.empNo)}</td>
      <td><div class="fz12">${h(e.dept)}</div><div class="fz11 text-gray">${h(e.team)}</div></td>
      <td>${h(e.rank)}</td>
      <td class="tc text-gray">${kpis.length}</td>
      <td class="fw7 text-blue">${weighted!=null?weighted+"점":badge("미확정","gray")}</td>
      <td>${weighted!=null?`<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:800" class="grade-${grade}">${grade}</span>`:`<span class="text-gray">-</span>`}</td>
      <td>${grRes?`<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:800" class="grade-${grRes.grade}">${grRes.grade}</span>`:badge("미산정","gray")}</td>
      <td class="tc text-gray">${grRes?.rank||"-"}${grRes?.pool?(" ("+grRes.pool+")"):""}</td>
      <td>${grRes?.grade&&(u.role==="admin"||u.role==="director")?`<button class="btn btn-ghost btn-sm" onclick="openAdjustGradeModal('kpi',${e.id},${yr},'${grRes.grade||"B"}')">수정</button>`:""}</td>

function dlGradeList(){
  const u=currentUser;
  let emps=[];
  if(u.role==="leader")emps=employees.filter(e=>e.active&&e.role==="member"&&e.dept===u.dept&&e.team===u.team);
  else if(u.role==="director")emps=employees.filter(e=>e.active&&e.dept===u.dept&&(e.role==="member"||e.role==="leader")&&e.id!==u.id);
  else emps=employees.filter(e=>e.active&&e.role!=="admin");
  if(gradeViewFilter.dept)emps=emps.filter(e=>e.dept===gradeViewFilter.dept);
  if(gradeViewFilter.role)emps=emps.filter(e=>e.role===gradeViewFilter.role);
  const yr=gradeViewFilter.year;
  const rows=emps.map(e=>{
    const kpis=kpiEntries.filter(k=>k.userId===e.id&&k.year===yr&&k.finalConfirmed);
    const weighted=kpis.length?calcWeighted(kpis):null;
    const grade=weighted!=null?getGrade(weighted):"-";
    const grRes=e.gradeResults?.[yr];
    return[e.name,e.empNo,ROLES[e.role],e.dept,e.team,e.rank,kpis.length,weighted!=null?weighted+"점":"-",grade,grRes?.grade||"-",grRes?.rank||"-",grRes?.pool||"-"];
  });
  dlCSV(`고과등급_${yr}년_${new Date().toISOString().slice(0,10)}.csv`,["이름","사번","권한","부서","팀","직급","KPI항목수","종합점수","KPI등급","사업부등급","풀내순위","풀구분"],rows);
  showToast("고과등급 목록이 다운로드되었습니다.","success");
}

}

function renderSettingsGrades(){
  const el=$("#settings-content");if(!el)return;
  const year=settings.evalYear;
  const gc={S:"#fef9c3",A:"#dcfce7",B:"#dbeafe",C:"#fce7f3",D:"#f1f5f9"};
  function gradeRow(r,ri,dep,pool,typ){
    const dKey=dep?`getGradeSettings('${dep}').${pool}`:`companyWideRatios.${typ}.${pool}`;
    const membs=employees.filter(e=>e.active&&e.role===pool&&(!dep||e.dept===dep));
    const total=membs.length;
    const tgt=Math.max(0,Math.round(r.pct/100*total));
    const act=membs.filter(e=>{const g=(e.gradeResults||{})[String(year)]?.grade;return g===r.grade;}).length;
    const diff=act-tgt;
    return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9">
      <span style="width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:800;background:${gc[r.grade]||"#f1f5f9"};flex-shrink:0">${r.grade}</span>
      <input class="fc" type="number" min="0" max="100" value="${r.pct}" style="width:62px" onchange="${dKey}[${ri}].pct=Number(this.value);renderSettingsGrades();_broadcastGradeChange()">%
      <span class="fz11 text-gray" style="min-width:40px">→ ${tgt}명</span>
      <span class="fz11 fw6" style="min-width:40px;color:${diff>0?"#dc2626":diff<0?"#d97706":"#16a34a"}">(현 ${act}명${diff!==0?(diff>0?" +"+diff:" "+diff):" ✓"})</span>
      <button class="btn btn-ghost btn-sm" onclick="${dKey}.splice(${ri},1);renderSettingsGrades()">×</button>
    </div>`;
  }
  function gradeBlock(ratios,dep,pool,label,typ){
    const sum=ratios.reduce((s,r)=>s+r.pct,0);
    const total=employees.filter(e=>e.active&&e.role===pool&&(!dep||e.dept===dep)).length;
    const safeId=(dep||"cw")+"_"+pool;
    const dKey=dep?`getGradeSettings('${dep}').${pool}`:`companyWideRatios.${typ}.${pool}`;
    return`<div>
      <div class="sec-title">${label} <span class="fz11 ${sum===100?"text-green":"text-red"}">(합계 ${sum}%)</span> <span class="fz11 text-gray">대상 ${total}명</span></div>
      ${ratios.map((r,ri)=>gradeRow(r,ri,dep,pool,typ)).join("")}
      <div class="flex gap2 mt2">
        <select class="fc" id="gsel-${safeId}" style="width:60px"><option>S</option><option${pool==="leader"?" selected":""}>A</option><option${pool==="member"?" selected":""}>B</option><option>C</option><option>D</option></select>
        <button class="btn btn-secondary btn-sm" onclick="(()=>{const s=document.getElementById('gsel-${safeId}');if(s){${dKey}.push({grade:s.value,pct:5});renderSettingsGrades();}})()">+ 추가</button>
      </div>
    </div>`;
  }
  el.innerHTML=`
  <div class="info-note mb3">📊 KPI 등급 비율 설정. <strong>전사 기준</strong>을 먼저 설정하고, 사업부별로 조정하세요. 목표인원(→)과 현재배분(현) 차이를 실시간으로 확인할 수 있습니다.</div>
  <div class="flex gap2 mb3 wrap">
    <button class="btn btn-teal btn-sm" onclick="renderKpiGradeCompare()">📊 KPI 등급 비율 비교 보기</button>
    <button class="btn btn-secondary btn-sm" onclick="window._ratioTab='kpi';dlRatioCompare()">📥 비율 비교 다운로드</button>
  </div>
  <div class="card"><div class="card-head"><h3>🌐 전사 기준 KPI 등급 비율</h3><span class="fz11 text-gray">사업부별 비율은 이 기준을 초과할 수 없습니다</span></div>
  <div class="card-body"><div class="g2">
    ${gradeBlock(companyWideRatios.kpi.member,null,"member","팀원","kpi")}
    ${gradeBlock(companyWideRatios.kpi.leader,null,"leader","팀장","kpi")}
  </div></div></div>
  ${orgDB.depts.map(d=>{
    const gs=getGradeSettings(d);
    const mCnt=employees.filter(e=>e.active&&e.dept===d&&e.role==="member").length;
    const lCnt=employees.filter(e=>e.active&&e.dept===d&&e.role==="leader").length;
    return`<div class="card"><div class="card-head"><h3>🏢 ${h(d)}</h3><span class="fz11 text-gray">팀원 ${mCnt}명 · 팀장 ${lCnt}명</span></div>
    <div class="card-body"><div class="g2">
      ${gradeBlock(gs.member,d,"member","팀원 등급 비율","kpi")}
      ${gradeBlock(gs.leader,d,"leader","팀장 등급 비율","kpi")}
    </div>
    <div class="flex gap2 mt3">
      <button class="btn btn-teal btn-sm" onclick="tryCalcDeptGrades('${h(d)}',${year})">🔄 ${year}년 KPI 등급 재산정</button>
    </div>
    </div></div>`;
  }).join("")}`;
}
function _broadcastGradeChange(){
  clearTimeout(window._gradeChangeTmr);
  window._gradeChangeTmr=setTimeout(()=>broadcastSettingsChange("등급 비율 설정 변경"),1500);
}
function renderKpiGradeCompare(){
  const year=settings.evalYear;
  const allEmps=employees.filter(e=>e.active&&e.role!=="admin");
  function buildRow(pool,ratios,scopeEmps,label){
    const total=scopeEmps.length;const gc={};ratios.forEach(r=>{gc[r.grade]=0;});
    scopeEmps.forEach(e=>{const g=(e.gradeResults||{})[String(year)]?.grade;if(g&&gc[g]!==undefined)gc[g]++;});
    return`<div class="sec-title mt3">${label} (${total}명)</div><div class="tbl-wrap"><table style="font-size:12px"><thead><tr style="background:#f1f5f9"><th>등급</th><th>목표비율</th><th>목표인원</th><th>현재배분</th><th>차이</th></tr></thead><tbody>
    ${ratios.map(r=>{const tgt=Math.max(0,Math.round(r.pct/100*total));const act=gc[r.grade]||0;const diff=act-tgt;return`<tr style="${Math.abs(diff)>0?"background:#fff7ed":""}"><td class="tc"><span style="width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:800;background:${{"S":"#fef9c3","A":"#dcfce7","B":"#dbeafe","C":"#fce7f3","D":"#f1f5f9"}[r.grade]||"#f1f5f9"}">${r.grade}</span></td><td class="tc">${r.pct}%</td><td class="tc fw7">${tgt}명</td><td class="tc fw7 text-blue">${act}명</td><td class="tc fw7" style="color:${diff>0?"#dc2626":diff<0?"#d97706":"#16a34a"}">${diff>0?"+"+diff:diff===0?"✓":diff}</td></tr>`;}).join("")}
    <tr style="background:#f8fafc"><td colspan="2" class="fw7">합계</td><td class="tc fw7">${total}명</td><td class="tc fw7 text-blue">${Object.values(gc).reduce((a,b)=>a+b,0)}명</td><td></td></tr>
    </tbody></table></div>`;
  }
  showModal(`<div class="modal modal-lg"><div class="modal-head"><h2>KPI 등급 비율 비교 (${year}년)</h2><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body" style="max-height:70vh;overflow-y:auto">
    <div class="card" style="margin-bottom:10px"><div class="card-head"><h3>🌐 전사</h3></div><div class="card-body"><div class="g2">
      ${buildRow("member",companyWideRatios.kpi.member,allEmps.filter(e=>e.role==="member"),"팀원")}
      ${buildRow("leader",companyWideRatios.kpi.leader,allEmps.filter(e=>e.role==="leader"),"팀장")}
    </div></div></div>
    ${orgDB.depts.map(d=>{const de=allEmps.filter(e=>e.dept===d);const gs=getGradeSettings(d);return`<div class="card" style="margin-bottom:8px"><div class="card-head"><h3>${h(d)}</h3></div><div class="card-body"><div class="g2">${buildRow("member",gs.member,de.filter(e=>e.role==="member"),"팀원")}${buildRow("leader",gs.leader,de.filter(e=>e.role==="leader"),"팀장")}</div></div></div>`;}).join("")}
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">닫기</button><button class="btn btn-primary" onclick="closeModal();window._ratioTab='kpi';dlRatioCompare()">📥 다운로드</button></div></div>`);
}

function addOrgDept(){const v=$("#org-dept-new")?.value.trim();if(!v||orgDB.depts.includes(v))return;orgDB.depts.push(v);orgDB.teams[v]=[];renderSettingsOrg();broadcastSettingsChange("부서 추가: "+v);}
function removeOrgDept(d){orgDB.depts=orgDB.depts.filter(x=>x!==d);delete orgDB.teams[d];renderSettingsOrg();}
function addOrgRank(){const v=$("#org-rank-new")?.value.trim();if(!v||orgDB.ranks.includes(v))return;orgDB.ranks.push(v);renderSettingsOrg();}
function removeOrgRank(r){orgDB.ranks=orgDB.ranks.filter(x=>x!==r);renderSettingsOrg();}
function addOrgPos(){const v=$("#org-pos-new")?.value.trim();if(!v||orgDB.positions.includes(v))return;orgDB.positions.push(v);renderSettingsOrg();}
function removeOrgPos(p){orgDB.positions=orgDB.positions.filter(x=>x!==p);renderSettingsOrg();}
function addOrgTeam(dept){const safeId=dept.replace(/[\s\/]/g,"_");const v=$(`#org-team-new-${safeId}`)?.value.trim();if(!v)return;if(!orgDB.teams[dept])orgDB.teams[dept]=[];if(!orgDB.teams[dept].includes(v))orgDB.teams[dept].push(v);renderSettingsOrg();}
function removeOrgTeam(dept,team){if(orgDB.teams[dept])orgDB.teams[dept]=orgDB.teams[dept].filter(t=>t!==team);renderSettingsOrg();}
// setCompEval replaced by inline handlers in renderSettingsMain
function setStage(s){settings.stage=s;showToast(s==="goal"?"KPI 등록 단계로 변경되었습니다.":"KPI 결과 입력 단계로 변경되었습니다.","success");renderSettings();renderSidebar();broadcastSettingsChange("KPI 운영 단계: "+(s==="goal"?"등록 단계":"결과 입력 단계"));}
function setEvalYear(y){settings.evalYear=y;showToast(`평가 연도가 ${y}년으로 변경되었습니다.`,"success");renderSettings();broadcastSettingsChange(`KPI 평가 연도: ${y}년`);}
function finalConfirmAll(){
  broadcastSettingsChange("KPI 전체 확정 공개");kpiEntries=kpiEntries.map(k=>k.year===settings.evalYear&&k.finalStatus==="approved"?{...k,finalConfirmed:true,finalScore:null}:k);showToast("최종 평가 결과가 공개 처리되었습니다.","success");renderSettings();}
function resetPassword(){const id=Number($("#reset-emp")?.value),pw=$("#reset-pw")?.value.trim();if(!id||!pw){showToast("직원을 선택하고 비밀번호를 입력하세요.","error");return;}if(pw.length<6){showToast("비밀번호는 6자 이상이어야 합니다.","error");return;}employees=employees.map(e=>e.id===id?{...e,pw}:e);showToast(`${getEmpName(id)}님의 비밀번호가 초기화되었습니다.`,"success");if($("#reset-emp"))$("#reset-emp").value="";if($("#reset-pw"))$("#reset-pw").value="";}

// ==================== HISTORY ====================
function renderHistory(){
  const c=$("#content");
  const adjHistory=gradeAdjustHistory;
  c.innerHTML=`
  ${adjHistory.length?`<div class="card"><div class="card-head"><h3>🔧 등급 수정 이력</h3><button class="btn btn-secondary btn-sm" onclick="dlAdjustHistory()">📥 다운로드</button></div><div class="card-body" style="padding:0"><div class="tbl-wrap"><table>
    <thead><tr><th>날짜</th><th>직원</th><th>부서</th><th>유형</th><th>연도</th><th>변경전</th><th>변경후</th><th>사유</th><th>수정자</th></tr></thead>
    <tbody>${[...adjHistory].sort((a,b)=>b.adjustedAt.localeCompare(a.adjustedAt)).map(r=>`<tr>
      <td class="fz11 text-gray">${r.adjustedAt?.slice(0,10)||"-"}</td>
      <td><strong>${h(getEmpName(r.empId))}</strong></td>
      <td class="fz11 text-gray">${h(r.dept)}</td>
      <td>${badge(r.type==="kpi"?"KPI 등급":"역량 등급",r.type==="kpi"?"blue":"indigo")}</td>
      <td class="tc">${r.year}년</td>
      <td><span class="grade-badge-large grade-${r.oldGrade}" style="width:24px;height:24px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%">${r.oldGrade}</span></td>
      <td><span class="grade-badge-large grade-${r.newGrade}" style="width:24px;height:24px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%">${r.newGrade}</span></td>
      <td class="fz11">${h(r.reason)}</td>
      <td class="fz11 text-gray">${h(r.adjustedByName||"-")}</td>
    </tr>`).join("")}</tbody></table></div></div></div>`:``}
  <div class="card"><div class="card-head"><h3>수정 요청 이력 전체</h3></div><div class="card-body" style="padding:0">
    ${!changeRequests.length?`<div class="p-empty">이력이 없습니다.</div>`:`<div class="tbl-wrap"><table>
      <thead><tr><th>날짜</th><th>요청자</th><th>KPI</th><th>사유</th><th>상태</th><th>처리일</th></tr></thead>
      <tbody>${[...changeRequests].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(r=>{const k=getKpi(r.kpiId);const emp=getEmp(r.reqUserId);return`<tr><td class="text-gray">${r.createdAt.slice(0,10)}</td><td>${emp?.name||"-"}</td><td>${k?.item||"-"}</td><td>${h(r.reason)}</td><td>${badge(r.status==="approved"?"승인":r.status==="rejected"?"반려":"대기",r.status==="approved"?"green":r.status==="rejected"?"red":"yellow")}</td><td class="text-gray">${r.processedAt?.slice(0,10)||"-"}</td></tr>`;}).join("")}</tbody></table></div>`}
  </div></div>`;
}

// ==================== CHANGE PASSWORD ====================
function dlAdjustHistory(){dlCSV(`등급수정이력_${new Date().toISOString().slice(0,10)}.csv`,["날짜","직원","부서","유형","연도","변경전","변경후","사유","수정자"],gradeAdjustHistory.map(r=>[r.adjustedAt?.slice(0,10)||"-",getEmpName(r.empId),r.dept||"-",r.type==="kpi"?"KPI":"역량",r.year,r.oldGrade,r.newGrade,r.reason,r.adjustedByName||"-"]));}
function renderChangePW(){
  const c=$("#content");
  c.innerHTML=`<div style="max-width:440px"><div class="card"><div class="card-head"><h3>비밀번호 변경</h3></div><div class="card-body">
    <div class="fg"><label class="fl">현재 비밀번호 <span class="req">*</span></label><input class="fc" type="password" id="cp-cur"></div>
    <div class="fg"><label class="fl">새 비밀번호 <span class="req">*</span></label><input class="fc" type="password" id="cp-new" placeholder="6자 이상"></div>
    <div class="fg"><label class="fl">새 비밀번호 확인 <span class="req">*</span></label><input class="fc" type="password" id="cp-cf"></div>
    <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" onclick="doChangePW()">비밀번호 변경</button>
  </div></div></div>`;
}
function doChangePW(){
  const cur=$("#cp-cur")?.value,nw=$("#cp-new")?.value,cf=$("#cp-cf")?.value;
  const emp=getEmp(currentUser.id);
  if(!emp||emp.pw!==cur){showToast("현재 비밀번호가 올바르지 않습니다.","error");return;}
  if(nw.length<6){showToast("새 비밀번호는 6자 이상이어야 합니다.","error");return;}
  if(nw!==cf){showToast("새 비밀번호가 일치하지 않습니다.","error");return;}
  employees=employees.map(e=>e.id===currentUser.id?{...e,pw:nw}:e);
  currentUser={...currentUser,pw:nw};
  showToast("비밀번호가 변경되었습니다.","success");
  ["cp-cur","cp-new","cp-cf"].forEach(id=>{const el=$(`#${id}`);if(el)el.value="";});
}

// ==================== START ====================
renderLogin();
</script>
