<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>급여 자동계산 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #2563eb;
  --success: #16a34a;
  --danger: #dc2626;
  --warn: #d97706;
  --bg: #f1f5f9;
  --card: #ffffff;
  --border: #e2e8f0;
  --text-muted: #64748b;
}
* { box-sizing: border-box; }
body { font-family: -apple-system, 'Noto Sans KR', sans-serif; background: var(--bg); font-size: 14px; padding-bottom: 80px; }
.page { display: none; }
.page.active { display: block; }
.navbar { background: var(--primary) !important; position: sticky; top: 0; z-index: 100; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 100; }
.bn-item { flex: 1; text-align: center; padding: 10px 0 8px; cursor: pointer; color: var(--text-muted); font-size: 11px; }
.bn-item.active { color: var(--primary); }
.bn-item svg { display: block; margin: 0 auto 2px; }
.card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 12px; }
.card-header { background: none; border-bottom: 1px solid var(--border); font-weight: 600; padding: 12px 16px; border-radius: 12px 12px 0 0; }
.card-body { padding: 14px 16px; }
.badge-dept { background: #eff6ff; color: #1d4ed8; border-radius: 6px; padding: 2px 8px; font-size: 11px; }
.won { font-weight: 700; color: var(--primary); }
.deduct { color: var(--danger); }
.lock-banner { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.lock-past { background: #4b5563; color: #fff; }
.lock-closed { background: var(--danger); color: #fff; }
.lock-open { background: var(--success); color: #fff; }
.table-calc { width: 100%; font-size: 13px; }
.table-calc td { padding: 4px 0; }
.table-calc td:last-child { text-align: right; font-weight: 500; }
.divider { border-top: 1px solid var(--border); margin: 8px 0; }
.emp-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.emp-row:last-child { border-bottom: none; }
.emp-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; flex-shrink: 0; }
.emp-info { flex: 1; min-width: 0; }
.emp-name { font-weight: 600; }
.emp-sub { color: var(--text-muted); font-size: 12px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.month-nav .month-label { font-size: 18px; font-weight: 700; }
.section-title { font-size: 15px; font-weight: 700; margin: 16px 0 8px; color: #1e293b; }
.adj-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.adj-item:last-child { border-bottom: none; }
.adj-type { flex: 1; }
.adj-value { font-weight: 600; }
.progress-thin { height: 6px; border-radius: 3px; }
.rate-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.rate-row:last-child { border-bottom: none; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal-sheet { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 0 auto 20px; }
.form-label { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.form-control, .form-select { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; outline: none; }
.form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
.btn-primary { background: var(--primary); border: none; color: #fff; border-radius: 10px; padding: 12px 20px; font-weight: 600; width: 100%; font-size: 15px; cursor: pointer; }
.btn-primary:active { background: #1d4ed8; }
.btn-outline { background: none; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 13px; cursor: pointer; color: #334155; }
.btn-danger { background: var(--danger); border: none; color: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-success { background: var(--success); border: none; color: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.fab { position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(37,99,235,0.4); cursor: pointer; z-index: 90; }
.tag { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
.tag-add { background: #dcfce7; color: #166534; }
.tag-deduct { background: #fee2e2; color: #991b1b; }
.tag-leave { background: #fef3c7; color: #92400e; }
.net-pay-box { background: linear-gradient(135deg, #1e3a8a, #2563eb); border-radius: 14px; padding: 18px; color: #fff; margin-bottom: 12px; }
.net-pay-box .label { opacity: 0.8; font-size: 12px; }
.net-pay-box .amount { font-size: 26px; font-weight: 800; margin-top: 4px; }
.history-item { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.toast-msg { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast-msg.show { opacity: 1; }
</style>
</head>

<!-- FAB -->

<!-- Add Employee Modal -->

  <div class="modal-sheet">

    <div style="font-size:18px;font-weight:700;margin-bottom:20px">조정 항목 추가</div>
    <input type="hidden" id="adj-emp-id">
    <input type="hidden" id="adj-edit-id">
    <div class="mb-3">

<!-- Employee Detail Modal -->

  </div>
</div>

<!-- Rates Edit Modal -->
<div class="modal-overlay" id="modal-rates">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="font-size:18px;font-weight:700;margin-bottom:20px">보험료율 수정</div>
    <div class="mb-3">
      <div class="form-label">국민연금 (근로자 부담, %)</div>
      <input type="number" class="form-control" id="rate-np" step="0.01">
    </div>
    <div class="mb-3">
      <div class="form-label">건강보험 (근로자 부담, %)</div>
      <input type="number" class="form-control" id="rate-hi" step="0.001">
    </div>
    <div class="mb-3">
      <div class="form-label">장기요양 (건강보험료 대비, %)</div>
      <input type="number" class="form-control" id="rate-ltc" step="0.01">
    </div>
    <div class="mb-3">
      <div class="form-label">고용보험 (근로자 부담, %)</div>
      <input type="number" class="form-control" id="rate-ei" step="0.01">
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn-outline" style="flex:1" onclick="closeModal('modal-rates')">취소</button>
      <button class="btn-primary" style="flex:1" onclick="saveRates()">저장</button>
    </div>
  </div>
</div>

<script>
// ===== DATA LAYER =====
const KEY = 'salary_v2';

const DEFAULT_RATES = {
  np: 4.5,      // 국민연금
  hi: 3.545,    // 건강보험
  ltc: 12.95,   // 장기요양 (건강보험료 기준)
  ei: 0.9,      // 고용보험
  np_max: 5900000
};

const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f59e0b'];

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || newState(); }
  catch { return newState(); }
}
function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
function newState() { return { employees: [], adjustments: {}, periods: {}, records: {}, rates: { ...DEFAULT_RATES } }; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

let state = load();
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let currentPage = 'employees';

// ===== CALCULATION =====
function calcIncomeTax(annualSalary) {
  // 근로소득공제
  let ded;
  if (annualSalary <= 5000000) ded = annualSalary * 0.70;
  else if (annualSalary <= 15000000) ded = 3500000 + (annualSalary - 5000000) * 0.40;
  else if (annualSalary <= 45000000) ded = 7500000 + (annualSalary - 15000000) * 0.15;
  else if (annualSalary <= 100000000) ded = 12000000 + (annualSalary - 45000000) * 0.05;
  else ded = 14750000 + (annualSalary - 100000000) * 0.02;
  ded = Math.min(ded, 20000000);

  const ti = Math.max(0, annualSalary - ded);
  let tax;
  if (ti <= 14000000) tax = ti * 0.06;
  else if (ti <= 50000000) tax = 840000 + (ti - 14000000) * 0.15;
  else if (ti <= 88000000) tax = 6240000 + (ti - 50000000) * 0.24;
  else if (ti <= 150000000) tax = 15360000 + (ti - 88000000) * 0.35;
  else if (ti <= 300000000) tax = 37060000 + (ti - 150000000) * 0.38;
  else if (ti <= 500000000) tax = 94060000 + (ti - 300000000) * 0.40;
  else if (ti <= 1000000000) tax = 174060000 + (ti - 500000000) * 0.42;
  else tax = 384060000 + (ti - 1000000000) * 0.45;

  // 근로소득세액공제
  let credit = tax <= 1300000 ? tax * 0.55 : 715000 + (tax - 1300000) * 0.30;
  credit = Math.min(credit, 740000);

  const annual = Math.max(0, tax - credit);
  return Math.round(annual / 12 / 10) * 10;
}

function calcEmployee(emp, adjs, rates) {
  const r = rates || state.rates;
  const monthly = Math.round(emp.annual_salary / 12);

  let unpaidDays = 0, otherAdd = 0, otherDed = 0;
  const adjDetails = [];
  for (const a of (adjs || [])) {
    if (a.type === '무급휴가') {
      const amt = Math.round(monthly / 21.75 * a.days);
      unpaidDays = a.days;
      otherDed += amt;
      adjDetails.push({ label: `무급휴가 ${a.days}일`, amount: -amt, note: a.note });
    } else if (['경조사비','식대','교통비','기타지급'].includes(a.type)) {
      otherAdd += a.amount;
      adjDetails.push({ label: a.type + (a.note ? ` (${a.note})` : ''), amount: a.amount, note: '' });
    } else if (a.type === '기타공제') {
      otherDed += a.amount;
      adjDetails.push({ label: '기타공제' + (a.note ? ` (${a.note})` : ''), amount: -a.amount, note: '' });
    }
  }

  const gross = monthly - (unpaidDays > 0 ? Math.round(monthly / 21.75 * unpaidDays) : 0) + otherAdd;

  const npBase = Math.min(gross, r.np_max);
  const np = Math.round(npBase * (r.np / 100) / 10) * 10;
  const hi = Math.round(gross * (r.hi / 100) / 10) * 10;
  const ltc = Math.round(hi * (r.ltc / 100) / 10) * 10;
  const ei = Math.round(gross * (r.ei / 100) / 10) * 10;
  const it = calcIncomeTax(emp.annual_salary);
  const lit = Math.round(it * 0.1 / 10) * 10;

  const totalDed = np + hi + ltc + ei + it + lit + otherDed;
  const net = gross - totalDed;

  return { monthly, otherAdd, otherDed, gross, np, hi, ltc, ei, it, lit, totalDed, net, adjDetails };
}

// ===== FORMATTING =====
function won(n) {
  if (n == null) return '-';
  return (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
}
function wonShort(n) {
  const abs = Math.abs(Math.round(n));
  if (abs >= 100000000) return (n < 0 ? '-' : '') + (abs / 100000000).toFixed(1) + '억';
  if (abs >= 10000) return (n < 0 ? '-' : '') + Math.round(abs / 10000) + '만';
  return won(n);
}
function mkKey(y, m) { return `${y}-${String(m).padStart(2,'0')}`; }

// ===== PERIOD =====
function isPast(y, m) {
  const now = new Date();
  return y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth() + 1);
}
function isClosed(y, m) {
  const p = state.periods[mkKey(y, m)];
  return p && p.locked;
}
function isEditable(y, m) {
  if (isPast(y, m)) return false;
  return !isClosed(y, m);
}

// ===== PAGE NAV =====
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.bn-item').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  document.getElementById('fab-btn').style.display = (page === 'employees') ? 'flex' : 'none';
  currentPage = page;
  if (page === 'salary') renderSalaryPage();
  if (page === 'history') renderHistoryPage();
  if (page === 'employees') renderEmployees();
}

// ===== EMPLOYEES =====
function renderEmployees() {
  const emps = state.employees;
  document.getElementById('emp-count').textContent = emps.length;
  const list = document.getElementById('emp-list');
  const empty = document.getElementById('emp-empty');
  if (emps.length === 0) {
    list.style.display = 'none';
    empty.style.display = '';
    return;
  }
  list.style.display = '';
  empty.style.display = 'none';
  list.innerHTML = emps.map((e, i) => `
    <div class="emp-row" onclick="openEditEmp('${e.id}')">
      <div class="emp-avatar" style="background:${COLORS[i % COLORS.length]}">${e.name[0]}</div>
      <div class="emp-info">
        <div class="emp-name">${e.name}</div>
        <div class="emp-sub">
          ${e.department ? `<span class="badge-dept">${e.department}</span> ` : ''}
          ${e.position || ''}
        </div>
      </div>
      <div style="text-align:right">
        <div class="won" style="font-size:13px">${wonShort(e.annual_salary)}</div>
        <div style="font-size:11px;color:var(--text-muted)">연봉</div>
      </div>
    </div>
  `).join('');
}

function openAddModal() {
  document.getElementById('modal-emp-title').textContent = '직원 추가';
  document.getElementById('edit-emp-id').value = '';
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-dept').value = '';
  document.getElementById('inp-position').value = '';
  document.getElementById('inp-salary').value = '';
  document.getElementById('edit-emp-delete').style.display = 'none';
  openModal('modal-emp');
}

function openEditEmp(id) {
  const e = state.employees.find(x => x.id === id);
  if (!e) return;
  document.getElementById('modal-emp-title').textContent = '직원 수정';
  document.getElementById('edit-emp-id').value = id;
  document.getElementById('inp-name').value = e.name;
  document.getElementById('inp-dept').value = e.department || '';
  document.getElementById('inp-position').value = e.position || '';
  document.getElementById('inp-salary').value = e.annual_salary;
  document.getElementById('edit-emp-delete').style.display = '';
  openModal('modal-emp');
}

function saveEmployee() {
  const id = document.getElementById('edit-emp-id').value;
  const name = document.getElementById('inp-name').value.trim();
  const salary = parseInt(document.getElementById('inp-salary').value);
  if (!name) { toast('이름을 입력하세요'); return; }
  if (!salary || salary < 1000000) { toast('올바른 연봉을 입력하세요'); return; }
  if (id) {
    const e = state.employees.find(x => x.id === id);
    e.name = name;
    e.department = document.getElementById('inp-dept').value.trim();
    e.position = document.getElementById('inp-position').value.trim();
    e.annual_salary = salary;
  } else {
    state.employees.push({
      id: uid(), name,
      department: document.getElementById('inp-dept').value.trim(),
      position: document.getElementById('inp-position').value.trim(),
      annual_salary: salary
    });
  }
  save(state);
  closeModal('modal-emp');
  renderEmployees();
  toast(id ? '수정되었습니다' : '추가되었습니다');
}

function deleteEmployee() {
  const id = document.getElementById('edit-emp-id').value;
  if (!confirm('삭제하시겠습니까?')) return;
  state.employees = state.employees.filter(x => x.id !== id);
  save(state);
  closeModal('modal-emp');
  renderEmployees();
  toast('삭제되었습니다');
}

// ===== SALARY PAGE =====
function renderSalaryPage() {
  const y = currentYear, m = currentMonth;
  document.getElementById('month-label').textContent = `${y}년 ${m}월`;

  // Lock banner
  const banner = document.getElementById('lock-banner');
  const exportRow = document.getElementById('salary-export-row');
  if (isPast(y, m)) {
    banner.innerHTML = `<div class="lock-banner lock-past">🔒 이전 달 — 시스템 잠금 (조회만 가능)</div>`;
    exportRow.style.display = 'none';
  } else if (isClosed(y, m)) {
    banner.innerHTML = `
      <div class="lock-banner lock-closed">
        <span>🔒 ${y}년 ${m}월 마감됨</span>
        <button class="btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,0.5)" onclick="reopenPeriod()">마감 해제</button>
      </div>`;
    exportRow.style.display = 'none';
  } else {
    banner.innerHTML = `
      <div class="lock-banner lock-open">
        <span>✅ ${y}년 ${m}월 편집 가능</span>
        <button class="btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,0.5)" onclick="closePeriod()">마감</button>
      </div>`;
    exportRow.style.display = '';
  }

  const emps = state.employees;
  const list = document.getElementById('salary-list');
  const empty = document.getElementById('salary-empty');
  if (emps.length === 0) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  const key = mkKey(y, m);
  const adjs = state.adjustments[key] || [];
  const editable = isEditable(y, m);

  list.innerHTML = emps.map((emp, idx) => {
    const empAdjs = adjs.filter(a => a.emp_id === emp.id);
    const c = calcEmployee(emp, empAdjs, state.rates);
    const ratio = Math.round((c.totalDed / c.gross) * 100);
    const color = COLORS[idx % COLORS.length];

    return `
    <div class="card">
      <div class="card-header d-flex align-items-center gap-2">
        <div style="width:32px;height:32px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0">${emp.name[0]}</div>
        <div style="flex:1">
          <div>${emp.name} <span style="font-size:11px;color:var(--text-muted)">${emp.position || ''}</span></div>
          <div style="font-size:11px;color:var(--text-muted)">${emp.department || ''}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="net-pay-box">
          <div class="label">실수령액</div>
          <div class="amount">${won(c.net)}</div>
        </div>
        <table class="table-calc">
          <tr><td colspan="2" style="font-weight:700;padding-bottom:4px;color:#16a34a">▸ 지급 내역</td></tr>
          <tr><td>기본급</td><td class="won">${won(c.monthly)}</td></tr>
          ${c.adjDetails.filter(a=>a.amount>0).map(a=>`<tr><td style="color:#16a34a">${a.label}</td><td style="color:#16a34a">+${won(a.amount)}</td></tr>`).join('')}
          <tr class="divider"><td colspan="2"></td></tr>
          <tr><td><strong>지급 합계</strong></td><td><strong class="won">${won(c.gross)}</strong></td></tr>
          <tr><td colspan="2" style="font-weight:700;padding:8px 0 4px;color:#dc2626">▸ 공제 내역</td></tr>
          <tr><td>국민연금 (4.5%)</td><td class="deduct">-${won(c.np)}</td></tr>
          <tr><td>건강보험 (3.545%)</td><td class="deduct">-${won(c.hi)}</td></tr>
          <tr><td>장기요양보험</td><td class="deduct">-${won(c.ltc)}</td></tr>
          <tr><td>고용보험 (0.9%)</td><td class="deduct">-${won(c.ei)}</td></tr>
          <tr><td>근로소득세</td><td class="deduct">-${won(c.it)}</td></tr>
          <tr><td>지방소득세</td><td class="deduct">-${won(c.lit)}</td></tr>
          ${c.adjDetails.filter(a=>a.amount<0).map(a=>`<tr><td style="color:#dc2626">${a.label}</td><td style="color:#dc2626">-${won(Math.abs(a.amount))}</td></tr>`).join('')}
          <tr class="divider"><td colspan="2"></td></tr>
          <tr><td><strong>공제 합계</strong></td><td><strong class="deduct">-${won(c.totalDed)}</strong></td></tr>
        </table>
        <div class="mt-3">
          <div class="d-flex justify-content-between" style="font-size:11px;margin-bottom:4px">
            <span style="color:var(--text-muted)">공제율</span>
            <span style="color:var(--text-muted)">${ratio}%</span>
          </div>
          <div class="progress progress-thin">
            <div class="progress-bar bg-danger" style="width:${ratio}%"></div>
          </div>
        </div>
        ${editable ? `
        <div class="mt-3 d-flex gap-2">
          <button class="btn-outline btn-sm" style="flex:1" onclick="openAdjModal('${emp.id}')">+ 조정 항목</button>
          ${empAdjs.length > 0 ? `<button class="btn-outline btn-sm" style="flex:1;color:var(--danger)" onclick="showAdjList('${emp.id}')">조정 목록 (${empAdjs.length})</button>` : ''}
        </div>` : (empAdjs.length > 0 ? `<div style="margin-top:8px;font-size:12px;color:var(--text-muted)">조정 항목 ${empAdjs.length}개 (잠금)</div>` : '')}
      </div>
    </div>`;
  }).join('');
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  renderSalaryPage();
}

function closePeriod() {
  const key = mkKey(currentYear, currentMonth);
  state.periods[key] = { locked: true, locked_at: new Date().toISOString() };
  save(state);
  renderSalaryPage();
  toast(`${currentYear}년 ${currentMonth}월 마감되었습니다`);
}

function reopenPeriod() {
  const key = mkKey(currentYear, currentMonth);
  state.periods[key] = { locked: false, reopened_at: new Date().toISOString() };
  save(state);
  renderSalaryPage();
  toast('마감이 해제되었습니다');
}

// ===== ADJUSTMENTS =====
function onAdjTypeChange() {
  const t = document.getElementById('adj-type').value;
  document.getElementById('adj-days-row').style.display = t === '무급휴가' ? '' : 'none';
  document.getElementById('adj-amount-row').style.display = t !== '무급휴가' ? '' : 'none';
}

function openAdjModal(empId) {
  const sel = document.getElementById('adj-emp-select');
  sel.innerHTML = state.employees.map(e =>
    `<option value="${e.id}" ${e.id === empId ? 'selected' : ''}>${e.name}</option>`
  ).join('');
  document.getElementById('adj-edit-id').value = '';
  document.getElementById('adj-type').value = '무급휴가';
  document.getElementById('adj-days').value = '';
  document.getElementById('adj-amount').value = '';
  document.getElementById('adj-note').value = '';
  onAdjTypeChange();
  openModal('modal-adj');
}

function saveAdjustment() {
  const empId = document.getElementById('adj-emp-select').value;
  const type = document.getElementById('adj-type').value;
  const note = document.getElementById('adj-note').value.trim();
  const key = mkKey(currentYear, currentMonth);
  if (!state.adjustments[key]) state.adjustments[key] = [];

  let adj = { id: uid(), emp_id: empId, type, note };
  if (type === '무급휴가') {
    const days = parseFloat(document.getElementById('adj-days').value);
    if (!days || days <= 0) { toast('무급 일수를 입력하세요'); return; }
    adj.days = days;
  } else {
    const amount = parseInt(document.getElementById('adj-amount').value);
    if (!amount || amount <= 0) { toast('금액을 입력하세요'); return; }
    adj.amount = amount;
  }

  const editId = document.getElementById('adj-edit-id').value;
  if (editId) {
    const idx = state.adjustments[key].findIndex(a => a.id === editId);
    if (idx >= 0) state.adjustments[key][idx] = { ...adj, id: editId };
  } else {
    state.adjustments[key].push(adj);
  }

  save(state);
  closeModal('modal-adj');
  renderSalaryPage();
  toast('조정 항목이 추가되었습니다');
}

function showAdjList(empId) {
  const key = mkKey(currentYear, currentMonth);
  const empAdjs = (state.adjustments[key] || []).filter(a => a.emp_id === empId);
  const emp = state.employees.find(e => e.id === empId);
  const editable = isEditable(currentYear, currentMonth);
  document.getElementById('modal-detail-content').innerHTML = `
    <div style="font-size:18px;font-weight:700;margin-bottom:16px">${emp.name} 조정 항목</div>
    ${empAdjs.map(a => `
      <div class="adj-item">
        <div class="adj-type">
          <div>${a.type}</div>
          ${a.note ? `<div style="font-size:11px;color:var(--text-muted)">${a.note}</div>` : ''}
        </div>
        <div class="adj-value">${a.type === '무급휴가' ? a.days + '일' : won(a.amount)}</div>
        ${editable ? `<button style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:18px;padding:0 4px" onclick="deleteAdj('${a.id}')">×</button>` : ''}
      </div>
    `).join('')}
  `;
  openModal('modal-detail');
}

function deleteAdj(adjId) {
  const key = mkKey(currentYear, currentMonth);
  state.adjustments[key] = (state.adjustments[key] || []).filter(a => a.id !== adjId);
  save(state);
  closeModal('modal-detail');
  renderSalaryPage();
  toast('삭제되었습니다');
}

// ===== RECORDS =====
function saveAllRecords() {
  const y = currentYear, m = currentMonth;
  const key = mkKey(y, m);
  const adjs = state.adjustments[key] || [];
  if (!state.records[key]) state.records[key] = [];

  let saved = 0;
  for (const emp of state.employees) {
    const empAdjs = adjs.filter(a => a.emp_id === emp.id);
    const c = calcEmployee(emp, empAdjs, state.rates);
    const existing = state.records[key].findIndex(r => r.emp_id === emp.id);
    const rec = { emp_id: emp.id, emp_name: emp.name, dept: emp.department, ...c, saved_at: new Date().toISOString() };
    if (existing >= 0) state.records[key][existing] = rec;
    else { state.records[key].push(rec); saved++; }
  }
  save(state);
  toast(`${state.employees.length}명 급여 기록이 저장되었습니다`);
}

// ===== HISTORY =====
function renderHistoryPage() {
  const list = document.getElementById('history-list');
  const empty = document.getElementById('history-empty');
  const keys = Object.keys(state.records).sort().reverse();
  if (keys.length === 0) {
    list.style.display = 'none';
    empty.style.display = '';
  } else {
    list.style.display = '';
    empty.style.display = 'none';
    list.innerHTML = keys.map(k => {
      const recs = state.records[k];
      const total = recs.reduce((s, r) => s + (r.net || 0), 0);
      return `<div class="history-item">
        <div>
          <div style="font-weight:600">${k.replace('-', '년 ')}월</div>
          <div style="font-size:11px;color:var(--text-muted)">${recs.length}명</div>
        </div>
        <div style="text-align:right">
          <div class="won" style="font-size:13px">${won(total)}</div>
          <div style="font-size:11px;color:var(--text-muted)">실수령 합계</div>
        </div>
      </div>`;
    }).join('');
  }

  // Rates display
  const r = state.rates;
  document.getElementById('rates-display').innerHTML = `
    <div class="rate-row"><span>국민연금 (근로자)</span><span>${r.np}%</span></div>
    <div class="rate-row"><span>건강보험 (근로자)</span><span>${r.hi}%</span></div>
    <div class="rate-row"><span>장기요양보험</span><span>건강보험의 ${r.ltc}%</span></div>
    <div class="rate-row"><span>고용보험 (근로자)</span><span>${r.ei}%</span></div>
    <div class="rate-row"><span>국민연금 상한액</span><span>${(r.np_max/10000).toFixed(0)}만원/월</span></div>
    <div class="mt-3">
      <button class="btn-outline btn-sm" onclick="openRatesModal()">요율 수정</button>
    </div>
  `;
}

function openRatesModal() {
  document.getElementById('rate-np').value = state.rates.np;
  document.getElementById('rate-hi').value = state.rates.hi;
  document.getElementById('rate-ltc').value = state.rates.ltc;
  document.getElementById('rate-ei').value = state.rates.ei;
  openModal('modal-rates');
}

function saveRates() {
  state.rates = {
    np: parseFloat(document.getElementById('rate-np').value) || DEFAULT_RATES.np,
    hi: parseFloat(document.getElementById('rate-hi').value) || DEFAULT_RATES.hi,
    ltc: parseFloat(document.getElementById('rate-ltc').value) || DEFAULT_RATES.ltc,
    ei: parseFloat(document.getElementById('rate-ei').value) || DEFAULT_RATES.ei,
    np_max: state.rates.np_max || DEFAULT_RATES.np_max
  };
  save(state);
  closeModal('modal-rates');
  renderHistoryPage();
  toast('보험료율이 수정되었습니다');
}

// ===== EXCEL EXPORT =====
function exportExcel() {
  if (typeof XLSX === 'undefined') { toast('Excel 기능은 인터넷 연결이 필요합니다'); return; }
  const y = currentYear, m = currentMonth;
  const key = mkKey(y, m);
  const adjs = state.adjustments[key] || [];
  const rows = state.employees.map(emp => {
    const c = calcEmployee(emp, adjs.filter(a => a.emp_id === emp.id), state.rates);
    return {
      '이름': emp.name, '부서': emp.department || '', '직급': emp.position || '',
      '연봉': emp.annual_salary, '기본급': c.monthly,
      '기타지급': c.otherAdd, '지급합계': c.gross,
      '국민연금': c.np, '건강보험': c.hi, '장기요양': c.ltc,
      '고용보험': c.ei, '근로소득세': c.it, '지방소득세': c.lit,
      '기타공제': c.otherDed, '공제합계': c.totalDed, '실수령액': c.net
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${y}년${m}월`);
  XLSX.writeFile(wb, `급여명세_${y}년${m}월.xlsx`);
  toast('엑셀 파일이 다운로드되었습니다');
}

// ===== MODAL HELPERS =====
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ===== TOAST =====
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== INIT =====

renderSalaryPage();
document.getElementById('month-label').textContent = `${currentYear}년 ${currentMonth}월`;
