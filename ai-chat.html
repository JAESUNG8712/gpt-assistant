<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 어시스턴트">
<title>자가 학습 AI 어시스턴트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d12;--surface:#16161f;--surface2:#1e1e2b;
  --border:#2a2a3a;--accent:#7c6af7;--accent2:#4caf84;
  --text:#e2e2ef;--dim:#777;--user-bg:#252060;
  --ai-bg:#1a1a26;--error:#e55;--sim:#f0a500;
  --sidebar-w:290px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;height:100dvh;overscroll-behavior:none}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}

/* ─── LAYOUT ─── */
#app{display:flex;flex:1;overflow:hidden;position:relative}

/* ─── OVERLAY (mobile) ─── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;backdrop-filter:blur(2px)}
#overlay.show{display:block}

/* ─── SIDEBAR ─── */
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:95;
}
#sidebar-inner{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* Connect section */
#connect-section{padding:14px;border-bottom:1px solid var(--border);flex-shrink:0}
#connect-section h3{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
#connect-url{font-size:.8rem;color:var(--accent);word-break:break-all;margin-bottom:8px;line-height:1.5}
#qr-wrap{display:flex;justify-content:center;margin:6px 0}
#qr-wrap img{border-radius:8px;border:3px solid var(--surface2)}
.copy-btn{width:100%;padding:6px;background:var(--surface2);border:1px solid var(--border);color:var(--dim);font-size:.78rem;border-radius:6px;cursor:pointer;transition:all .2s}
.copy-btn:hover{color:var(--text);border-color:var(--accent)}

/* KB stats */
#kb-stats{padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#kb-stats h3{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kb-row{display:flex;justify-content:space-between;font-size:.8rem;padding:2px 0}
.kb-row span:last-child{color:var(--accent);font-weight:600}

/* Tabs */
#sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;padding:10px 4px;font-size:.75rem;background:none;border:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface2)}
.tab-panels{flex:1;overflow:hidden;position:relative}
.tab-panel{display:none;position:absolute;inset:0;overflow-y:auto;padding:14px;flex-direction:column;gap:10px}
.tab-panel.active{display:flex}

.panel-label{font-size:.78rem;color:var(--dim);line-height:1.5}
.panel-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:.86rem;font-family:inherit;resize:none;outline:none;transition:border-color .2s;-webkit-appearance:none}
.panel-input:focus{border-color:var(--accent)}
.panel-btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:.86rem;font-weight:600;cursor:pointer;transition:opacity .2s;min-height:44px}
.panel-btn:disabled{opacity:.4;cursor:not-allowed}
.panel-btn.primary{background:var(--accent);color:#fff}
.panel-btn.success{background:var(--accent2);color:#fff}
.panel-btn.warn{background:var(--sim);color:#000}
.panel-btn:hover:not(:disabled){opacity:.85}
.panel-result{font-size:.8rem;padding:9px;border-radius:7px;display:none;word-break:break-word;line-height:1.5}
.panel-result.ok{color:var(--accent2);background:#0a1f14;border:1px solid #1a3a24}
.panel-result.err{color:var(--error);background:#1f0a0a;border:1px solid #3a1a1a}
.sim-progress{font-size:.78rem;color:var(--sim);display:none;padding:4px 0}
.divider{border:none;border-top:1px solid var(--border);margin:4px 0}
.iter-row{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--dim)}
.iter-row .panel-input{width:80px;padding:6px 8px}

/* ─── MAIN ─── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Header */
header{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
}
#hamburger{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:4px;font-size:1.3rem;line-height:1;min-width:36px;min-height:36px;align-items:center;justify-content:center;border-radius:6px}
#hamburger:hover{background:var(--surface2)}
header h1{font-size:.95rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status-dot{width:8px;height:8px;border-radius:50%;background:#555;flex-shrink:0}
#status-dot.on{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
#status-dot.off{background:var(--error)}
#status-label{font-size:.75rem;color:var(--dim);white-space:nowrap}
#model-sel{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:.78rem;max-width:130px;-webkit-appearance:none}

/* Chat */
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:13px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:9px;max-width:780px;width:100%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.msg.user .avatar{background:var(--user-bg)}
.msg.ai .avatar{background:#1a2a1a}
.bubble{padding:10px 13px;border-radius:12px;line-height:1.65;font-size:.9rem;white-space:pre-wrap;word-break:break-word;max-width:calc(100% - 39px)}
.msg.user .bubble{background:var(--user-bg);border-radius:12px 4px 12px 12px}
.msg.ai .bubble{background:var(--ai-bg);border:1px solid var(--border);border-radius:4px 12px 12px 12px}
.bubble.streaming::after{content:'▌';animation:blink .7s step-end infinite;color:var(--accent);margin-left:2px}
@keyframes blink{50%{opacity:0}}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:.7rem;padding:2px 7px;border-radius:9px}
.tag.kb{background:#0d1f0d;color:var(--accent2);border:1px solid #1a3a1a}
.tag.web{background:#0d0d1f;color:var(--accent);border:1px solid var(--border)}
.tag a{color:inherit;text-decoration:none}
.tag a:hover{text-decoration:underline}
#empty{margin:auto;text-align:center;color:var(--dim);padding:20px}
#empty .icon{font-size:2.5rem;margin-bottom:10px}
#empty p{font-size:.86rem;line-height:1.7}

/* Input area */
#input-area{
  padding:12px 16px;border-top:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
  padding-bottom:calc(12px + var(--safe-bottom));
}
.toggles{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:9px}
.toggle{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--dim);cursor:pointer;user-select:none;min-height:28px}
.toggle input{accent-color:var(--accent);cursor:pointer;width:15px;height:15px}
.input-row{display:flex;gap:8px;align-items:flex-end}
#user-input{
  flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px 13px;font-size:.9rem;resize:none;
  min-height:44px;max-height:140px;font-family:inherit;outline:none;
  transition:border-color .2s;-webkit-appearance:none;
}
#user-input:focus{border-color:var(--accent)}
#send-btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  width:44px;height:44px;font-size:1.1rem;cursor:pointer;flex-shrink:0;
  transition:opacity .2s;display:flex;align-items:center;justify-content:center;
}
#send-btn:disabled{opacity:.4;cursor:not-allowed}
#send-btn:hover:not(:disabled){opacity:.85}

/* ─── RESPONSIVE: tablet / iPad ─── */
@media(max-width:900px){
  #hamburger{display:flex}
  #sidebar{
    position:fixed;left:0;top:0;height:100%;
    transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(0,0,0,.4);
  }
  #sidebar.open{transform:translateX(0)}
  #status-label{display:none}
}

/* ─── RESPONSIVE: phone ─── */
@media(max-width:480px){
  #model-sel{max-width:100px;font-size:.72rem}
  header h1{font-size:.88rem}
  .bubble{font-size:.88rem}
  .toggles{gap:8px}
  .toggle{font-size:.76rem}
}
</style>
</head>
<body>
<div id="overlay" onclick="closeSidebar()"></div>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-inner">

      <!-- iPad 접속 정보 -->
      <div id="connect-section">
        <h3>iPad / 다른 기기 접속</h3>
        <div id="connect-url">주소 불러오는 중...</div>
        <div id="qr-wrap"></div>
        <button class="copy-btn" onclick="copyUrl()">주소 복사</button>
      </div>

      <!-- 지식 통계 -->
      <div id="kb-stats">
        <h3>지식 베이스</h3>
        <div class="kb-row"><span>전체</span><span id="kb-total">0</span></div>
        <div class="kb-row"><span>대화 학습</span><span id="kb-conv">0</span></div>
        <div class="kb-row"><span>URL 학습</span><span id="kb-url">0</span></div>
        <div class="kb-row"><span>시뮬레이션</span><span id="kb-sim">0</span></div>
      </div>

      <!-- 탭 -->
      <div id="sidebar-tabs">
        <button class="tab-btn active" onclick="switchTab('url')">URL</button>
        <button class="tab-btn" onclick="switchTab('sim')">시뮬레이션</button>
        <button class="tab-btn" onclick="switchTab('manual')">직접입력</button>
      </div>

      <div class="tab-panels">
        <!-- URL 학습 -->
        <div id="tab-url" class="tab-panel active">
          <p class="panel-label">웹페이지 URL을 입력하면 AI가 내용을 읽고 학습합니다</p>
          <input class="panel-input" id="url-input" type="url" placeholder="https://example.com" inputmode="url">
          <button class="panel-btn primary" id="url-btn" onclick="learnUrl()">페이지 학습</button>
          <div class="panel-result" id="url-result"></div>
        </div>

        <!-- 시뮬레이션 -->
        <div id="tab-sim" class="tab-panel">
          <p class="panel-label">지시사항을 입력하면 AI가 반복 시뮬레이션으로 최적 답변을 학습합니다</p>
          <textarea class="panel-input" id="sim-input" rows="4" placeholder="예: 고객이 환불 요청 시 어떻게 답변해야 하나요?"></textarea>
          <div class="iter-row">
            반복:
            <select class="panel-input" id="sim-iter">
              <option value="3">3회</option>
              <option value="5">5회</option>
              <option value="7">7회</option>
            </select>
          </div>
          <button class="panel-btn warn" id="sim-btn" onclick="runSimulation()">시뮬레이션 학습</button>
          <div class="sim-progress" id="sim-progress"></div>
          <div class="panel-result" id="sim-result"></div>
        </div>

        <!-- 직접 입력 -->
        <div id="tab-manual" class="tab-panel">
          <p class="panel-label">AI가 기억할 내용을 직접 입력합니다</p>
          <input class="panel-input" id="manual-label" placeholder="제목/분류 (선택)">
          <textarea class="panel-input" id="manual-input" rows="5" placeholder="기억시킬 내용을 입력하세요..."></textarea>
          <button class="panel-btn success" onclick="learnManual()">지식 저장</button>
          <div class="panel-result" id="manual-result"></div>
          <hr class="divider">
          <p class="panel-label" style="color:var(--error)">위험: 전체 지식 삭제</p>
          <button class="panel-btn" style="background:#2a0a0a;color:var(--error);border:1px solid #4a1a1a" onclick="clearKnowledge()">전체 지식 삭제</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <header>
      <button id="hamburger" onclick="toggleSidebar()" aria-label="메뉴">☰</button>
      <div id="status-dot"></div>
      <h1>자가 학습 AI</h1>
      <span id="status-label">확인중...</span>
      <select id="model-sel"><option>로딩중...</option></select>
    </header>

    <div id="chat">
      <div id="empty">
        <div class="icon">🧠</div>
        <p>대화할수록 똑똑해지는 자가 학습 AI입니다.<br>
        왼쪽 메뉴(☰)에서 URL/시뮬레이션 학습이 가능합니다.<br>
        모든 대화는 자동으로 지식으로 축적됩니다.</p>
      </div>
    </div>

    <div id="input-area">
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="search-toggle"> 인터넷 검색</label>
        <label class="toggle"><input type="checkbox" id="kb-toggle" checked> 학습 지식 활용</label>
        <label class="toggle"><input type="checkbox" id="learn-toggle" checked> 대화 자동 학습</label>
      </div>
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="메시지 입력... (Enter 전송)"></textarea>
        <button id="send-btn" aria-label="전송">▶</button>
      </div>
    </div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const emptyEl = document.getElementById('empty');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const modelSel = document.getElementById('model-sel');
let messages = [], isStreaming = false, currentUrl = '';

// ── Sidebar (mobile/iPad) ──
function toggleSidebar() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('overlay');
  const isOpen = s.classList.toggle('open');
  o.classList.toggle('show', isOpen);
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ── Tabs ──
function switchTab(name) {
  const names = ['url','sim','manual'];
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

// ── Status & network ──
async function checkStatus() {
  try {
    const r = await fetch('/ai/status');
    const d = await r.json();
    const dot = document.getElementById('status-dot');
    const lbl = document.getElementById('status-label');
    dot.className = d.available ? 'on' : 'off';
    lbl.textContent = d.available ? 'Ollama 연결됨' : 'Ollama 오프라인';
    if (d.available && d.models?.length) {
      modelSel.innerHTML = d.models.map(m =>
        `<option value="${m}"${m===d.defaultModel?' selected':''}>${m}</option>`).join('');
    }
    // KB stats
    const kb = d.knowledge || {};
    document.getElementById('kb-total').textContent = kb.total || 0;
    const by = kb.bySource || {};
    document.getElementById('kb-conv').textContent = by.conversation || 0;
    document.getElementById('kb-url').textContent = by.url || 0;
    document.getElementById('kb-sim').textContent = by.simulation || 0;
    // Network / iPad access
    if (d.network?.urls?.length) {
      currentUrl = d.network.urls[0];
      document.getElementById('connect-url').textContent = currentUrl;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&color=e2e2ef&bgcolor=1a1a26&data=${encodeURIComponent(currentUrl)}`;
      document.getElementById('qr-wrap').innerHTML =
        `<img src="${qrUrl}" width="140" height="140" alt="QR" loading="lazy" onerror="this.style.display='none'">`;
    }
  } catch {}
}

async function copyUrl() {
  if (!currentUrl) return;
  try {
    await navigator.clipboard.writeText(currentUrl);
    const btn = event.target;
    btn.textContent = '복사 완료!';
    setTimeout(() => btn.textContent = '주소 복사', 1500);
  } catch {
    prompt('주소를 복사하세요:', currentUrl);
  }
}

// ── URL learning ──
async function learnUrl() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  const btn = document.getElementById('url-btn');
  const res = document.getElementById('url-result');
  btn.disabled = true; btn.textContent = '학습중...';
  res.style.display = 'none';
  try {
    const r = await fetch('/ai/learn/url', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url}),
    });
    const d = await r.json();
    if (d.ok) {
      res.className = 'panel-result ok';
      res.textContent = `학습 완료 (${d.chunks}개 청크)\n${d.preview}...`;
      document.getElementById('url-input').value = '';
      checkStatus();
    } else throw new Error(d.error);
  } catch(e) {
    res.className = 'panel-result err';
    res.textContent = '오류: ' + e.message;
  } finally {
    res.style.display = 'block';
    btn.disabled = false; btn.textContent = '페이지 학습';
  }
}

// ── Simulation ──
async function runSimulation() {
  const instruction = document.getElementById('sim-input').value.trim();
  const iterations = parseInt(document.getElementById('sim-iter').value);
  if (!instruction) return;
  const btn = document.getElementById('sim-btn');
  const prog = document.getElementById('sim-progress');
  const res = document.getElementById('sim-result');
  btn.disabled = true; prog.style.display = 'block'; res.style.display = 'none';
  try {
    const r = await fetch('/ai/learn/simulate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({instruction, iterations, model: modelSel.value}),
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const part of parts) {
        const em = part.match(/^event: (\w+)/m);
        const dm = part.match(/^data: (.+)$/m);
        if (!em||!dm) continue;
        const data = JSON.parse(dm[1]);
        if (em[1]==='progress') {
          const msgs = {start:'시작...', evaluate:'품질 평가중...', save:'저장중...'};
          prog.textContent = data.step==='generate'
            ? `답변 생성중 (${data.current}/${data.total})...`
            : (msgs[data.step]||data.step);
        } else if (em[1]==='done') {
          res.className = 'panel-result ok';
          res.innerHTML = `<strong>완료!</strong> ${data.bestIndex}번 답변 선택 (${(data.score*10).toFixed(1)}/10점)<br><em>${data.reason}</em><br><br>${data.bestResponse.slice(0,200)}...`;
          res.style.display = 'block';
          document.getElementById('sim-input').value = '';
          checkStatus();
        } else if (em[1]==='error') throw new Error(data.error);
      }
    }
  } catch(e) {
    res.className = 'panel-result err'; res.textContent = '오류: '+e.message; res.style.display = 'block';
  } finally {
    btn.disabled = false; prog.style.display = 'none';
  }
}

// ── Manual ──
async function learnManual() {
  const content = document.getElementById('manual-input').value.trim();
  const label = document.getElementById('manual-label').value.trim();
  if (!content) return;
  const res = document.getElementById('manual-result');
  try {
    const r = await fetch('/ai/learn/manual', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({content, label}),
    });
    const d = await r.json();
    res.className = 'panel-result ok';
    res.textContent = `저장 완료 (${d.chunks}개 청크)`;
    document.getElementById('manual-input').value = '';
    document.getElementById('manual-label').value = '';
    checkStatus();
  } catch(e) {
    res.className = 'panel-result err'; res.textContent = '오류: '+e.message;
  }
  res.style.display = 'block';
}

async function clearKnowledge() {
  if (!confirm('모든 학습 지식을 삭제하시겠습니까?')) return;
  await fetch('/ai/knowledge', {method:'DELETE'});
  checkStatus();
}

// ── Chat ──
function addBubble(role, text='') {
  emptyEl.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg '+role;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role==='user' ? '나' : 'AI';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;
  wrap.appendChild(av);
  wrap.appendChild(bub);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bub;
}

function setTags(bubble, kbSrcs, webSrcs) {
  let tags = bubble.querySelector('.tags');
  if (!tags) { tags = document.createElement('div'); tags.className = 'tags'; bubble.appendChild(tags); }
  tags.innerHTML = '';
  kbSrcs?.slice(0,3).forEach(k => {
    const t = document.createElement('span');
    t.className = 'tag kb';
    t.textContent = `📚 ${k.source} (${Math.round(k.sim*100)}%)`;
    tags.appendChild(t);
  });
  webSrcs?.slice(0,2).forEach(s => {
    const t = document.createElement('span');
    t.className = 'tag web';
    t.innerHTML = `🔍 <a href="${s.url}" target="_blank" rel="noopener">${(s.title||s.url).slice(0,28)}</a>`;
    tags.appendChild(t);
  });
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isStreaming) return;
  isStreaming = true; sendBtn.disabled = true;
  inputEl.value = ''; inputEl.style.height = 'auto';
  // Close sidebar on mobile after sending
  if (window.innerWidth <= 900) closeSidebar();

  messages.push({role:'user', content:text});
  addBubble('user', text);
  const aiBub = addBubble('ai');
  aiBub.classList.add('streaming');
  let aiText = '', kbSrcs = [], webSrcs = [];
  try {
    const r = await fetch('/ai/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        messages,
        useSearch: document.getElementById('search-toggle').checked,
        useKnowledge: document.getElementById('kb-toggle').checked,
        autoLearn: document.getElementById('learn-toggle').checked,
        model: modelSel.value,
      }),
    });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.statusText);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const part of parts) {
        const em = part.match(/^event: (\w+)/m);
        const dm = part.match(/^data: (.+)$/m);
        if (!em||!dm) continue;
        const data = JSON.parse(dm[1]);
        if (em[1]==='token') {
          aiText += data.token;
          aiBub.textContent = aiText;
          setTags(aiBub, kbSrcs, webSrcs);
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (em[1]==='knowledge') kbSrcs = data;
        else if (em[1]==='sources') webSrcs = data;
        else if (em[1]==='done') break;
        else if (em[1]==='error') throw new Error(data.error);
      }
    }
    messages.push({role:'assistant', content:aiText});
    setTags(aiBub, kbSrcs, webSrcs);
    setTimeout(checkStatus, 2000);
  } catch(e) {
    aiBub.textContent = '오류: '+e.message;
    messages.pop();
  } finally {
    aiBub.classList.remove('streaming');
    isStreaming = false; sendBtn.disabled = false; inputEl.focus();
  }
}

// ── Input auto-resize ──
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140)+'px';
});
inputEl.addEventListener('keydown', e => {
  // iPad: Shift+Enter = newline, Enter = send
  if (e.key==='Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

// ── Init ──
checkStatus();
setInterval(checkStatus, 30000);
// Focus only on desktop (iPad keyboard shouldn't auto-open)
if (!('ontouchstart' in window)) inputEl.focus();
</script>
