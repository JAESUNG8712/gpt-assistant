<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>📊 예산관리</title>
<style>
  :root {
    --bg:#f4f6f9; --surface:#fff; --surface2:#f3f5f8; --surface3:#eaedf2;
    --border:#e2e6ec; --border-bright:#cdd3dc;
    --text:#41474f; --text-bright:#1a1d23; --text-dim:#818a94;
    --accent:#1565c0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text-bright);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }

  .toolbar {
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    padding:10px 16px; background:var(--surface); border-bottom:2px solid var(--border-bright);
    flex-shrink:0;
  }
  .toolbar-title { font-size:1rem; font-weight:700; margin-right:8px; white-space:nowrap; color:var(--text-bright); }
  .btn {
    padding:6px 12px; border-radius:7px; font-size:0.82rem; cursor:pointer;
    border:1px solid var(--border-bright); background:var(--surface3); color:var(--text-bright);
    white-space:nowrap;
  }
  .btn:hover { background:var(--border-bright); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover { background:#1251a3; }
  .btn-danger { color:#c0392b; }
  #status { font-size:0.75rem; color:var(--text-dim); margin-left:4px; }

  .hint {
    font-size:0.72rem; color:var(--text-dim); padding:5px 16px;
    background:var(--surface); flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .hint code { background:var(--surface3); padding:1px 4px; border-radius:3px; font-size:0.7rem; }

  .grid-wrap { overflow:auto; flex:1; padding:12px 16px; }
  table { border-collapse:collapse; font-size:0.82rem; }
  th, td { border:1px solid var(--border); padding:2px 6px; white-space:nowrap; overflow:hidden; }
  th { background:var(--surface2); color:var(--text-dim); font-weight:600; text-align:center;
       position:sticky; top:0; z-index:2; min-width:90px; }
  th.rh { position:sticky; left:0; top:0; z-index:3; min-width:36px; }
  td.rh { background:var(--surface2); position:sticky; left:0; z-index:1;
           text-align:center; color:var(--text-dim); }
  td[contenteditable] { outline:none; cursor:text; height:26px; min-width:90px; color:var(--text); }
  td[contenteditable]:focus { background:rgba(21,101,192,0.1); }
  td.err { color:#e57373; }

  .empty-state { padding:60px 20px; text-align:center; color:var(--text-dim); }
  .empty-state .icon { font-size:3rem; margin-bottom:16px; }
  .empty-state h3 { font-size:1rem; font-weight:600; color:var(--text-bright); margin-bottom:10px; }
  .empty-state p { font-size:0.85rem; line-height:1.8; }

  .snap-area {
    padding:10px 16px; border-top:1px solid var(--border);
    background:var(--surface); flex-shrink:0;
  }
  .snap-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .snap-row:last-child { margin-bottom:0; }
  input[type=text], select {
    background:var(--surface2); color:var(--text-bright); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:0.78rem;
  }
  #snap-label { width:160px; }
  #diff { margin-top:8px; font-size:0.78rem; overflow-x:auto; }
  .diff-table { border-collapse:collapse; }
  .diff-table th, .diff-table td { border:1px solid var(--border); padding:3px 8px; }
  .diff-table th { background:var(--surface2); }
  .diff-add { color:#2e7d32; }
  .diff-sub { color:#c62828; }
</style>
</head>
<body>

<!-- 툴바 -->
<div class="toolbar">
  <span class="toolbar-title">📊 예산관리</span>
  <button class="btn" onclick="document.getElementById('file-input').click()">📂 파일 업로드</button>
  <input type="file" id="file-input" accept=".xlsx,.xls,.csv" onchange="upload(this)">
  <button class="btn btn-primary" onclick="save()">💾 저장</button>
  <button class="btn" onclick="download()">⬇️ xlsx 다운로드</button>
  <button class="btn" onclick="addRow()">➕ 행 추가</button>
  <button class="btn" onclick="addCol()">➕ 열 추가</button>
  <span id="status"></span>
</div>

<!-- 힌트 -->
<div class="hint">
  셀 클릭 후 직접 입력 · 엑셀에서 복사(Ctrl+C) 후 셀 클릭하고 Ctrl+V 붙여넣기 ·
  수식: <code>=SUM(A1:A5)</code> <code>=AVERAGE(B2:D2)</code> <code>=A1+B1*2</code>
</div>

<!-- 그리드 -->
<div class="grid-wrap" id="grid-wrap">
  <div class="empty-state" id="empty-state">
    <div class="icon">📊</div>
    <h3>예산 시트가 비어 있습니다</h3>
    <p>
      <b>📂 파일 업로드</b>로 엑셀·CSV를 가져오거나,<br>
      <b>➕ 행/열 추가</b>로 직접 입력하거나,<br>
      엑셀에서 셀 복사 후 <b>빈 셀 클릭 → Ctrl+V</b>로 붙여넣으세요.
    </p>
  </div>
  <table id="sheet"></table>
</div>

<!-- 스냅샷 영역 -->
<div class="snap-area">
  <div class="snap-row">
    <input type="text" id="snap-label" placeholder="예: 2026-06 최종">
    <button class="btn btn-primary" onclick="saveSnap()">📌 월별 최종 저장</button>
    <span id="snap-status" style="font-size:0.75rem;color:var(--text-dim)"></span>
  </div>
  <div class="snap-row">
    <span style="font-size:0.78rem;color:var(--text-dim)">비교:</span>
    <select id="cmp-a"><option value="current">현재 시트</option></select>
    <span style="font-size:0.78rem;color:var(--text-dim)">vs</span>
    <select id="cmp-b"><option value="current">현재 시트</option></select>
    <button class="btn" onclick="compare()">🔍 비교</button>
    <button class="btn btn-danger" onclick="deleteSnap()">🗑️ 삭제</button>
  </div>
  <div id="diff"></div>
</div>

<script>
let grid = [];
const MIN_ROWS = 20, MIN_COLS = 12;

// ── 초기화 ──────────────────────────────────────────
window.onload = () => { load(); };

async function load() {
  try {
    const r = await fetch('/budget/grid');
    const d = await r.json();
    grid = (d.rows || []).map(row => row.map(c => c == null ? '' : String(c)));
  } catch(e) { grid = []; }
  ensureSize();
  render();
  loadSnaps();
}

// ── 그리드 헬퍼 ─────────────────────────────────────
function ensureSize() {
  while (grid.length < MIN_ROWS) grid.push([]);
  const mc = Math.max(MIN_COLS, ...grid.map(r => r.length));
  grid.forEach(r => { while (r.length < mc) r.push(''); });
}

function colLetters(idx) {
  let s = '', n = idx + 1;
  while (n > 0) { const r = (n-1)%26; s = String.fromCharCode(65+r)+s; n = Math.floor((n-1)/26); }
  return s;
}
function colIdx(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n*26 + (ch.charCodeAt(0)-64);
  return n-1;
}

function hasData() {
  return grid.some(row => row.some(c => c !== ''));
}

function render() {
  const empty = document.getElementById('empty-state');
  const table = document.getElementById('sheet');
  empty.style.display = hasData() ? 'none' : 'block';

  const nRows = grid.length;
  const nCols = Math.max(MIN_COLS, ...grid.map(r => r.length));
  let html = '<tr><th class="rh"></th>';
  for (let c = 0; c < nCols; c++) html += `<th>${colLetters(c)}</th>`;
  html += '</tr>';
  for (let r = 0; r < nRows; r++) {
    html += `<tr><td class="rh">${r+1}</td>`;
    for (let c = 0; c < nCols; c++) {
      const raw = (grid[r] && grid[r][c] != null) ? grid[r][c] : '';
      const disp = renderCell(raw);
      const isErr = String(disp).startsWith('#ERR');
      html += `<td contenteditable${isErr ? ' class="err"' : ''} data-r="${r}" data-c="${c}" data-raw="${escAttr(raw)}">${escHtml(disp)}</td>`;
    }
    html += '</tr>';
  }
  table.innerHTML = html;

  table.querySelectorAll('td[contenteditable]').forEach(td => {
    td.addEventListener('focus', e => {
      e.target.textContent = e.target.getAttribute('data-raw') || '';
    });
    td.addEventListener('blur', e => {
      const r = +e.target.dataset.r, c = +e.target.dataset.c;
      const raw = e.target.textContent.trim();
      while (grid.length <= r) grid.push([]);
      while (grid[r].length <= c) grid[r].push('');
      grid[r][c] = raw;
      e.target.setAttribute('data-raw', escAttr(raw));
      const disp = renderCell(raw);
      e.target.textContent = disp;
      e.target.className = String(disp).startsWith('#ERR') ? 'err' : '';
    });
    td.addEventListener('paste', e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      const sr = +e.target.dataset.r, sc = +e.target.dataset.c;
      const lines = text.replace(/\r/g, '').split('\n');
      while (lines.length && lines[lines.length-1] === '') lines.pop();
      lines.forEach((line, i) => {
        const cells = line.split('\t');
        cells.forEach((val, j) => {
          const r = sr+i, c = sc+j;
          while (grid.length <= r) grid.push([]);
          while (grid[r].length <= c) grid[r].push('');
          grid[r][c] = val;
        });
      });
      ensureSize(); render();
    });
  });
}

// ── 수식 평가 (eval 미사용) ──────────────────────────
function renderCell(raw) {
  if (typeof raw !== 'string' || !raw.startsWith('=')) return raw;
  try { return evalFormula(raw.slice(1)); } catch(e) { return '#ERR'; }
}
function cellVal(ref, vis) {
  const m = /^([A-Za-z]+)(\d+)$/.exec(ref);
  if (!m) throw new Error('ref');
  const col = colIdx(m[1]), row = parseInt(m[2], 10) - 1;
  const key = `${row}_${col}`;
  if (vis.has(key)) throw new Error('circular');
  const raw = (grid[row] && grid[row][col] != null) ? grid[row][col] : '';
  if (typeof raw === 'string' && raw.startsWith('=')) {
    vis.add(key); const v = evalFormula(raw.slice(1), vis); vis.delete(key); return v;
  }
  const n = Number(String(raw).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}
function rangeVals(a, b, vis) {
  const ma = /^([A-Za-z]+)(\d+)$/.exec(a), mb = /^([A-Za-z]+)(\d+)$/.exec(b);
  const c1=colIdx(ma[1]),r1=parseInt(ma[2],10)-1, c2=colIdx(mb[1]),r2=parseInt(mb[2],10)-1;
  const vals = [];
  for (let r=Math.min(r1,r2); r<=Math.max(r1,r2); r++)
    for (let c=Math.min(c1,c2); c<=Math.max(c1,c2); c++)
      vals.push(cellVal(colLetters(c)+(r+1), vis));
  return vals;
}
const FUNCS = {
  SUM: v => v.reduce((a,b) => a+b, 0),
  AVERAGE: v => v.length ? v.reduce((a,b) => a+b, 0)/v.length : 0,
  MAX: v => v.length ? Math.max(...v) : 0,
  MIN: v => v.length ? Math.min(...v) : 0,
  COUNT: v => v.length
};
function evalFormula(expr, vis) {
  vis = vis || new Set();
  const toks = tokenize(expr); let pos = 0;
  const peek = () => toks[pos], next = () => toks[pos++];
  function expr_() { let v=term(); while(peek()==='+'||peek()==='-'){const op=next();v=op==='+'?v+term():v-term();} return v; }
  function term() { let v=factor(); while(peek()==='*'||peek()==='/'){const op=next();const r=factor();v=op==='*'?v*r:v/r;} return v; }
  function factor() {
    if(peek()==='-'){next();return -factor();} if(peek()==='+'){next();return factor();}
    if(peek()==='('){next();const v=expr_();if(peek()!==')')throw new Error(')');next();return v;}
    const t=next(); if(t===undefined) throw new Error('eof');
    if(/^[A-Za-z_]+$/.test(t)&&FUNCS[t.toUpperCase()]){
      const fn=t.toUpperCase(); if(next()!=='(')throw new Error('(');
      const args=[]; if(peek()!==')'){ args.push(rangeOrExpr()); while(peek()===','){next();args.push(rangeOrExpr());} }
      if(next()!==')')throw new Error(')'); return FUNCS[fn](args.flat());
    }
    if(/^[A-Za-z]+\d+$/.test(t)){if(peek()===':'){next();const t2=next();return rangeVals(t,t2,vis);} return cellVal(t,vis);}
    const n=Number(t); if(!isNaN(n)) return n; throw new Error('token:'+t);
  }
  function rangeOrExpr(){ const v=expr_(); return Array.isArray(v)?v:[v]; }
  const result=expr_(); return Array.isArray(result)?result.reduce((a,b)=>a+b,0):result;
}
function tokenize(s) {
  const re=/\s*([A-Za-z]+\d+|[A-Za-z_]+|\d+\.?\d*|[()+\-*/,:])\s*/g;
  const toks=[]; let m, last=0;
  while((m=re.exec(s))!==null){ if(m.index!==last)throw new Error('invalid'); toks.push(m[1]); last=re.lastIndex; }
  if(last!==s.length) throw new Error('trailing'); return toks;
}

// ── 유틸 ────────────────────────────────────────────
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function setStatus(msg, ok=true) {
  const el = document.getElementById('status');
  el.textContent = msg; el.style.color = ok ? '#2e7d32' : '#c62828';
  if (ok) setTimeout(() => { el.textContent = ''; }, 3000);
}

// ── 저장 / 업로드 / 다운로드 ────────────────────────
function addRow() { grid.push([]); ensureSize(); render(); }
function addCol() { grid.forEach(r => r.push('')); ensureSize(); render(); }

async function save() {
  setStatus('저장 중...');
  try {
    const r = await fetch('/budget/grid', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rows: grid})
    });
    if (r.ok) setStatus('✅ 저장됨');
    else setStatus('저장 실패', false);
  } catch(e) { setStatus('저장 실패', false); }
}

async function upload(input) {
  const file = input.files[0]; if (!file) return;
  setStatus('업로드 중...');
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch('/budget/grid/upload', {method:'POST', body:fd});
    const d = await r.json();
    if (r.ok) { setStatus(`✅ ${d.rows}행 업로드됨`); await load(); }
    else setStatus(d.detail || '업로드 실패', false);
  } catch(e) { setStatus('업로드 실패', false); }
  input.value = '';
}

async function download() {
  try {
    const r = await fetch('/budget/grid/download');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='budget.xlsx'; a.click();
    URL.revokeObjectURL(url);
  } catch(e) { setStatus('다운로드 실패', false); }
}

// ── 스냅샷 ──────────────────────────────────────────
async function loadSnaps() {
  try {
    const r = await fetch('/budget/grid/snapshots');
    const d = await r.json();
    const snaps = d.snapshots || [];
    ['cmp-a','cmp-b'].forEach(id => {
      const sel = document.getElementById(id);
      while (sel.options.length > 1) sel.remove(1);
      snaps.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id; opt.textContent = `${s.label} (${s.createdAt.slice(0,10)})`;
        sel.appendChild(opt);
      });
    });
  } catch(e) {}
}

async function saveSnap() {
  const label = document.getElementById('snap-label').value.trim();
  if (!label) { alert('스냅샷 이름을 입력하세요'); return; }
  const st = document.getElementById('snap-status');
  st.textContent = '저장 중...';
  try {
    const r = await fetch('/budget/grid/snapshot', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({label, rows: grid})
    });
    if (r.ok) { st.textContent='✅ 저장됨'; st.style.color='#2e7d32'; loadSnaps(); }
    else { st.textContent='실패'; st.style.color='#c62828'; }
  } catch(e) { st.textContent='실패'; st.style.color='#c62828'; }
}

async function deleteSnap() {
  const id = document.getElementById('cmp-a').value;
  if (id === 'current') { alert('스냅샷을 선택하세요'); return; }
  if (!confirm('이 스냅샷을 삭제하시겠습니까?')) return;
  await fetch('/budget/grid/snapshot/'+id, {method:'DELETE'});
  loadSnaps();
}

async function compare() {
  const a = document.getElementById('cmp-a').value;
  const b = document.getElementById('cmp-b').value;
  try {
    const r = await fetch(`/budget/grid/compare?a=${a}&b=${b}`);
    const d = await r.json();
    const diffs = d.diffs || [];
    const el = document.getElementById('diff');
    if (!diffs.length) { el.innerHTML='<span style="color:#2e7d32">차이 없음</span>'; return; }
    let html = `<b>${diffs.length}개 셀 변경:</b><br><table class="diff-table"><tr><th>셀</th><th>이전</th><th>이후</th><th>차이</th></tr>`;
    diffs.slice(0,50).forEach(df => {
      const delta = df.delta != null ? (df.delta >= 0 ? `<span class="diff-add">+${df.delta.toLocaleString()}</span>` : `<span class="diff-sub">${df.delta.toLocaleString()}</span>`) : '-';
      html += `<tr><td>${df.cell}</td><td>${escHtml(df.before)}</td><td>${escHtml(df.after)}</td><td>${delta}</td></tr>`;
    });
    html += '</table>';
    el.innerHTML = html;
  } catch(e) { document.getElementById('diff').textContent = '비교 실패'; }
}
</script>
</body>
</html>
