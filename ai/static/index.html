<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="나만의 AI">
  <title>나만의 AI 어시스턴트</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --primary: #58a6ff;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --user-bg: #1f6feb;
      --ai-bg: #21262d;
      --danger: #f85149;
      --success: #3fb950;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* 레이아웃 */
    .app { display: flex; height: 100%; height: 100dvh; }

    /* 사이드바 */
    .sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    @media (max-width: 680px) {
      .sidebar { display: none; }
      .sidebar.open { display: flex; position: fixed; inset: 0; z-index: 100; width: 80%; }
    }

    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h2 { font-size: 0.9rem; font-weight: 700; color: var(--primary); }
    .sidebar-header p { font-size: 0.72rem; color: var(--text-dim); margin-top: 3px; }

    .sidebar-section { padding: 14px 12px 0; }
    .sidebar-section label {
      font-size: 0.7rem; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.08em;
      display: block; margin-bottom: 8px;
    }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
    .stat-box {
      background: var(--surface2); border-radius: 8px; padding: 10px;
      text-align: center;
    }
    .stat-box strong { display: block; font-size: 1.2rem; color: var(--primary); }
    .stat-box span { font-size: 0.68rem; color: var(--text-dim); }

    .sidebar-btn {
      width: 100%; padding: 9px 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 0.82rem; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px; transition: background 0.15s;
    }
    .sidebar-btn:hover { background: var(--border); }
    .sidebar-btn.danger { color: var(--danger); }

    .upload-area {
      border: 1px dashed var(--border); border-radius: 8px;
      padding: 14px; text-align: center;
      cursor: pointer; margin-bottom: 8px;
      transition: border-color 0.2s;
      font-size: 0.78rem; color: var(--text-dim);
    }
    .upload-area:hover { border-color: var(--primary); color: var(--primary); }

    .search-input-row {
      display: flex; gap: 6px; margin-bottom: 6px;
    }
    .search-input-row input {
      flex: 1; padding: 8px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.8rem;
    }
    .search-input-row input:focus { outline: none; border-color: var(--primary); }
    .search-input-row button {
      padding: 8px 12px;
      background: var(--primary); color: #000;
      border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.8rem;
    }

    .doc-list { font-size: 0.75rem; color: var(--text-dim); max-height: 100px; overflow-y: auto; }
    .doc-item { padding: 4px 0; border-bottom: 1px solid var(--border); }

    /* 채팅 영역 */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }

    .chat-header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    }
    .menu-btn {
      display: none; background: none; border: none; color: var(--text);
      font-size: 1.2rem; cursor: pointer; padding: 4px;
    }
    @media (max-width: 680px) { .menu-btn { display: block; } }

    .model-badge {
      font-size: 0.7rem; background: var(--surface2); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 20px; color: var(--text-dim); margin-left: auto;
    }

    .messages {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0; margin-top: 2px;
    }
    .msg.user .msg-avatar { background: var(--user-bg); }
    .msg.ai .msg-avatar { background: var(--surface2); border: 1px solid var(--border); }

    .msg-bubble {
      max-width: 75%; padding: 12px 16px; border-radius: 14px;
      font-size: 0.88rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .msg-bubble { background: var(--user-bg); border-radius: 14px 4px 14px 14px; }
    .msg.ai .msg-bubble {
      background: var(--ai-bg); border: 1px solid var(--border);
      border-radius: 4px 14px 14px 14px;
    }

    .typing .msg-bubble::after {
      content: '▋'; animation: blink 0.7s infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

    /* 입력창 */
    .input-area {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
    }

    .search-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; cursor: pointer;
    }
    .search-toggle input { accent-color: var(--primary); }

    .input-row { display: flex; gap: 10px; }
    .input-row textarea {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 0.9rem;
      padding: 12px 14px; resize: none; max-height: 120px; min-height: 44px;
      line-height: 1.5; font-family: inherit;
    }
    .input-row textarea:focus { outline: none; border-color: var(--primary); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--primary); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: #000; transition: opacity 0.2s; flex-shrink: 0;
      align-self: flex-end;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 토스트 */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 10px 20px; border-radius: 25px; font-size: 0.82rem;
      opacity: 0; transition: opacity 0.3s; z-index: 999; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    .welcome {
      text-align: center; color: var(--text-dim); margin: auto;
      padding: 40px 20px;
    }
    .welcome h3 { font-size: 1.1rem; margin-bottom: 10px; color: var(--text); }
    .welcome p { font-size: 0.85rem; line-height: 1.8; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .chip {
      background: var(--surface2); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
      transition: background 0.15s;
    }
    .chip:hover { background: var(--border); }

    /* 오버레이 */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 99;
    }
    .overlay.show { display: block; }
  </style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="app">
  <!-- 사이드바 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>🤖 나만의 AI</h2>
      <p>대화할수록 똑똑해지는 전용 어시스턴트</p>
    </div>

    <div style="flex:1; overflow-y:auto; padding-bottom:12px;">

      <!-- 메모리 통계 -->
      <div class="sidebar-section">
        <label>📊 학습 현황</label>
        <div class="stats-grid">
          <div class="stat-box"><strong id="stat-conv">-</strong><span>대화 수</span></div>
          <div class="stat-box"><strong id="stat-doc">-</strong><span>문서 수</span></div>
          <div class="stat-box" style="grid-column:1/-1">
            <strong id="stat-vec">-</strong><span>기억 청크 (RAG)</span>
          </div>
        </div>
      </div>

      <!-- 문서 학습 -->
      <div class="sidebar-section">
        <label>📄 문서 학습</label>
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
          📁 파일 선택 (txt, md, csv)
        </div>
        <input type="file" id="file-input" style="display:none" accept=".txt,.md,.csv,.json"
               onchange="uploadDocument(this)">
        <div class="doc-list" id="doc-list"></div>
      </div>

      <!-- 인터넷 검색 학습 -->
      <div class="sidebar-section">
        <label>🌐 인터넷 검색 학습</label>
        <div class="search-input-row">
          <input type="text" id="search-query" placeholder="검색어 입력..." onkeydown="if(event.key==='Enter')learnSearch()">
          <button onclick="learnSearch()">학습</button>
        </div>
      </div>

      <!-- OneDrive 백업 -->
      <div class="sidebar-section">
        <label>☁️ 백업</label>
        <button class="sidebar-btn" onclick="backupOneDrive()">
          <span>💾</span> OneDrive에 백업
        </button>
      </div>

      <!-- 대화 초기화 -->
      <div class="sidebar-section">
        <label>⚙️ 설정</label>
        <button class="sidebar-btn danger" onclick="clearHistory()">
          <span>🗑️</span> 대화 기록 초기화
        </button>
      </div>
    </div>
  </aside>

  <!-- 채팅 영역 -->
  <main class="chat-area">
    <header class="chat-header">
      <button class="menu-btn" onclick="openSidebar()">☰</button>
      <strong style="font-size:0.95rem">나만의 AI 어시스턴트</strong>
      <span class="model-badge" id="model-badge">Llama 3.1 8B · Groq</span>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h3>안녕하세요! 나만의 AI입니다 🤖</h3>
        <p>대화할수록 학습하고 기억합니다.<br>문서를 업로드하거나 인터넷 검색으로 지식을 추가할 수 있어요.</p>
        <div class="chips">
          <div class="chip" onclick="quickAsk('오늘 뭘 도와드릴까요?')">뭘 할 수 있어?</div>
          <div class="chip" onclick="quickAsk('간단한 파이썬 코드 예시를 보여줘')">코드 작성</div>
          <div class="chip" onclick="quickAsk('최신 AI 트렌드를 검색해서 알려줘', true)">🌐 최신 정보 검색</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <label class="search-toggle">
        <input type="checkbox" id="use-search">
        🌐 인터넷 검색 후 답변 (최신 정보 포함)
      </label>
      <div class="input-row">
        <textarea id="msg-input" placeholder="메시지를 입력하세요..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  let isLoading = false;

  // ── 통계 로드 ──────────────────────────────
  async function loadStats() {
    try {
      const r = await fetch('/memory/stats');
      const d = await r.json();
      document.getElementById('stat-conv').textContent = d.conversations;
      document.getElementById('stat-doc').textContent = d.documents;
      document.getElementById('stat-vec').textContent = d.vector_chunks;
    } catch {}
  }

  async function loadDocs() {
    try {
      const r = await fetch('/memory/documents');
      const d = await r.json();
      const el = document.getElementById('doc-list');
      el.innerHTML = d.documents.slice(0, 5).map(doc =>
        `<div class="doc-item">📄 ${doc.name}</div>`
      ).join('') || '<div style="font-size:0.75rem;color:var(--text-dim);padding:4px 0">업로드된 문서 없음</div>';
    } catch {}
  }

  // ── 채팅 ──────────────────────────────────
  function appendMsg(role, content, isTyping = false) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}${isTyping ? ' typing' : ''}`;
    div.innerHTML = `
      <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="msg-bubble">${escHtml(content)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const msg = input.value.trim();
    if (!msg || isLoading) return;

    const useSearch = document.getElementById('use-search').checked;
    input.value = '';
    autoResize(input);

    appendMsg('user', msg);
    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    const aiDiv = appendMsg('ai', '', true);
    const bubble = aiDiv.querySelector('.msg-bubble');
    let full = '';

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, use_search: useSearch }),
      });
      if (!resp.ok) throw new Error(await resp.text());

      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        full += dec.decode(value, { stream: true });
        bubble.textContent = full;
        document.getElementById('messages').scrollTop = 9999;
      }
      aiDiv.classList.remove('typing');
    } catch (e) {
      bubble.textContent = '오류가 발생했습니다: ' + e.message;
      aiDiv.classList.remove('typing');
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    await loadStats();
  }

  function quickAsk(msg, search = false) {
    document.getElementById('msg-input').value = msg;
    document.getElementById('use-search').checked = search;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // ── 문서 업로드 ───────────────────────────
  async function uploadDocument(input) {
    const file = input.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    showToast('📄 문서 학습 중...');
    try {
      const r = await fetch('/learn/document', { method: 'POST', body: fd });
      const d = await r.json();
      showToast(`✅ "${d.filename}" 학습 완료 (${d.chars.toLocaleString()}자)`);
      await loadDocs(); await loadStats();
    } catch { showToast('❌ 업로드 실패'); }
    input.value = '';
  }

  // ── 인터넷 검색 학습 ─────────────────────
  async function learnSearch() {
    const q = document.getElementById('search-query').value.trim();
    if (!q) return;
    showToast('🌐 검색 학습 중...');
    try {
      const r = await fetch('/learn/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q }),
      });
      const d = await r.json();
      showToast(`✅ "${q}" 검색 결과 ${d.learned}건 학습 완료`);
      document.getElementById('search-query').value = '';
      await loadStats();
    } catch { showToast('❌ 검색 실패'); }
  }

  // ── OneDrive 백업 ────────────────────────
  async function backupOneDrive() {
    showToast('☁️ OneDrive 백업 중...');
    try {
      const r = await fetch('/backup/onedrive', { method: 'POST' });
      const d = await r.json();
      showToast(`✅ 백업 완료: ${d.filename}`);
    } catch (e) {
      showToast('⚠️ 백업 실패 (OneDrive 설정 확인)');
    }
  }

  // ── 대화 초기화 ───────────────────────────
  async function clearHistory() {
    if (!confirm('대화 기록을 모두 삭제할까요?\n(학습된 기억은 유지됩니다)')) return;
    await fetch('/history', { method: 'DELETE' });
    document.getElementById('messages').innerHTML =
      `<div class="welcome" id="welcome">
        <h3>대화 기록이 초기화되었습니다 🤖</h3>
        <p>학습된 기억(RAG)은 유지됩니다.</p>
       </div>`;
    await loadStats();
  }

  // ── 사이드바 (모바일) ─────────────────────
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  // ── 토스트 ───────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── 모델 정보 ─────────────────────────────
  async function loadModelInfo() {
    try {
      const r = await fetch('/model-info');
      const d = await r.json();
      document.getElementById('model-badge').textContent =
        `${d.model} · ${d.provider}`;
    } catch {}
  }

  // ── 초기화 ───────────────────────────────
  loadStats();
  loadDocs();
  loadModelInfo();
</script>
</body>
</html>
