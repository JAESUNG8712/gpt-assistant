name: GitHub Pages 배포

on:
  push:
    # main은 별도 앱(Vercel 등)과 연계되어 있어 건드리지 않음 — 이 게임은
    # 전용 개발 브랜치에서 바로 Pages로 배포한다
    branches: [claude/mobile-tower-defense-game-qfew2j]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    # 수동 실행 가능 (GitHub Actions 탭 → Run workflow)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: public/ 폴더 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
