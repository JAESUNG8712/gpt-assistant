name: 주식 정기 분석 보고서

on:
  schedule:
    # 한국시간(KST, UTC+9) 기준 평일 오전 7시 = UTC 전날 22시 → 일~목요일(UTC) 22:00
    - cron: '0 22 * * 0,1,2,3,4'
    # 한국시간 기준 평일 저녁 10시 = UTC 같은 날 13시 → 월~금요일(UTC) 13:00
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    # 수동 실행 가능 (GitHub Actions 탭 → Run workflow) — 주말에도 즉시 테스트 가능

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 주식 분석 보고서 생성 요청
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_TOKEN}" || { echo "::error::BACKUP_TOKEN secret가 없습니다."; exit 1; }
          curl -fsS --retry 5 --retry-all-errors --retry-delay 15 --max-time 180 \
            "https://ai-assist-aosk.onrender.com/health" -o /dev/null
          curl -fsS --max-time 30 \
            "https://ai-assist-aosk.onrender.com/stock/status" -o before.json
          before_run=$(python - <<'PY'
          import json
          with open('before.json', encoding='utf-8') as f:
              print(json.load(f).get('마지막실행') or '-')
          PY
          )
          http_code=$(curl -sS -X POST \
            --max-time 180 \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${BACKUP_TOKEN}" \
            -d '{}' \
            "https://ai-assist-aosk.onrender.com/stock/analyze" \
            -o response.json -w '%{http_code}')
          echo "HTTP ${http_code}"
          cat response.json
          echo ""
          if [ "$http_code" -ge 400 ]; then
            echo "::error::주식 분석 요청 실패 (HTTP ${http_code})"
            exit 1
          fi
          python -m json.tool response.json >/dev/null

          # HTTP 200은 작업 접수일 뿐이다. 실제 보고서가 만들어질 때까지 확인해야
          # 백그라운드 예외를 성공으로 오판하지 않는다(최대 15분).
          for attempt in $(seq 1 60); do
            curl -fsS --max-time 30 \
              "https://ai-assist-aosk.onrender.com/stock/status" -o status.json
            read -r running has_report last_run < <(python - <<'PY'
          import json
          with open('status.json', encoding='utf-8') as f:
              status = json.load(f)
          print(str(bool(status.get('실행중'))).lower(),
                str(bool(status.get('보고서있음'))).lower(),
                status.get('마지막실행') or '-')
          PY
            )
            echo "확인 ${attempt}/60: running=${running}, report=${has_report}, last_run=${last_run}"
            if [ "${running}" = "false" ]; then
              if [ "${has_report}" = "true" ] && [ "${last_run}" != "-" ] && [ "${last_run}" != "${before_run}" ]; then
                echo "주식 분석 보고서 생성 완료: ${last_run}"
                exit 0
              fi
              echo "::error::분석이 종료됐지만 보고서가 생성되지 않았습니다."
              exit 1
            fi
            sleep 15
          done
          echo "::error::주식 분석이 15분 안에 완료되지 않았습니다."
          exit 1
