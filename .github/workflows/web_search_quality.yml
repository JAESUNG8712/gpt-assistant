name: 웹검색 출처 품질 회귀 테스트

on:
  push:
    branches: [claude/account-pinned-agents-v6W7p]
    paths:
      - "ai/**/*.py"
      - "ai/static/index.html"
      - ".github/workflows/web_search_quality.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: 테스트 의존성 설치
        run: python -m pip install -r ai/requirements.txt
      - name: AI 전체 회귀 테스트
        working-directory: ai
        env:
          DB_PATH: ${{ runner.temp }}/search-quality.db
        run: |
          python -m compileall -q .
          for test_file in test_*.py; do
            echo "::group::${test_file}"
            python "${test_file}"
            echo "::endgroup::"
          done
      - name: 채팅 화면 JavaScript 구문 검증
        working-directory: ai
        run: >-
          node -e "const fs=require('fs'),s=fs.readFileSync('static/index.html','utf8'),m=[...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];
          for(const x of m)new Function(x[1]); console.log('inline JS syntax: PASS ('+m.length+' scripts)')"
