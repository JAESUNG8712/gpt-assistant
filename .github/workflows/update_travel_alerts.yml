name: 여행경보 데이터 자동 업데이트

on:
  schedule:
    # 매주 목요일 오전 3시 UTC (한국시간 낮 12시) — update_laws.yml과 겹치지 않게 요일 분리
    - cron: '0 3 * * 4'
  workflow_dispatch:
    # 수동 실행 가능 (GitHub Actions 탭 → Run workflow)

jobs:
  update-travel-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: 여행경보 데이터 갱신 요청 (배포된 서버가 직접 수집·저장)
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          http_code=$(curl -sS -X POST \
            --retry 2 --retry-delay 10 --max-time 120 \
            "https://ai-assist-aosk.onrender.com/admin/refresh-travel-alerts?token=${BACKUP_TOKEN}" \
            -o response.json -w '%{http_code}')
          echo "HTTP ${http_code}"
          cat response.json
          echo ""
          if [ "$http_code" -ge 400 ]; then
            echo "::error::여행경보 데이터 갱신 요청 실패 (HTTP ${http_code})"
            exit 1
          fi
