name: 여행경보 데이터 자동 업데이트

on:
  schedule:
    # 매주 목요일 오전 3시 UTC (한국시간 낮 12시) — update_laws.yml과 겹치지 않게 요일 분리
    - cron: '0 3 * * 4'
  workflow_dispatch:
    # 수동 실행 가능 (GitHub Actions 탭 → Run workflow)

permissions:
  contents: write

jobs:
  update-travel-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install httpx

      - name: 여행경보 데이터 다운로드
        env:
          TRAVEL_ALERT_API_KEY: ${{ secrets.TRAVEL_ALERT_API_KEY }}
        run: python ai/fetch_travel_alerts.py

      - name: 변경사항 확인 및 커밋
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ai/travel_alert_cache.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 여행경보 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
            git push
            echo "✅ 여행경보 데이터 업데이트 완료"
          fi
